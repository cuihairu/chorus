name: ci

on:
  push:
    branches: ["main"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chorus
          POSTGRES_PASSWORD: chorus-ci-test-only
          POSTGRES_DB: chorus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chorus -d chorus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHORUS_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=chorus_test;Username=chorus;Password=chorus-ci-test-only
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Chorus.sln

      - name: Build
        run: dotnet build Chorus.sln -c Release --no-restore

      - name: Test (with coverage)
        run: dotnet test Chorus.sln -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: TestResults/**/coverage.cobertura.xml
          fail_ci_if_error: false

