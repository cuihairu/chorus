name: nightly

on:
  schedule:
    # 03:30 UTC daily, off-peak for shared runners.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Chorus.sln

      - name: Build
        run: dotnet build Chorus.sln -c Release --no-restore

      - name: Test
        run: dotnet test Chorus.sln -c Release --no-build

      - name: Publish server
        run: dotnet publish src/Chorus.Server -c Release -o ./publish

      - name: Upload nightly artifact (rolling, no tag)
        uses: actions/upload-artifact@v6
        with:
          name: chorus-nightly
          path: publish/
          retention-days: 14
          if-no-files-found: error
