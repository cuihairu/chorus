name: nightly

on:
  schedule:
    # 03:30 UTC daily, off-peak for shared runners.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chorus
          POSTGRES_PASSWORD: chorus-ci-test-only
          POSTGRES_DB: chorus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chorus -d chorus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHORUS_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=chorus_test;Username=chorus;Password=chorus-ci-test-only
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Chorus.sln

      - name: Build
        run: dotnet build Chorus.sln -c Release --no-restore

      - name: Test
        run: dotnet test Chorus.sln -c Release --no-build

      - name: Publish server
        run: dotnet publish src/Chorus.Server -c Release -o ./publish

      - name: Upload nightly artifact (rolling, no tag)
        uses: actions/upload-artifact@v6
        with:
          name: chorus-nightly
          path: publish/
          retention-days: 14
          if-no-files-found: error
