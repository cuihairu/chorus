syntax = "proto3";

package chorus.m3;
option csharp_namespace = "Chorus.Rpc";

import "Protos/m0.proto";
import "google/api/annotations.proto";

// Multi-node matching and business recovery (architecture 7.1-7.3, 10.1). A mount holds at
// most one active ticket; cancellation races the reservation transaction on the same locked
// ticket rows, so whoever locks first wins visibly. A match partition moves between
// coordinator holders through monotonically increasing terms — an expired term never commits.

message EnqueueTicketRequest {
  string tenant_id = 1;
  string game_id = 2;
  string binding_id = 3;
  string session_id = 4;
  // The composite match partition (tenant/game/rules version/region/platform policy/queue
  // type): candidates only ever meet inside one partition, so a wrong-platform candidate
  // never shares a window with the right one.
  string partition_key = 5;
  string operation_id = 6;
  // 0 = the queued ticket never expires on its own.
  int64 expires_unix_ms = 7;
}

message CancelTicketRequest {
  string tenant_id = 1;
  string game_id = 2;
  string binding_id = 3;
  string operation_id = 4;
}

message GetTicketRequest {
  string tenant_id = 1;
  string game_id = 2;
  string binding_id = 3;
}

message TicketProto {
  string ticket_id = 1;
  string binding_id = 2;
  string state = 3;
  int64 version = 4;
  string partition_key = 5;
  // 0 = the ticket has no expiry of its own.
  int64 expires_unix_ms = 6;
  string reservation_id = 7;
  // The streamer behind the mount: the coordinator's window is self-describing.
  string streamer_id = 8;
  // The scope the ticket lives in — a coordinator pairs candidates and drives rounds for it.
  string tenant_id = 9;
  string game_id = 10;
}

message TicketReply {
  bool found = 1;
  bool duplicate = 2;
  TicketProto ticket = 3;
}

message ListQueuedRequest {
  string partition_key = 1;
  int32 max = 2;
}

message ListQueuedReply { repeated TicketProto tickets = 1; }

message ExpireQueuedRequest { int32 max = 1; }

message ExpireQueuedReply { int64 expired = 1; }

// The partitions with live candidates — the coordinator's discovery scan.
message ListPartitionsReply { repeated string partition_keys = 1; }

// The StreamerServer's match intent (FIX-LINK-03, architecture 6.4): the business path submits
// the mount's intent through the control plane, which verifies the mount is a registered route
// source (FIX-END-02) before forwarding the ticket to the queue the coordinator scans. The
// streamer behind the intent is the route-source row's, never a caller field — the intent names
// the mount (binding + generation) and the control plane joins it to the verified identity.
message SubmitMatchIntentRequest {
  string tenant_id = 1;
  string game_id = 2;
  string binding_id = 3;
  int64 binding_generation = 4;
  string session_id = 5;
  // The composite match partition (the same composition MatchQueue uses); the business path
  // names its default partition, the client path its declared one — two intents only ever meet
  // inside one partition.
  string partition_key = 6;
  string operation_id = 7;
  // 0 = the queued ticket never expires on its own.
  int64 expires_unix_ms = 8;
}

// The intent's exit (FIX-LINK-12): the business path cancels a mount's queued ticket through
// the control plane under the same gate as the submit — the mount named must still be the
// registered route source at its current generation, so a superseded mount cannot cancel the
// new mount's ticket. Whether the ticket can actually cancel stays the data plane's answer:
// only a Queued ticket does; one held by a reservation belongs to its round.
message CancelMatchIntentRequest {
  string tenant_id = 1;
  string game_id = 2;
  string binding_id = 3;
  int64 binding_generation = 4;
  string operation_id = 5;
}

service MatchQueue {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  rpc EnqueueTicket(EnqueueTicketRequest) returns (TicketReply);
  rpc CancelTicket(CancelTicketRequest) returns (TicketReply);
  rpc GetTicket(GetTicketRequest) returns (TicketReply);
  // The coordinator's candidate window and the sweep that retires stale queued tickets.
  rpc ListQueued(ListQueuedRequest) returns (ListQueuedReply);
  rpc ExpireQueued(ExpireQueuedRequest) returns (ExpireQueuedReply);
  // The partitions a coordinator can hold terms for.
  rpc ListPartitions(chorus.m0.Empty) returns (ListPartitionsReply);
}

// The control plane's match-intent entry (FIX-LINK-03): the StreamerServer business path
// submits a mount's intent here, the control plane verifies the registered route source, and
// forwards the ticket to the queue. The gateway's client path stays on MatchQueue directly.
// The exit face (FIX-LINK-12) cancels under the same gate.
service MatchIntent {
  rpc SubmitMatchIntent(SubmitMatchIntentRequest) returns (TicketReply);
  rpc CancelMatchIntent(CancelMatchIntentRequest) returns (TicketReply);
}

// The participation-commit notice (FIX-LINK-04, architecture 7.2 step 6): the control plane
// delivers the round.started commit — the transaction that committed the participation
// relations, the mount's round pointer and the Preparing room — to the StreamerServer that
// hosts each participant, so the mount binds the new room without waiting for a poll. One
// request per participant. The round generation is the binding's post-increment value from the
// commit (the outbox payload's Generation); the binding generation is the mount generation the
// actor gate matches, never the round generation.
message NotifyCommittedRequest {
  string tenant_id = 1;
  string game_id = 2;
  string room_id = 3;
  int64 round_generation = 4;
  string binding_id = 5;
  int64 binding_generation = 6;
  string streamer_id = 7;
}

// applied is always true on a well-formed notice: the handler is idempotent (an absent actor or
// a stale generation is a no-op, not an error) so the dispatcher marks the outbox done.
message NotifyCommittedReply { bool applied = 1; }

// The StreamerServer-hosted face the control plane's participation dispatcher pushes to. The
// dispatcher resolves each participant's owning StreamerServer from the process reports and
// calls this per instance; the handler updates the hosted streamer's in-memory binding facts.
service Participation {
  rpc NotifyCommitted(NotifyCommittedRequest) returns (NotifyCommittedReply);
}

// Match coordinator terms (architecture 7.1, 10.1). One holder per partition; a takeover or
// an expired re-claim starts a new term, and writes carrying an old term are refused.
message TermRequest {
  string partition_key = 1;
  string holder_instance_id = 2;
  int32 lease_seconds = 3;
}

message GetTermRequest { string partition_key = 1; }

message TermReply {
  bool found = 1;
  string holder_instance_id = 2;
  int64 term = 3;
  int64 lease_until_unix_ms = 4;
}

service Coordinator {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  // Acquire-or-takeover: bumps the term unless the same holder re-claims a live lease.
  rpc ClaimTerm(TermRequest) returns (TermReply);
  // Extends the lease of the current holder only; a lost lease is a visible failure.
  rpc RenewTerm(TermRequest) returns (TermReply);
  // Parks the lease in the past so the next claim starts a new term.
  rpc ReleaseTerm(TermRequest) returns (TermReply);
  rpc GetTerm(GetTermRequest) returns (TermReply);
}

// Match reservations (architecture 7.2, 10.1). The coordinator reserves the whole candidate
// set under its term in one receipt transaction; the reservation holds admission capacity
// until it commits or an expiry sweep retires it — tickets return to the queue, a started
// room is aborted and the ownership released, so capacity never leaks (AT11).
message ReservedParticipantProto {
  string binding_id = 1;
  string participant_id = 2;
  string role = 3;
}

message ReserveMatchRequest {
  string tenant_id = 1;
  string game_id = 2;
  string partition_key = 3;
  int64 coordinator_term = 4;
  string holder_instance_id = 5;
  string room_id = 6;
  repeated ReservedParticipantProto participants = 7;
  int32 reservation_seconds = 8;
  string operation_id = 9;
}

message RenewReservationRequest {
  string tenant_id = 1;
  string game_id = 2;
  string reservation_id = 3;
  int64 coordinator_term = 4;
  string holder_instance_id = 5;
  int32 reservation_seconds = 6;
  string operation_id = 7;
}

message MarkPreparedRequest {
  string tenant_id = 1;
  string game_id = 2;
  string reservation_id = 3;
  int64 coordinator_term = 4;
  string holder_instance_id = 5;
  // The host's prepare receipt (tick-0 state evidence) stored for a successor coordinator.
  string prepared_receipt_json = 6;
  string operation_id = 7;
}

message GetReservationRequest {
  string tenant_id = 1;
  string game_id = 2;
  string reservation_id = 3;
}

message CommitMatchRequest {
  string tenant_id = 1;
  string game_id = 2;
  string reservation_id = 3;
  int64 coordinator_term = 4;
  string holder_instance_id = 5;
  // The room owner the coordinator prepared on: commit is fenced by this instance and epoch —
  // a write from a displaced room owner never commits (AT25 mechanics).
  string room_instance_id = 6;
  int64 room_epoch = 7;
  string operation_id = 8;
}

message AbortReservationRequest {
  string tenant_id = 1;
  string game_id = 2;
  string reservation_id = 3;
  int64 coordinator_term = 4;
  string holder_instance_id = 5;
  string operation_id = 6;
}

message ReservationProto {
  string reservation_id = 1;
  string room_id = 2;
  string tenant_id = 3;
  string game_id = 4;
  string partition_key = 5;
  int64 coordinator_term = 6;
  int64 expires_unix_ms = 7;
  string status = 8;
  repeated ReservedParticipantProto participants = 9;
  string prepared_receipt_json = 10;
}

message ReservationReply {
  bool found = 1;
  bool duplicate = 2;
  ReservationProto reservation = 3;
}

message ExpireReservationsRequest { int32 max = 1; }

message ExpireReservationsReply { int64 expired = 1; }

message ListActiveReservationsRequest {
  string partition_key = 1;
  int32 max = 2;
}

message ListActiveReservationsReply { repeated ReservationProto reservations = 1; }

service Match {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  // Reserves the candidate set under the coordinator's term. Every participant must hold
  // exactly one queued ticket of the same partition.
  rpc ReserveMatch(ReserveMatchRequest) returns (ReservationReply);
  // Extends a live reservation; an expired one is owned by the sweep and cannot revive.
  rpc RenewReservation(RenewReservationRequest) returns (ReservationReply);
  // Records the prepare receipt once the host derived tick-0 and the room ownership is held.
  rpc MarkPrepared(MarkPreparedRequest) returns (ReservationReply);
  // Commits the match in one transaction: the tickets commit together or not at all, fenced
  // by the coordinator term and the room ownership epoch.
  rpc CommitMatch(CommitMatchRequest) returns (ReservationReply);
  // Cancels the reservation: tickets return to the queue and a started room is released.
  rpc AbortReservation(AbortReservationRequest) returns (ReservationReply);
  rpc GetReservation(GetReservationRequest) returns (ReservationReply);
  // The sweep that retires expired reservations and releases everything they held.
  rpc ExpireReservations(ExpireReservationsRequest) returns (ExpireReservationsReply);
  // The successor coordinator's recovery scan: unretired reservations of one partition.
  rpc ListActiveReservations(ListActiveReservationsRequest) returns (ListActiveReservationsReply);
  // The partitions holding unretired reservations: recovery discovery without queued tickets.
  rpc ListReservationPartitions(chorus.m0.Empty) returns (ListPartitionsReply);
}

// Routing (architecture 4.4). The control plane publishes a versioned full snapshot — rooms
// with their owner epochs and endpoints, live streamer bindings, registered instances — plus
// an incremental watch. Consumers re-pull the full snapshot when the stream breaks or a
// version arrives out of nowhere; routing never carries secrets, and an expired route is not
// blindly written to. The version is a content hash, not a sequence: any mutation changes it,
// so a missed watch notice shows up as a version mismatch on the next pull.
message RoomRouteProto {
  string room_id = 1;
  string tenant_id = 2;
  string game_id = 3;
  string owner_instance_id = 4;
  int64 epoch = 5;
  // Empty when the owner instance has not reported an endpoint.
  string endpoint = 6;
  string status = 7;
}

message StreamerRouteProto {
  string streamer_id = 1;
  string binding_id = 2;
  // Empty while the mount is not in a room.
  string room_id = 3;
  string state = 4;
  // The streamer-server instance holding the entity (kind 'streamer' ownership); empty while
  // no holder is on record — e.g. a host outside the control plane.
  string owner_instance_id = 5;
  int64 epoch = 6;
  // The live session key naming this binding's platform room (additive for the gateway's
  // event→room resolution: the routing layer only holds the canonical live key of the
  // callback, and must not re-derive the binding from the data plane).
  string platform = 7;
  string canonical_live_session_key = 8;
  // The binding's own generation (FIX-END-02): every mount on the live slot enters at a new
  // generation, so a consumer can tell the current mount from a stale snapshot row.
  int64 binding_generation = 9;
  // The round the binding currently sits in (FIX-END-06): live.binding.round_generation —
  // distinct from the mount counter above, it bumps on every round the binding enters and is
  // the claim a gateway's push carries so the receiver can refuse a stale snapshot's push
  // for a closed round. Empty while the mount is in no room.
  int64 round_generation = 10;
  // The mount's tenant (FIX-LINK-08): a cluster-scoped streamer gateway names no tenant on a
  // resume, but needs one to ask the StreamerServer for the mount's committed participation.
  // The row's tenant is a mount fact, not a placement inference.
  string tenant_id = 11;
}

message InstanceRouteProto {
  string process_instance_id = 1;
  string role = 2;
  string node_id = 3;
  string slot_id = 4;
  // Empty when the process has not reported an endpoint.
  string endpoint = 5;
  string readiness = 6;
  string admission = 7;
}

message RoutingSnapshotReply {
  int64 version = 1;
  repeated RoomRouteProto rooms = 2;
  repeated StreamerRouteProto streamers = 3;
  repeated InstanceRouteProto instances = 4;
}

message WatchRoutingRequest {
  // The version the consumer already holds; the stream opens with a notice when it differs.
  int64 known_version = 1;
}

message RoutingNotice { int64 version = 1; }

// The StreamerServer's route-source report (FIX-END-02), sent right after the mount commits.
// The report names the binding and its generation only — the control plane derives the
// platform identity from the mount's verified live session join, so an unverified identity
// establishes no route no matter what a caller claims.
message RegisterRouteSourceRequest {
  string tenant_id = 1;
  string game_id = 2;
  string streamer_id = 3;
  string binding_id = 4;
  int64 binding_generation = 5;
}

message RegisterRouteSourceReply {
  // The identity the control plane derived and recorded — the verified session's own
  // platform and canonical live key, echoed so the reporter can log what took effect.
  string platform = 1;
  string canonical_live_session_key = 2;
  int64 binding_generation = 3;
  // True when the recorded row already held exactly this binding at this generation: the
  // duplicate report changed nothing.
  bool duplicate = 4;
}

service Routing {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  // The versioned full snapshot; re-pull whenever a watch notice, break or gap says so.
  rpc GetRoutingSnapshot(chorus.m0.Empty) returns (RoutingSnapshotReply);
  // A notice stream: emits the new version whenever the routed content changes. The notice
  // carries no payload — the consumer answers it with a full snapshot pull.
  rpc WatchRouting(WatchRoutingRequest) returns (stream RoutingNotice);
  // The mount's route source (FIX-END-02): the StreamerServer reports each committed mount;
  // duplicates replay, older generations never overwrite newer registrations, and only the
  // platform-verified identity of the live session is ever recorded.
  rpc RegisterRouteSource(RegisterRouteSourceRequest) returns (RegisterRouteSourceReply);
  // The gateway's installed-version confirmation (FIX-END-03): after applying a snapshot the
  // gateway confirms the exact version it answers resolves from. Until a version is confirmed
  // the gateway's face refuses to push — an unconfirmed picture guesses no rooms. The gateway
  // instance is the certificate's process identity, never a request field.
  rpc ConfirmRoutingVersion(ConfirmRoutingVersionRequest) returns (ConfirmRoutingVersionReply);
}

message ConfirmRoutingVersionRequest {
  int64 version = 1;
}

message ConfirmRoutingVersionReply {
  int64 version = 1;
  bool confirmed = 2;
}

// Deployment plans (architecture 10.2). The control plane owns DeploymentSpec; a plan names
// the slot, the desired state and the command identity. The agent applies plans idempotently
// — a re-delivered CommandId must never pull a second process — and the plan generation is
// monotonic, so a stale plan never rewinds history.
message DeploymentPlanProto {
  string slot_id = 1;
  string node_id = 2;
  string role = 3;
  // Running keeps the process supervised and restarted. Draining parks the process: it
  // keeps serving the rooms it already holds (admission Draining) until the control plane
  // confirms the business drain and escalates to Drained — or the agent's force deadline
  // (CHORUS_DRAIN_FORCE_SECONDS) stops it. Drained and Stopped stop the process and keep
  // it down.
  string desired_state = 4;
  string desired_version = 5;
  string package_hash = 6;
  int64 plan_generation = 7;
  // Empty for plan rows that were never commanded (bootstrap seeds).
  string command_id = 8;
  // 0 = the command has no expiry of its own.
  int64 command_expires_unix_ms = 9;
}

message ApplyPlanRequest {
  string node_id = 1;
  string slot_id = 2;
  string role = 3;
  string desired_state = 4;
  string desired_version = 5;
  string package_hash = 6;
  int64 plan_generation = 7;
  string command_id = 8;
  int64 command_expires_unix_ms = 9;
}

message WatchPlansRequest { string node_id = 1; }

service Deployment {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  // Issues a plan (the M3-9 admin face wraps this with audit; here the control plane speaks).
  rpc ApplyPlan(ApplyPlanRequest) returns (DeploymentPlanProto);
  // The agent's plan stream: emits the node's full plan set whenever it changes, and once
  // on connect — a reconnected agent re-receives its plans and must not re-pull processes.
  rpc WatchPlans(WatchPlansRequest) returns (stream DeploymentPlanProto);
}

// Entity takeover (architecture 10.3): the control plane moves a live entity's authority to a
// new instance after the current holder went silent. For rooms the handover fences the old
// epoch at the data plane; for streamers it only reroutes — the old session stays valid until
// the streamer's next Login/Resume rotates it (session rotation is the streamer write fence).
service Takeover {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  // The authority handover itself: bumps the ownership epoch (rooms also bump game.room),
  // parks the entity Recovering. Transferring a streamer revokes no session and clears no
  // binding; the new holder confirms by claiming, and the fence lands when a Resume through
  // it rotates the session.
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipReply);
  // The recovery completion for a room: confirms the transferred ownership and replays the
  // round on the new instance. Room-only today; other kinds refuse visibly.
  rpc TakeoverRoom(TakeoverRoomRequest) returns (TakeoverRoomReply);
}

message TransferOwnershipRequest {
  string tenant_id = 1;
  string game_id = 2;
  string kind = 3;
  string entity_id = 4;
  string to_instance_id = 5;
  int32 lease_seconds = 6;
  // Required for room transfers (FIX-TAKE-04): names the persistent recovery operation
  // the transfer belongs to; ignored for streamer entities, whose completion is
  // client-driven.
  string operation_id = 7;
}

message TransferOwnershipReply {
  string owner_instance_id = 1;
  int64 epoch = 2;
  string status = 3;
}

message TakeoverRoomRequest {
  string tenant_id = 1;
  string game_id = 2;
  string room_id = 3;
  string to_instance_id = 4;
  int32 lease_seconds = 5;
  int32 tick_ms = 6;
}

message TakeoverRoomReply {
  string owner_instance_id = 1;
  int64 epoch = 2;
  bool recovered = 3;
  string status = 4;
  int64 last_tick = 5;
}

// The end operation boundary (architecture 6.4, FIX-END-01): the game host reports the
// frozen result and the control plane persists one operation per round — the business id,
// the room's round generation, the mount generations that entered it, the phase each later
// step records, and the last error. Creation is idempotent by request identity: the same
// begin replays the same operation, a second business id for the same room refuses, and a
// late request naming a superseded generation cannot touch the round the mounts moved on
// to. A restarted control plane reads the open phase and continues under the same id.
service RoundEnd {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  // Step 1's notification: the final frame is committed and the actor stopped its battle
  // ticks. Repeated with the same id and generations it replays the recorded operation.
  rpc BeginEnd(BeginEndRequest) returns (BeginEndReply);
  // The operation's own record — phase, progress and error — for the coordinators that
  // resume after a restart and the surfaces that report blocking reasons.
  rpc GetEndStatus(GetEndStatusRequest) returns (GetEndStatusReply);
  // Step 4's confirmation (architecture 6.4, FIX-END-07): one gateway reports that it
  // installed the closure, disposed its pending items and stopped pushing. The ack is
  // phase-independent and first-answer-wins — a restarted gateway re-acks the same facts
  // and hears Duplicate with the recorded answer unchanged.
  rpc AckDeliveryStopped(AckDeliveryStoppedRequest) returns (AckDeliveryStoppedReply);
}

message BeginEndRequest {
  string tenant_id = 1;
  string game_id = 2;
  string room_id = 3;
  // The business id every later step of this round's end binds itself to.
  string end_operation_id = 4;
  // Advisory only (FIX-END-04): the recorded round generation is derived in the creating
  // transaction from the mounts the begin still finds pointing at the room — per-binding
  // counters diverge as mounts carry round history, so no caller name satisfies every mount.
  int64 round_generation = 5;
  int64 final_tick = 6;
  int64 result_version = 7;
}

message BeginEndReply {
  string end_operation_id = 1;
  string phase = 2;
  // True when the operation already existed and this begin replayed it — the same round
  // never yields a second operation.
  bool duplicate = 3;
}

message GetEndStatusRequest {
  string tenant_id = 1;
  string game_id = 2;
  string room_id = 3;
}

// One participant mount's generations as the end operation recorded them at begin.
message EndBindingGeneration {
  string binding_id = 1;
  int64 generation = 2;
  int64 round_generation = 3;
}

message GetEndStatusReply {
  bool found = 1;
  string end_operation_id = 2;
  string phase = 3;
  int64 round_generation = 4;
  int64 final_tick = 5;
  int64 result_version = 6;
  // The mount generations that entered the round, recorded at begin.
  repeated EndBindingGeneration binding_generations = 7;
  string last_error = 8;
}

// The step-4 confirmation as the control plane records it (FIX-END-07): the gateway's
// identity is the caller certificate, never the body — the row the responder set froze at
// issue is the membership the ack answers. The cutoff sequence is the highest delivery
// sequence this gateway observed for the room through its push leg — a subset of the
// room's shared delivery cursor, so 0 after a crash is honest (a fresh process holds
// nothing in flight; everything it pushed before dying is already committed under the
// room's cursor in the store). The drained counts are informational and per-responder:
// concurrent gateways drain disjoint windows, so the counts are never summed into a room
// total. After a crash-restart the gateway has observed no (platform, app) pairs yet, so
// its drain pass routes nothing and the ack reports zeros while the pending items stay
// durably attributed in the inbox — any later drain or the settlement backstop disposes
// them; nothing is lost.
message AckDeliveryStoppedRequest {
  string tenant_id = 1;
  string game_id = 2;
  string room_id = 3;
  string end_operation_id = 4;
  // The exact CloseRouteVersion the gateway closed at — must equal the command row's
  // frozen version, so an ack for any other round's closure never lands.
  int64 close_route_version = 5;
  int64 cutoff_sequence = 6;
  int64 drained_out_of_round = 7;
  int64 drained_routed = 8;
}

message AckDeliveryStoppedReply {
  // True when this responder already confirmed at exactly the recorded version — the
  // replay answer of an idempotent receiver; the first answer's facts stand unchanged.
  bool duplicate = 1;
  // The version the control plane holds for this command — the value the ack recorded
  // against, echoed for the gateway's own log.
  int64 recorded_close_route_version = 2;
}

// The PlatformGateway executor host (M3-8, architecture 6.3). The gateway is an executor, not a
// data owner: its face carries readiness for supervisors and routing consumers, while the task
// lease protocol it drives lives on the DataServer's PlatformTask service.
service PlatformGatewayFace {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  // Step 3's command (architecture 6.4, FIX-END-05): the control plane tells this gateway the
  // room's delivery closed at an exact version. The command carries the version the control
  // plane derived from the recorded end-operation facts — the gateway never re-derives it, and
  // a command naming anything older than what it already closed for this room must never close
  // a newer round. Delivery of the command is only the ack; installing the stop and confirming
  // DeliveryStopped are the later steps (FIX-END-07).
  rpc StopDelivery(StopDeliveryRequest) returns (StopDeliveryReply);
}

// The stop-delivery command as the control plane recorded it (FIX-END-05): the room, its round
// generation, and the CloseRouteVersion derived from the end operation's own facts — the same
// round always carries the same version, a different round a different one.
message StopDeliveryRequest {
  string tenant_id = 1;
  string game_id = 2;
  string room_id = 3;
  string end_operation_id = 4;
  int64 round_generation = 5;
  int64 close_route_version = 6;
  // The mount generations the end operation recorded at begin — carried with the command so
  // the gateway's record of what closed is the control plane's evidence, never a guess.
  repeated EndBindingGeneration binding_generations = 7;
}

message StopDeliveryReply {
  string end_operation_id = 1;
  int64 close_route_version = 2;
  // True when this gateway already closed this room's delivery at exactly this version — the
  // replay answer of an idempotent receiver.
  bool duplicate = 3;
}

// Admin: state reads, the round trace, and controlled failure commands (operations 6). Every
// command names a request id, an operator and a reason; each lands exactly once in
// control.audit — a command retried with the same request id replays as a duplicate instead of
// acting twice. Reads are diagnostics only; they never mutate.
message AdminStreamerSnapshotRequest {
  string tenant_id = 1;
  string streamer_id = 2;
}

message AdminBindingProto {
  string binding_id = 1;
  string game_id = 2;
  int64 generation = 3;
  string state = 4;
  string current_room_id = 5;
  int64 created_unix_ms = 6;
}

message AdminTaskProto {
  string task_id = 1;
  string operation_id = 2;
  string status = 3;
  int32 attempt_count = 4;
  int64 task_epoch = 5;
}

message AdminStreamerSnapshotReply {
  bool found = 1;
  string streamer_id = 2;
  string ban_state = 3;
  string current_session_id = 4;
  int64 session_version = 5;
  repeated AdminBindingProto bindings = 6;
  bool ticket_present = 7;
  TicketProto ticket = 8;
  bool ownership_present = 9;
  string owner_instance_id = 10;
  int64 ownership_epoch = 11;
  string ownership_status = 12;
  repeated AdminTaskProto tasks = 13;
}

message AdminRoomSnapshotRequest { string room_id = 1; }

message AdminParticipantProto {
  string participant_id = 1;
  string binding_id = 2;
  string role = 3;
  string state = 4;
}

message AdminRoomSnapshotReply {
  bool found = 1;
  string tenant_id = 2;
  string game_id = 3;
  string status = 4;
  int64 epoch = 5;
  int64 last_tick = 6;
  int64 state_version = 7;
  bool ownership_present = 8;
  string owner_instance_id = 9;
  int64 ownership_epoch = 10;
  string ownership_status = 11;
  repeated AdminParticipantProto participants = 12;
  // 0 = the room has no committed result yet.
  int64 result_version = 13;
  int64 final_frame = 14;
  int32 grants_total = 15;
  int32 grants_granted = 16;
  // The settlement executor's task state (FIX-SETTLE-03): an empty settle_status means the
  // room has no task — never discovered as pending, or already settled.
  string settle_status = 17;
  int32 settle_attempts = 18;
  string settle_last_error = 19;
  int64 settle_next_attempt_unix_ms = 20;
  string settle_owner_instance_id = 21;
  // The release block (FIX-SETTLE-05): the evidence reason the data plane refused, when the
  // continuous wait began and the cumulative dwell. Empty release_blocked_reason = not
  // blocked right now; release_blocked_total_ms survives the release, so a settled room
  // still reports how long it waited.
  string release_blocked_reason = 22;
  int64 release_blocked_since_unix_ms = 23;
  int64 release_blocked_total_ms = 24;
}

// The AT31 round trace: one room's whole causal chain — platform events as routed, the frames
// that consumed them, the effects each frame durably announced, the committed result, its grant
// manifest and the ledger lines the grants produced. Every link carries the identifiers of its
// neighbours, so the trace is verifiable end to end.
message AdminTraceRoundRequest { string room_id = 1; }

message AdminTraceEventProto {
  int64 sequence = 1;
  string event_id = 2;
  string disposition = 3;
  string binding_id = 4;
  int64 received_unix_ms = 5;
  string payload_json = 6;
}

message AdminTraceFrameProto {
  int64 tick = 1;
  string commit_id = 2;
  string input_refs_json = 3;
  string effects_json = 4;
}

message AdminTraceEffectProto {
  string effect_id = 1;
  string kind = 2;
  string status = 3;
  string payload_json = 4;
}

message AdminTraceGrantProto {
  string player_id = 1;
  string grant_key = 2;
  string status = 3;
  string operation_id = 4;
}

message AdminTraceLedgerProto {
  string operation_id = 1;
  string line_id = 2;
  string player_id = 3;
  string asset_id = 4;
  int64 delta = 5;
  string reason = 6;
  int64 resulting_balance = 7;
  int64 committed_unix_ms = 8;
}

message AdminTraceRoundReply {
  bool found = 1;
  string status = 2;
  int64 epoch = 3;
  int64 last_tick = 4;
  repeated AdminTraceEventProto events = 5;
  repeated AdminTraceFrameProto frames = 6;
  repeated AdminTraceEffectProto effects = 7;
  int64 result_version = 8;
  string result_json = 9;
  repeated AdminTraceGrantProto grants = 10;
  repeated AdminTraceLedgerProto ledger = 11;
}

message AdminQueueGateRequest {
  string request_id = 1;
  string operator = 2;
  string reason = 3;
  string partition_key = 4;
}

message AdminQueueGateReply {
  string partition_key = 1;
  bool suspended = 2;
  bool duplicate = 3;
}

message AdminRoomRecoveryRequest {
  string request_id = 1;
  string operator = 2;
  string reason = 3;
  string tenant_id = 4;
  string game_id = 5;
  string room_id = 6;
  string to_instance_id = 7;
  int32 tick_ms = 8;
}

message AdminRoomRecoveryReply {
  string owner_instance_id = 1;
  int64 epoch = 2;
  bool recovered = 3;
  string status = 4;
  int64 last_tick = 5;
  bool duplicate = 6;
}

message AdminDrainProcessRequest {
  string request_id = 1;
  string operator = 2;
  string reason = 3;
  string process_instance_id = 4;
}

message AdminDrainProcessReply {
  string process_instance_id = 1;
  bool found = 2;
  string lifecycle = 3;
  bool duplicate = 4;
}

message AdminSettlementRetryRequest {
  string request_id = 1;
  string operator = 2;
  string reason = 3;
  string room_id = 4;
}

message AdminSettlementRetryReply {
  string room_id = 1;
  int64 result_version = 2;
  int32 grants_total = 3;
  int32 grants_granted = 4;
  int32 grants_pending = 5;
  bool duplicate = 6;
}

message AdminTaskReconcileRequest {
  string request_id = 1;
  string operator = 2;
  string reason = 3;
  string task_id = 4;
}

message AdminTaskReconcileReply {
  string task_id = 1;
  string status = 2;
  int64 task_epoch = 3;
  bool duplicate = 4;
}

// FIX-GM-01, the room epoch management contract (architecture 4.5): the epoch is the room's
// ownership generation — never a process start, connection, mount or round generation. The GM
// tool speaks only to this ControlServer Admin entry; it never reaches a GameServer or
// DataServer directly. GetRoomEpoch reads the authority; BumpRoomEpoch is the audited,
// idempotent per-request-id command that keeps the owner and moves the room to Recovering
// (the storage transaction and the operator authorization are the FIX-GM-02 / FIX-GM-06 lines).
message AdminGetRoomEpochRequest {
  string request_id = 1;
  string operator = 2;
  string reason = 3;
  string tenant_id = 4;
  string game_id = 5;
  string room_id = 6;
}

message AdminGetRoomEpochReply {
  bool found = 1;
  int64 epoch = 2;
  string owner_instance_id = 3;
  string status = 4;
  string tenant_id = 5;
  string game_id = 6;
  string room_id = 7;
}

message AdminBumpRoomEpochRequest {
  string request_id = 1;
  string operator = 2;
  string reason = 3;
  string tenant_id = 4;
  string game_id = 5;
  string room_id = 6;
  int64 expected_epoch = 7;
  // 0 or absent = expected + 1; when given (> 0) must be strictly greater than expected and
  // not overflow. The epoch is never lowered or reset, so no historical request re-validates.
  // The sentinel 0 is safe because a room epoch is always >= 1 (the initial ownership epoch).
  int64 target_epoch = 8;
}

message AdminBumpRoomEpochReply {
  string operation_id = 1;
  string room_id = 2;
  string owner_instance_id = 3;
  int64 old_epoch = 4;
  int64 new_epoch = 5;
  string ownership_status = 6;
  // FIX-GM-03 fills this: the gateway's confirmation of the route change is a separate
  // surface from the storage commit, so a caller never sees "route synced" before the
  // gateway confirms.
  string route_sync_status = 7;
  bool duplicate = 8;
  // The scope echo, so an OperationId replay (FIX-GM-05) returns an identifiable record.
  string tenant_id = 9;
  string game_id = 10;
}

// FIX-GM-07: the targeted playtest dispatch (architecture 12.1's room command row). The
// operator authors a module command for one named participant; the ControlServer resolves the
// current owner from its own directory — the operator never names an endpoint — and the owner
// GameServer validates the target version (owner instance, epoch, live binding) before the
// command rides the same durable ordered-authoritative-input path a client command rides. It
// takes effect at a committed tick, never on the RPC thread. The operation id is the request
// id: a lost reply is queried, not re-sent under a new id.
message AdminDispatchRoomCommandRequest {
  string request_id = 1;
  string operator = 2;
  string reason = 3;
  string tenant_id = 4;
  string game_id = 5;
  string room_id = 6;
  // 0 = "whatever the ownership row holds now". A stated value that no longer matches is a
  // stale target and is refused — the operator re-reads the room snapshot, not a hint.
  int64 expected_epoch = 7;
  // The participant whose seat the command plays as; the host resolves the participant's
  // live binding, so a finished/closed seat is refused rather than inventing a participant.
  string participant_id = 8;
  // The module command, already in the module's own command shape — the module holds the
  // trust boundary and rejects shapes it does not know (the same intent rule clients face).
  string payload_json = 9;
}

message AdminDispatchRoomCommandReply {
  string operation_id = 1;
  string room_id = 2;
  string owner_instance_id = 3;
  int64 epoch = 4;
  // The dispatch stage at reply time: "DurableAccepted" (the store row stands, the room will
  // consume it at a committed tick), "Duplicate" (this operation id already stands), or the
  // refusal word the target answered with ("StaleOwner", "Overloaded"). Never "Applied" —
  // application is what GetOperationStatus proves from the frame record.
  string stage = 5;
  bool duplicate = 6;
  string note = 7;
  string tenant_id = 8;
  string game_id = 9;
}

// FIX-GM-07: the effect query by the original operation id (architecture 12.1: accepted,
// applied and unknown are distinct answers; a timeout is queried, never re-sent).
message AdminGetOperationStatusRequest {
  string operation_id = 1;
  string tenant_id = 2;
  string game_id = 3;
  string room_id = 4;
}

message AdminGetOperationStatusReply {
  bool found = 1;
  // "Accepted" — the durable input row stands, the room has not consumed it yet;
  // "Applied" — a committed frame's input refs name this operation id (applied_tick is the
  // tick that consumed it); "NotFound" — the data plane holds no such operation id; or the
  // room's terminal disposition word if the input was refused after dispatch
  // ("OutOfRound", "Skipped", ...) — never silently folded into an accepted answer.
  string stage = 2;
  // 0 until stage is "Applied" (a room's first frame is tick 1, so 0 is never a real tick).
  int64 applied_tick = 3;
  string platform = 4;
  string note = 5;
}

// The operator surface. FIX-WEB-01 adds the browser binding to the same contract the GM
// client (GmOperatorClient) already speaks: every entry below carries a google.api.http
// annotation so the browser console speaks HTTP+JSON at /admin/api/v1/<kebab-of-rpc-name>
// with the request message as the body, while the gRPC surface stays unchanged. The route
// rule is mechanical — kebab-case of the rpc name — so the browser client derives its paths
// from this file, never from a hand-maintained list. Read entries answer to the viewer rank
// and command entries to the gm rank under the FIX-GM-06 operator credential (bearer token,
// identity from the credential, never from the body); the enforcement wiring is the
// FIX-WEB-03 line. Ready is deliberately unannotated: it is a process-cert health word for
// the cluster's own roles, not an operator surface — the browser's health word is whoami.
service Admin {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  // FIX-WEB-01: the operator identity probe — the login surface (FIX-WEB-04) answers
  // "which operator is this credential and what role and scope does it carry". Identity
  // comes from the bearer credential alone; the reply never names a credential secret.
  rpc WhoAmI(chorus.m0.Empty) returns (AdminWhoAmIReply) {
    option (google.api.http) = { post: "/admin/api/v1/who-am-i" body: "*" };
  }
  // Diagnostics: the streamer's whole footprint and the room's whole footprint. In the
  // streamer snapshot the owner/epoch columns are the routing picture (control.ownership);
  // session authority is the session rows' current version — the two can legitimately differ
  // between a takeover and the streamer's next rotation.
  rpc GetStreamerSnapshot(AdminStreamerSnapshotRequest) returns (AdminStreamerSnapshotReply) {
    option (google.api.http) = { post: "/admin/api/v1/get-streamer-snapshot" body: "*" };
  }
  rpc GetRoomSnapshot(AdminRoomSnapshotRequest) returns (AdminRoomSnapshotReply) {
    option (google.api.http) = { post: "/admin/api/v1/get-room-snapshot" body: "*" };
  }
  // The AT31 chain: gift to frame to reward, verifiable link by link.
  rpc TraceRound(AdminTraceRoundRequest) returns (AdminTraceRoundReply) {
    option (google.api.http) = { post: "/admin/api/v1/trace-round" body: "*" };
  }
  // Failure commands: audited, idempotent per request id, each a controlled recovery.
  rpc SuspendMatchQueue(AdminQueueGateRequest) returns (AdminQueueGateReply) {
    option (google.api.http) = { post: "/admin/api/v1/suspend-match-queue" body: "*" };
  }
  rpc ResumeMatchQueue(AdminQueueGateRequest) returns (AdminQueueGateReply) {
    option (google.api.http) = { post: "/admin/api/v1/resume-match-queue" body: "*" };
  }
  rpc RetryRoomRecovery(AdminRoomRecoveryRequest) returns (AdminRoomRecoveryReply) {
    option (google.api.http) = { post: "/admin/api/v1/retry-room-recovery" body: "*" };
  }
  rpc DrainProcess(AdminDrainProcessRequest) returns (AdminDrainProcessReply) {
    option (google.api.http) = { post: "/admin/api/v1/drain-process" body: "*" };
  }
  rpc RetrySettlement(AdminSettlementRetryRequest) returns (AdminSettlementRetryReply) {
    option (google.api.http) = { post: "/admin/api/v1/retry-settlement" body: "*" };
  }
  rpc ReconcilePlatformTask(AdminTaskReconcileRequest) returns (AdminTaskReconcileReply) {
    option (google.api.http) = { post: "/admin/api/v1/reconcile-platform-task" body: "*" };
  }
  // FIX-GM-01: the room epoch entry. GetRoomEpoch is read-only; BumpRoomEpoch is the audited,
  // idempotent command that keeps the owner and moves the room to Recovering (the storage
  // transaction and operator authorization are the FIX-GM-02 / FIX-GM-06 lines).
  rpc GetRoomEpoch(AdminGetRoomEpochRequest) returns (AdminGetRoomEpochReply) {
    option (google.api.http) = { post: "/admin/api/v1/get-room-epoch" body: "*" };
  }
  rpc BumpRoomEpoch(AdminBumpRoomEpochRequest) returns (AdminBumpRoomEpochReply) {
    option (google.api.http) = { post: "/admin/api/v1/bump-room-epoch" body: "*" };
  }
  // FIX-GM-07: the targeted playtest dispatch and its effect query. Both are operator-gated
  // (FIX-GM-06's bearer credential and scope) and audited; the dispatch routes to the current
  // owner via the ControlServer's directory — the receiving host re-validates the target
  // version — and the status query answers "what did operation X do" from the data plane,
  // never conflating accepted with applied.
  rpc DispatchRoomCommand(AdminDispatchRoomCommandRequest) returns (AdminDispatchRoomCommandReply) {
    option (google.api.http) = { post: "/admin/api/v1/dispatch-room-command" body: "*" };
  }
  rpc GetOperationStatus(AdminGetOperationStatusRequest) returns (AdminGetOperationStatusReply) {
    option (google.api.http) = { post: "/admin/api/v1/get-operation-status" body: "*" };
  }
  // FIX-WEB-12: the leaderboard queries for the back office (viewer rank). The request
  // names the board's READ KEY — board id, period bucket id and scope id — plus the
  // subject type (the storage's row filter). The write-side descriptors (aggregation,
  // score bounds, the period's calendar) are inert in reads: they shape scoring, not
  // queries, so the operator never resupplies what it cannot know. The TopN page is the
  // RANK-06 walk: an empty page_token starts from the top, a token continues the same
  // snapshot, and a stale or expired token is an explicit error — never a cross-version
  // seemingly-contiguous page. Timestamps ride unix milliseconds (0 = the board has never
  // scored), the Admin face's convention.
  rpc GetLeaderboardTop(AdminLeaderboardTopRequest) returns (AdminLeaderboardTopReply) {
    option (google.api.http) = { post: "/admin/api/v1/get-leaderboard-top" body: "*" };
  }
  rpc GetLeaderboardRank(AdminLeaderboardRankRequest) returns (AdminLeaderboardRankReply) {
    option (google.api.http) = { post: "/admin/api/v1/get-leaderboard-rank" body: "*" };
  }
  rpc GetLeaderboardAround(AdminLeaderboardAroundRequest) returns (AdminLeaderboardAroundReply) {
    option (google.api.http) = { post: "/admin/api/v1/get-leaderboard-around" body: "*" };
  }
  // FIX-WEB-14: the leaderboard maintenance commands (the RANK-08 GM corrections) on the
  // gm floor. Every request leads with the audited triple (request id, operator, reason)
  // and carries the board's read key exactly as the queries spell it; expected_version is
  // the opaque read_version string a query reply carried back — the adjustment and reset
  // refuse a board that changed since that read (a precondition failure, HTTP 400 on the
  // browser face), the operation id is the idempotency key (a replay answers Duplicate
  // and the stored score), and every correction is a ledger row so a rebuild reproduces
  // it. The rebuild re-derives the entries from that ledger; it names no expected version
  // (it is the recovery move when the projection itself is in doubt).
  rpc AdjustLeaderboardEntry(AdminLeaderboardAdjustRequest) returns (AdminLeaderboardAdjustReply) {
    option (google.api.http) = { post: "/admin/api/v1/adjust-leaderboard-entry" body: "*" };
  }
  rpc ResetLeaderboardEntry(AdminLeaderboardResetRequest) returns (AdminLeaderboardResetReply) {
    option (google.api.http) = { post: "/admin/api/v1/reset-leaderboard-entry" body: "*" };
  }
  rpc RebuildLeaderboard(AdminLeaderboardRebuildRequest) returns (AdminLeaderboardRebuildReply) {
    option (google.api.http) = { post: "/admin/api/v1/rebuild-leaderboard" body: "*" };
  }
}

// The operator identity the bearer credential resolves to (FIX-WEB-01, consumed by the
// FIX-WEB-04 login page). Scope arrays follow the FIX-GM-06 store semantics: an empty
// array means every tenant or game, a listed name means only those.
message AdminWhoAmIReply {
  string operator_id = 1;
  string role = 2;
  repeated string tenants = 3;
  repeated string games = 4;
  bool enabled = 5;
}

// FIX-WEB-12: the back-office leaderboard queries. A request carries the board's read
// key: the board id, the period bucket id (empty = "alltime", RANK-07's buckets are named
// buckets like "daily-2026-11-05") and the scope id (empty = "global"), plus the subject
// type as the RANK-01 RankSubject number (0 player, 1 streamer, 2 faction) — the storage
// filters rows by it, so a wrong value answers an empty board rather than another board's
// rows. The read version rides unix milliseconds, 0 = never scored (the AdminRoomSnapshot
// unix-ms convention); a stale/expired continuation is an explicit precondition error,
// never a cross-version page.
message AdminLeaderboardTopRequest {
  string tenant_id = 1;
  string game_id = 2;
  string board = 3;
  string period_id = 4;
  string scope_id = 5;
  int32 subject = 6;
  // The page size, bounded 1..1000 (RANK-04's read bound). Required.
  int32 max_entries = 7;
  // The previous page's next_page_token; empty starts a fresh walk from the top (RANK-06).
  string page_token = 8;
}

message AdminLeaderboardEntryProto {
  string subject_id = 1;
  int64 score = 2;
}

message AdminLeaderboardTopReply {
  repeated AdminLeaderboardEntryProto entries = 1;
  int64 read_version_unix_ms = 2;
  bool has_more = 3;
  // Carries a token exactly when has_more; pass it back as page_token to continue.
  string next_page_token = 4;
  // FIX-WEB-14: the read version spelled the way the maintenance commands expect it
  // back — an opaque string (empty = the board has never scored). The unix-ms field is
  // the display form; this is the form a command's expected_version takes, losslessly.
  string read_version = 5;
}

message AdminLeaderboardRankRequest {
  string tenant_id = 1;
  string game_id = 2;
  string board = 3;
  string period_id = 4;
  string scope_id = 5;
  int32 subject = 6;
  string subject_id = 7;
}

message AdminLeaderboardRankReply {
  bool found = 1;
  // The subject's unique ordinal in the board order (RANK-05: ties take consecutive ranks).
  int64 rank = 2;
  int64 score = 3;
  int64 read_version_unix_ms = 4;
  // FIX-WEB-14: the opaque command-token form of the same read version (empty = never scored).
  string read_version = 5;
}

message AdminLeaderboardAroundRequest {
  string tenant_id = 1;
  string game_id = 2;
  string board = 3;
  string period_id = 4;
  string scope_id = 5;
  int32 subject = 6;
  string subject_id = 7;
  // The window is bounded 1..50 (RANK-05's bound). Required.
  int32 window = 8;
}

message AdminLeaderboardRankedEntryProto {
  int64 rank = 1;
  string subject_id = 2;
  int64 score = 3;
}

message AdminLeaderboardAroundReply {
  bool found = 1;
  // The subject and its rank neighbours, in rank order, at one read view (RANK-05).
  repeated AdminLeaderboardRankedEntryProto entries = 2;
  int64 read_version_unix_ms = 3;
  // FIX-WEB-14: the opaque command-token form of the same read version (empty = never scored).
  string read_version = 4;
}

// FIX-WEB-14: the RANK-08 maintenance commands, operator-facing. The request leads with
// the audited triple (request id = the idempotency key and audit anchor, operator = the
// authenticated caller, reason = the audit evidence), then the board's read key exactly
// as the queries spell it (empty period/scope = the all-time global bucket). The command
// requests the read version the operator last saw as expected_version — the opaque
// read_version string a query reply carried; empty = no guard.
message AdminLeaderboardAdjustRequest {
  string request_id = 1;
  string operator = 2;
  string reason = 3;
  string tenant_id = 4;
  string game_id = 5;
  string board = 6;
  string period_id = 7;
  string scope_id = 8;
  int32 subject = 9;
  string subject_id = 10;
  // The signed correction. The data plane applies exactly this amount, once.
  int64 delta = 11;
  string expected_version = 12;
}

message AdminLeaderboardAdjustReply {
  int64 score = 1;
  bool duplicate = 2;
  int64 read_version_unix_ms = 3;
  // The board's version after the correction, in the opaque command-token form — the
  // value the operator's next expected_version names.
  string read_version = 4;
}

message AdminLeaderboardResetRequest {
  string request_id = 1;
  string operator = 2;
  string reason = 3;
  string tenant_id = 4;
  string game_id = 5;
  string board = 6;
  string period_id = 7;
  string scope_id = 8;
  int32 subject = 9;
  // Empty resets the whole board (every subject on the bucket).
  string subject_id = 10;
  string expected_version = 11;
}

message AdminLeaderboardResetReply {
  bool duplicate = 1;
  int64 read_version_unix_ms = 2;
  string read_version = 3;
}

message AdminLeaderboardRebuildRequest {
  string request_id = 1;
  string operator = 2;
  string reason = 3;
  string tenant_id = 4;
  string game_id = 5;
  string board = 6;
  string period_id = 7;
  string scope_id = 8;
  int32 subject = 9;
}

message AdminLeaderboardRebuildReply {
  // The number of entries re-derived from the effect ledger.
  int32 entries = 1;
  int64 read_version_unix_ms = 2;
  string read_version = 3;
}
