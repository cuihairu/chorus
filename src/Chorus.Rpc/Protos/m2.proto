syntax = "proto3";

package chorus.m2;
option csharp_namespace = "Chorus.Rpc";

import "Protos/m0.proto";

// Round admission and routing boundaries (architecture 6.2, 6.3). The tenant and the caller
// role come from the client certificate; every mutating call is one store transaction, so a
// reply always reflects a committed state.

message RoundParticipantProto {
  string binding_id = 1;
  string participant_id = 2;
  string role = 3;
}

message StartRoundRequest {
  string room_id = 1;
  string owner_instance_id = 2;
  int64 epoch = 3;
  string game_id = 4;
  string module_version = 5;
  string config_hash = 6;
  string package_hash = 7;
  string operation_id = 8;
  repeated RoundParticipantProto participants = 9;
  // Empty = the caller's certificate tenant; a cluster-scoped coordinator names the tenant
  // it acts for (the same rule as the match services).
  string tenant_id = 10;
}

message AbortRoundRequest {
  string room_id = 1;
  string owner_instance_id = 2;
  int64 epoch = 3;
  string game_id = 4;
  string reason = 5;
  string operation_id = 6;
}

message RoundAdmissionReply {
  string room_id = 1;
  int64 round_generation = 2;
  string status = 3;
  int64 epoch = 4;
  bool duplicate = 5;
}

// A cluster-scoped caller names the tenant; empty means the caller's own.
message GetRoundRequest { string room_id = 1; string game_id = 2; string tenant_id = 3; }

message RoundParticipantStateProto {
  string participant_id = 1;
  string binding_id = 2;
  string role = 3;
  string state = 4;
}

message RoundStatusReply {
  bool found = 1;
  string room_id = 2;
  string status = 3;
  int64 epoch = 4;
  int64 last_tick = 5;
  int64 state_version = 6;
  repeated RoundParticipantStateProto participants = 7;
}

// Room takeover (architecture 10.3): the control plane moves a live room's authority to a
// new instance — the handover bumps both epochs and fences the old owner, then the new owner
// confirms and recovers the room.
message TransferRoomOwnershipRequest {
  string tenant_id = 1;
  string game_id = 2;
  string room_id = 3;
  string from_instance = 4;
  string to_instance = 5;
  int32 lease_seconds = 6;
  // The recovery operation this transfer belongs to (FIX-TAKE-04): the transfer
  // transaction records it, and a retry after a lost reply replays the recorded
  // outcome by this id instead of bumping the epoch a second time.
  string operation_id = 7;
}

message ConfirmRoomOwnershipRequest {
  string tenant_id = 1;
  string game_id = 2;
  string room_id = 3;
  string owner_instance = 4;
}

message RoomTakeoverReply {
  string owner_instance_id = 1;
  int64 epoch = 2;
  string status = 3;
}

// FIX-TAKE-05: the recovery sweep moves a timed-out open operation to a different
// instance — a newer epoch, a fresh deadline, the old operation closed Failed. The
// store refuses the move before the recorded deadline passes (database time decides).
message ReassignRoomRecoveryRequest {
  string tenant_id = 1;
  string game_id = 2;
  string room_id = 3;
  // The open, expired operation being replaced.
  string operation_id = 4;
  // The recovery operation the reassignment opens.
  string new_operation_id = 5;
  string from_instance = 6;
  string to_instance = 7;
  int32 lease_seconds = 8;
}

message RouteEventsRequest {
  string platform = 1;
  string app_id = 2;
  string operation_id = 3;
  int32 max_events = 4;
}

message RoutedEventProto {
  string event_id = 1;
  string room_id = 2;
  int64 sequence = 3;
  string disposition = 4;
}

message RouteEventsReply {
  bool duplicate = 1;
  repeated RoutedEventProto events = 2;
}

message ClientInputRequest {
  string session_id = 1;
  string room_id = 2;
  int64 room_epoch = 3;
  string game_id = 4;
  string command_id = 5;
  string payload_json = 6;
  // A cluster-scoped caller names the tenant; empty means the caller's own.
  string tenant_id = 7;
}

// LeaveRound as the data plane owns it (contracts 3.1): the participation withdraws
// while the room runs to its natural settlement — no abort, no early result.
message WithdrawParticipationRequest {
  string tenant_id = 1;
  string session_id = 2;
  string room_id = 3;
  string game_id = 4;
  string operation_id = 5;
}

message ParticipationReply {
  string room_id = 1;
  string state = 2;
  bool duplicate = 3;
}

message ClientInputReply {
  string command_id = 1;
  string room_id = 2;
  int64 sequence = 3;
  int64 route_version = 4;
  bool duplicate = 5;
}

// One authoritative tick commit (architecture 8.2). The owner states the tick and state
// version it derived the candidate from; the store validates the fence, the prev frame and
// every input ref before anything is consumed.
message FrameEffectProto {
  string kind = 1;
  string payload_json = 2;
}

message PlannedGrantProto {
  string player_id = 1;
  string grant_key = 2;
  string operation_id = 3;
  // The immutable reward manifest (architecture 9.3): each grant carries its own asset
  // and amount, so the settler applies committed values, never re-derived ones.
  string asset_id = 4;
  int64 delta = 5;
}

message CommitFrameRequest {
  string room_id = 1;
  string game_id = 2;
  string owner_instance_id = 3;
  int64 epoch = 4;
  string commit_id = 5;
  int64 prev_tick = 6;
  int64 prev_state_version = 7;
  repeated string input_event_ids = 8;
  bytes state_hash = 9;
  repeated FrameEffectProto effects = 10;
  string module_version = 11;
  string config_hash = 12;
  // FullCheckpoint mode: the candidate state joins the frame transaction (8.2); absent
  // fields mean a regular deterministic tick.
  bytes snapshot_payload = 13;
  bytes snapshot_hash = 14;
  int32 snapshot_schema_version = 15;
  bool final = 16;
  string result_json = 17;
  bytes plan_hash = 18;
  repeated PlannedGrantProto grants = 19;
}

message FrameReceiptReply {
  string commit_id = 1;
  string room_id = 2;
  int64 tick = 3;
  int64 state_version = 4;
  int64 watermark = 5;
  bool duplicate = 6;
}

message ReadInboxRequest {
  string room_id = 1;
  string game_id = 2;
  int32 max_events = 3;
}

message InboxItemProto {
  string event_id = 1;
  int64 sequence = 2;
  int64 route_version = 3;
  string binding_id = 4;
  string payload_json = 5;
  // Client commands (platform @chorus) carry the command id as their dedup key so the
  // host can acknowledge the exact command a committed frame consumed.
  string platform = 6;
  string source_dedup_key = 7;
}

message ReadInboxReply {
  int64 watermark = 1;
  repeated InboxItemProto items = 2;
}

// Snapshot persistence and recovery reads (architecture 8.2, 10.3). PutSnapshot attaches a
// store-verified full snapshot to the last committed frame; LoadRecovery hands the recoverer
// everything a room needs to rebuild: the room head, every snapshot, the frames after the
// oldest snapshot and the full delivery log in routing order.
message PutSnapshotRequest {
  string room_id = 1;
  string game_id = 2;
  string owner_instance_id = 3;
  int64 epoch = 4;
  int64 tick = 5;
  bytes snapshot_payload = 6;
  bytes snapshot_hash = 7;
  int32 snapshot_schema_version = 8;
  string operation_id = 9;
}

// The Recovering-state twin of PutSnapshotRequest (contracts 6.2.1): same payload, but the
// fence admits exactly the takeover-named owner at the bumped epoch while the room ownership
// is Recovering — a normal frame or snapshot write still refuses.
message PutRecoverySnapshotRequest {
  string room_id = 1;
  string game_id = 2;
  string owner_instance_id = 3;
  int64 epoch = 4;
  int64 tick = 5;
  bytes snapshot_payload = 6;
  bytes snapshot_hash = 7;
  int32 snapshot_schema_version = 8;
  string operation_id = 9;
}

message SnapshotReceiptReply {
  string room_id = 1;
  int64 tick = 2;
  int32 snapshot_schema_version = 3;
  bool verified = 4;
  bool duplicate = 5;
}

message LoadRecoveryRequest {
  string room_id = 1;
  string game_id = 2;
  // How many newest snapshot candidates this read may load (FIX-READ-04). Zero asks for
  // the store's normal fallback pair; a recoverer whose whole window failed re-reads with
  // a deeper window on demand instead of declaring the history dead while anchors remain.
  int32 candidate_depth = 3;
  // Opaque pagination cursor (FIX-READ-05). Empty starts at the head of the plan; the
  // reply's next_page_token continues exactly past the last row this page carried. Each
  // page re-reads the plan and is refused if the room head or epoch moved, so pages are
  // never stitched from two views. A reader cancels by simply not asking for the next
  // page — no page holds server state.
  bytes page_token = 4;
}

message RecoverySnapshotProto {
  int64 tick = 1;
  int32 schema_version = 2;
  bytes payload = 3;
  bytes payload_hash = 4;
  bool verified = 5;
}

message RecoveryDeliveryProto {
  string event_id = 1;
  int64 sequence = 2;
  string binding_id = 3;
  string payload_json = 4;
  bool consumed = 5;
}

message RecoveryFrameProto {
  int64 tick = 1;
  repeated string input_event_ids = 2;
  bytes state_hash = 3;
  string module_version = 4;
  string config_hash = 5;
}

message LoadRecoveryReply {
  bool found = 1;
  string room_id = 2;
  string status = 3;
  int64 epoch = 4;
  int64 last_tick = 5;
  int64 state_version = 6;
  repeated RecoverySnapshotProto snapshots = 7;
  repeated RecoveryDeliveryProto deliveries = 8;
  repeated RecoveryFrameProto frames = 9;
  repeated RoundParticipantStateProto participants = 10;
  // Present when more rows follow in the same view; absent on the last page. The head
  // fields above ride on every page so a reader can verify the view never moved.
  bytes next_page_token = 11;
  // The room's persisted identity (FIX-MODULE-01): the recovery reads the module facts the
  // room was admitted under back from the room row instead of accepting a caller-supplied
  // tick or module guess. These ride on every page with the head fields so a reader
  // validates the identity against the same consistent view it replays.
  int32 tick_ms = 12;
  string module_version = 13;
  string config_hash = 14;
  string package_hash = 15;
  string recovery_mode = 16;
}

service RoundStore {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  rpc StartRound(StartRoundRequest) returns (RoundAdmissionReply);
  rpc AbortRound(AbortRoundRequest) returns (RoundAdmissionReply);
  rpc GetRound(GetRoundRequest) returns (RoundStatusReply);
  // Room lifecycle after admission (architecture 7.2): the owner deposits the tick-0
  // snapshot while the room is Preparing, activation flips it to Running at state
  // version 1, and a suspension parks a damaged round visibly instead of killing it.
  rpc PrepareRound(PrepareRoundRequest) returns (RoundAdmissionReply);
  rpc ActivateRound(ActivateRoundRequest) returns (RoundAdmissionReply);
  rpc SuspendRound(SuspendRoundRequest) returns (RoundAdmissionReply);
  // Authority handover: transfer parks the room Recovering under the new holder at a bumped
  // epoch; confirm flips it back to Active — the holder calls it once its recovery pinned
  // the verified head (contracts 6.2.1), so activation never precedes a real recovery.
  rpc TransferRoomOwnership(TransferRoomOwnershipRequest) returns (RoomTakeoverReply);
  rpc ConfirmRoomOwnership(ConfirmRoomOwnershipRequest) returns (RoomTakeoverReply);
  // Control-plane only: the recovery sweep's reassignment of a timed-out open
  // operation (FIX-TAKE-05).
  rpc ReassignRoomRecovery(ReassignRoomRecoveryRequest) returns (RoomTakeoverReply);
}

service RoundInput {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  rpc RouteEvents(RouteEventsRequest) returns (RouteEventsReply);
  rpc AcceptClientInput(ClientInputRequest) returns (ClientInputReply);
  rpc WithdrawParticipation(WithdrawParticipationRequest) returns (ParticipationReply);
}

// Settlement and round finalization (architecture 9.3). The final frame commits the
// immutable reward manifest; CommitResult applies every planned grant as its own
// idempotent transaction — a crash mid-settlement only ever retries the incomplete
// grants. FinalizeRound is the persistent terminator: it verifies the preconditions
// and atomically settles the room, frees the mounts and withdraws the ownership.
service Settlement {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  rpc CommitResult(CommitResultRequest) returns (CommitResultReply);
  rpc FinalizeRound(FinalizeRoundRequest) returns (FinalizeRoundReply);
  rpc ReadLeaderboard(ReadLeaderboardRequest) returns (LeaderboardReply);
  // The settle queue (FIX-SETTLE-01): rooms whose committed result still has unapplied
  // grants, one bounded page in room order. Rooms without a committed result never
  // appear; a partially applied manifest stays listed until every grant is Granted.
  rpc ListPendingSettlements(ListPendingSettlementsRequest) returns (ListPendingSettlementsReply);
}

// Authoritative frame commits and round inbox reads (architecture 8.2, 6.1.6). Only the
// room owner commits; reads belong to the owner and the control plane for diagnostics.
service FrameStore {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  rpc CommitFrame(CommitFrameRequest) returns (FrameReceiptReply);
  rpc ReadInbox(ReadInboxRequest) returns (ReadInboxReply);
  // Recovery boundary: the owner persists store-verified snapshots; the owner and the
  // control plane read the recovery plan (architecture 8.2, 10.3).
  rpc PutSnapshot(PutSnapshotRequest) returns (SnapshotReceiptReply);
  // The Recovering-only snapshot entry (contracts 6.2.1): the takeover-named owner pins a
  // verified snapshot at the recovery head while the frame fence stays closed; activation
  // is a separate fenced confirm.
  rpc PutRecoverySnapshot(PutRecoverySnapshotRequest) returns (SnapshotReceiptReply);
  rpc LoadRecovery(LoadRecoveryRequest) returns (LoadRecoveryReply);
}

// Room preparation on the game host (architecture 7.2). The control plane names the
// admitted room and its module configuration; the host derives the deterministic initial
// state, deposits the tick-0 snapshot, activates the round and starts the room actor —
// or, when the prepare defers activation, holds the room until ActivateRoom releases it.
service GameHost {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  rpc PrepareRoom(PrepareRoomRequest) returns (PrepareRoomReply);
  // FIX-PERF-03: release a held room across the fleet's common start line.
  rpc ActivateRoom(ActivateRoomRequest) returns (ActivateRoomReply);
  // Snapshot recovery (architecture 10.3): replay from the newest usable snapshot, resume
  // ticking; a Finishing room recovers its tail without restarting battle ticks.
  rpc RecoverRoom(RecoverRoomRequest) returns (RecoverRoomReply);
}

// Retention on the data plane (architecture 9 data retention, AT21). The control plane
// releases a settled round's frame prefix below its recovery anchor; the guards are part of
// the contract, so a refusal is data, not noise.
service Retention {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  rpc PruneRound(PruneRoundRequest) returns (PruneRoundReply);
}

message PruneRoundRequest {
  string room_id = 1;
  string game_id = 2;
  string operation_id = 3;
  string tenant_id = 4;
  // A deliberate ops override of the settled-round retention window. The default keeps raw
  // events and frames for troubleshooting; pressure never prunes quietly (AT21).
  bool override_retention_window = 5;
}

message PruneRoundReply {
  string room_id = 1;
  // The anchor the prefix was released below: everything at or after it stays.
  int64 keep_tick = 2;
  int64 frames_deleted = 3;
  int64 snapshots_deleted = 4;
  bool duplicate = 5;
}

// Client sync fan-out on the game host (architecture 8.3). Only committed frames are
// published: a fresh or lagging subscriber receives a full snapshot before any delta, a
// subscriber current at the head continues with deltas alone, and a subscriber whose queue
// overflowed is re-baselined with a snapshot instead of a discontinuous delta.
service RoundSync {
  rpc Subscribe(SubscribeRequest) returns (stream SyncMessage);
}

message PrepareRoundRequest {
  string room_id = 1;
  string owner_instance_id = 2;
  int64 epoch = 3;
  string game_id = 4;
  // The serialized tick-0 state and its hash become the room's first snapshot; the
  // schema version is the module's own and gates Restore.
  bytes snapshot_payload = 5;
  bytes snapshot_hash = 6;
  int32 snapshot_schema_version = 7;
  string operation_id = 8;
  // The room's tick cadence, persisted with the room so a stall governor can recover it
  // on another host without guessing (FIX-TAKE-07).
  int32 tick_ms = 9;
  // The room's recovery/checkpoint mode, persisted with the room so a recovery rebuilds
  // the module under the policy the room was prepared with, never under a caller-supplied
  // guess (FIX-MODULE-01). Empty = the cluster's shipped mode.
  string recovery_mode = 10;
}

message ActivateRoundRequest {
  string room_id = 1;
  string owner_instance_id = 2;
  int64 epoch = 3;
  string game_id = 4;
  string operation_id = 5;
}

message SuspendRoundRequest {
  string room_id = 1;
  string owner_instance_id = 2;
  int64 epoch = 3;
  string game_id = 4;
  string reason = 5;
  string operation_id = 6;
}

message GameParticipantProto {
  string binding_id = 1;
  string participant_id = 2;
  string faction = 3;
}

message PrepareRoomRequest {
  string room_id = 1;
  string game_id = 2;
  string owner_instance_id = 3;
  int64 epoch = 4;
  string operation_id = 5;
  // The example module start configuration: everything the initial state derives from.
  int64 duration_ticks = 6;
  int64 random_seed = 7;
  int32 fail_after_tick = 8;
  int32 tick_ms = 9;
  repeated GameParticipantProto participants = 10;
  // FIX-TAKE-07 test seam: when set, this prepare's actor freezes deterministically at
  // this tick for hang_ms while the process keeps reporting — the frozen-Running signal
  // the stall governor acts on. Recovery never carries the seam: the actor a takeover
  // builds resumes from the pinned head without hanging.
  int32 hang_after_tick = 11;
  int32 hang_ms = 12;
  // FIX-PERF-03 synchronized start: the room is prepared and held — round Preparing,
  // actor not ticking — until ActivateRoom releases it, so a fleet can cross one
  // common start line instead of staggering by prepare order.
  bool deferred_activation = 13;
  // FIX-MODULE-02: the package this room runs — the same hash StartRound pinned on the
  // room row. Empty = the cluster's default package. A hash the game host does not ship
  // is refused by name (FailedPrecondition); the host never falls back to the default
  // example module for a room that named another package.
  string package_hash = 14;
}

message ActivateRoomRequest {
  string room_id = 1;
  string game_id = 2;
  string owner_instance_id = 3;
  int64 epoch = 4;
  string operation_id = 5;
}

message ActivateRoomReply {
  string room_id = 1;
  bool duplicate = 2;
  string status = 3;
}

message PrepareRoomReply {
  string room_id = 1;
  bool duplicate = 2;
  string status = 3;
  int64 state_version = 4;
  int64 tick = 5;
}

// The recovery identity contract (FIX-MODULE-01): the room's identity is a persisted fact,
// never a caller opinion. A recovery is refused — recovered=false with a named note — when
// the request restates a tick different from the room's persisted cadence, or when the
// room's package, module version or checkpoint mode is one this host cannot load. A
// recovery never changes the original round's tick, config or module.
message RecoverRoomRequest {
  string room_id = 1;
  string game_id = 2;
  string owner_instance_id = 3;
  int64 epoch = 4;
  // The tick cadence the caller expects the room to run at; 0 means "use the room's
  // persisted cadence". A positive value that disagrees with the persisted cadence is
  // refused, so a takeover or admin retry cannot silently change the room's tick.
  int32 tick_ms = 5;
}

message RecoverRoomReply {
  string room_id = 1;
  bool recovered = 2;
  // The outcome, named for the contract: a tick mismatch names the persisted cadence, a
  // missing package names the unknown package, an incompatible module names the version or
  // checkpoint mode the room was persisted under.
  string note = 3;
  string status = 4;
  int64 last_tick = 5;
  int64 snapshot_tick = 6;
  int32 replayed_frames = 7;
}

message CommitResultRequest {
  string room_id = 1;
  string game_id = 2;
  string operation_id = 3;
  // Cluster-scope callers (control plane) name the tenant they act for; tenant-scope
  // callers inherit their certificate tenant and must not name another one.
  string tenant_id = 4;
}

message CommitResultReply {
  string room_id = 1;
  int64 result_version = 2;
  int32 grants_total = 3;
  int32 grants_granted = 4;
  int32 grants_pending = 5;
  bool duplicate = 6;
}

message FinalizeRoundRequest {
  string room_id = 1;
  string game_id = 2;
  string operation_id = 3;
  string tenant_id = 4;
}

message FinalizeRoundReply {
  string room_id = 1;
  string status = 2;
  int64 epoch = 3;
  bool duplicate = 4;
  string note = 5;
}

message LeaderboardEntryProto {
  string player_id = 1;
  int64 score = 2;
}

message ReadLeaderboardRequest {
  string game_id = 1;
  string board_id = 2;
  int32 max_entries = 3;
  string tenant_id = 4;
}

message LeaderboardReply {
  string board_id = 1;
  repeated LeaderboardEntryProto entries = 2;
}

message ListPendingSettlementsRequest {
  string game_id = 1;
  // Page size; the store clamps it into 1..500 and refuses anything outside.
  int32 limit = 2;
  // Empty starts from the beginning; otherwise the previous reply's next_cursor, so the
  // walk resumes past the last room it carried. No page holds server state.
  string cursor = 3;
  string tenant_id = 4;
}

message ListPendingSettlementsReply {
  repeated PendingSettlementProto settlements = 1;
  // Present when the page filled to its limit — more rooms may follow; empty on the
  // last page. Send it back verbatim as the next request's cursor.
  string next_cursor = 2;
}

message PendingSettlementProto {
  string room_id = 1;
  int64 result_version = 2;
  int32 grants_total = 3;
  int32 grants_granted = 4;
  int32 grants_pending = 5;
}

message SubscribeRequest {
  string room_id = 1;
  string game_id = 2;
  // The epoch the subscriber last knew. A room that moved on answers ResyncRequired
  // instead of streaming an epoch the client cannot validate (architecture 8.3).
  int64 epoch = 3;
  // The subscriber's applied baseline: (tick, state version) of the last message it
  // applied. A baseline at the current head continues with deltas alone; anything
  // older receives a full snapshot first.
  int64 last_applied_tick = 4;
  int64 last_applied_state_version = 5;
}

message SyncMessage {
  oneof kind {
    SnapshotMessage snapshot = 1;
    DeltaMessage delta = 2;
    RoundResultMessage round_result = 3;
    ResyncRequiredMessage resync_required = 4;
  }
}

// Every message carries the room identity the client validates: room, epoch, tick,
// state version, module version and config hash (architecture 8.3).
message SnapshotMessage {
  string room_id = 1;
  int64 epoch = 2;
  int64 tick = 3;
  int64 state_version = 4;
  string module_version = 5;
  string config_hash = 6;
  bytes state_payload = 7;
  int32 state_schema_version = 8;
}

message DeltaMessage {
  string room_id = 1;
  int64 epoch = 2;
  int64 tick = 3;
  int64 state_version = 4;
  // The version this delta applies to — the client rejects a delta whose base it never
  // applied instead of guessing the gap.
  int64 base_version = 5;
  string module_version = 6;
  string config_hash = 7;
  bytes state_hash = 8;
  repeated string input_event_ids = 9;
  repeated FrameEffectProto effects = 10;
  repeated CommandReceiptProto commands = 11;
}

// Acknowledges that a client command became part of the authoritative frame record.
message CommandReceiptProto {
  string command_id = 1;
  int64 sequence = 2;
}

message RoundResultMessage {
  string room_id = 1;
  int64 epoch = 2;
  int64 tick = 3;
  int64 state_version = 4;
  string result_json = 5;
}

message ResyncRequiredMessage {
  string room_id = 1;
  int64 current_epoch = 2;
  string reason = 3;
}
