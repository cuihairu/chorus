syntax = "proto3";

package chorus.m2;
option csharp_namespace = "Chorus.Rpc";

import "Protos/m0.proto";

// Round admission and routing boundaries (architecture 6.2, 6.3). The tenant and the caller
// role come from the client certificate; every mutating call is one store transaction, so a
// reply always reflects a committed state.

import "Protos/m2.round.proto";
import "Protos/m2.frame.proto";
import "Protos/m2.settle.proto";
import "Protos/m2.board.proto";
import "Protos/m2.sync.proto";
import "Protos/m2.host.proto";
import "Protos/m2.retention.proto";

service RoundStore {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  rpc StartRound(StartRoundRequest) returns (RoundAdmissionReply);
  rpc AbortRound(AbortRoundRequest) returns (RoundAdmissionReply);
  rpc GetRound(GetRoundRequest) returns (RoundStatusReply);
  // Room lifecycle after admission (architecture 7.2): the owner deposits the tick-0
  // snapshot while the room is Preparing, activation flips it to Running at state
  // version 1, and a suspension parks a damaged round visibly instead of killing it.
  rpc PrepareRound(PrepareRoundRequest) returns (RoundAdmissionReply);
  rpc ActivateRound(ActivateRoundRequest) returns (RoundAdmissionReply);
  rpc SuspendRound(SuspendRoundRequest) returns (RoundAdmissionReply);
  // FIX-SYNC-06: the persistent pause. The game host parks a room at a committed boundary
  // when every control session has been offline past the declared grace (authoritative-
  // sync.md:42) — the freeze is a durable fact: status flips Running to Paused and the
  // committed head (last_tick, state_version) is the frozen tick the room resumes from.
  // A paused room accepts no frames, and a restart that loads it restores Paused — the
  // pause is never a stopped local timer, it is the room row's status.
  rpc PauseRound(PauseRoundRequest) returns (RoundAdmissionReply);
  // FIX-SYNC-08: resume readiness and the committed resume boundary. A control participant
  // whose mount is refused because its round is paused reports its current-generation session
  // (ReportResumeReady — the store resolves the paused room from the streamer's open live
  // session); once the declared ready count is reached, the owner's ResumeRound lifts the
  // paused room back to Running at that head.
  rpc ReportResumeReady(ReportResumeReadyRequest) returns (ResumeReadyReply);
  rpc ResumeRound(ResumeRoundRequest) returns (RoundAdmissionReply);
  // Authority handover: transfer parks the room Recovering under the new holder at a bumped
  // epoch; confirm flips it back to Active — the holder calls it once its recovery pinned
  // the verified head (contracts 6.2.1), so activation never precedes a real recovery.
  rpc TransferRoomOwnership(TransferRoomOwnershipRequest) returns (RoomTakeoverReply);
  rpc ConfirmRoomOwnership(ConfirmRoomOwnershipRequest) returns (RoomTakeoverReply);
  // Control-plane only: the recovery sweep's reassignment of a timed-out open
  // operation (FIX-TAKE-05).
  rpc ReassignRoomRecovery(ReassignRoomRecoveryRequest) returns (RoomTakeoverReply);
}

service RoundInput {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  rpc RouteEvents(RouteEventsRequest) returns (RouteEventsReply);
  rpc AcceptClientInput(ClientInputRequest) returns (ClientInputReply);
  rpc WithdrawParticipation(WithdrawParticipationRequest) returns (ParticipationReply);
  // FIX-INPUT-01: the durable leg of the direct-push contract. The game host forwards
  // an attributed room event; the store fences it against the room ownership row
  // (owner instance, epoch, live lease, Active) before the event, its inbox delivery
  // and the cursor advance commit as one transaction. The reply means durably
  // accepted — never applied. FailedPrecondition is a stale owner picture;
  // InvalidArgument is an attribution error retrying cannot fix.
  rpc AcceptRoomEvent(AcceptRoomEventRequest) returns (AcceptRoomEventReply);
  // FIX-GM-07: the read the delegated dispatch needs before it can attribute a command —
  // a binding's current room and round generation, exactly the row the store itself checks
  // an attributed push against. Read-only; a racing bump closes through AcceptRoomEvent's
  // own fence, never through this read.
  rpc GetBinding(GetBindingRequest) returns (GetBindingReply);
  // FIX-GM-07: the effect query behind the admin's operation status — one operation id
  // answered from the durable record: the input row's existence and disposition, the
  // delivery state, and the tick whose committed frame consumed it.
  rpc LookupInput(LookupInputRequest) returns (LookupInputReply);
}

// Settlement and round finalization (architecture 9.3). The final frame commits the
// immutable reward manifest; CommitResult applies every planned grant as its own
// idempotent transaction — a crash mid-settlement only ever retries the incomplete
// grants. FinalizeRound is the persistent terminator: it verifies the preconditions
// and atomically settles the room, frees the mounts and withdraws the ownership.
service Settlement {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  rpc CommitResult(CommitResultRequest) returns (CommitResultReply);
  rpc FinalizeRound(FinalizeRoundRequest) returns (FinalizeRoundReply);
  rpc ReadLeaderboard(ReadLeaderboardRequest) returns (LeaderboardReply);
  // The settle queue (FIX-SETTLE-01): rooms whose committed result still has unapplied
  // grants, one bounded page in room order. Rooms without a committed result never
  // appear; a partially applied manifest stays listed until every grant is Granted.
  rpc ListPendingSettlements(ListPendingSettlementsRequest) returns (ListPendingSettlementsReply);
  // FIX-END-11: the control plane's settlement executor applies a room's remaining grants —
  // each grant its own idempotent receipt transaction, so the original host, a recoverer and
  // this executor can drive the same manifest concurrently and every grant still lands one
  // ledger line. The data plane stores; it never decides settlement or closing steps.
  rpc SettleGrants(SettleGrantsRequest) returns (CommitResultReply);
}

// FIX-RANK-03: idempotent score projection from committed effects (developer-capabilities.md
// 「Score changes derive from immutable committed server effects」). The GameServer commits
// each scoring effect with its frame (the frame commit writes it to the committed effect
// ledger under kind 'score'); a business module within ControlServer validates the source,
// selects the board/period/scope and drives the projection; the data plane stores. The data
// plane never accepts a score value — it verifies, in the apply transaction, that the effect
// is a committed score effect whose own delta matches, then applies it exactly once per
// immutable EffectId. A client self-report, an unrelated asset change or an inflated delta
// is refused before any projection write.
service Leaderboard {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  // Reads one committed effect by its immutable EffectId (the validated source). Found and
  // kind 'score' means the business module may project it; a client self-report names an id
  // that never appears here.
  rpc ReadCommittedScoreEffect(ReadCommittedScoreEffectRequest) returns (CommittedScoreEffectReply);
  // Applies one committed score effect onto a declared board, exactly once per EffectId.
  // The business module passes the board it selected and the subject/delta it derived from
  // the committed payload; the data plane re-verifies the committed source and the delta.
  rpc ApplyScoreEffect(ApplyScoreEffectRequest) returns (ApplyScoreEffectReply);
  // FIX-RANK-04: the bounded TopN of a board in its declared order, with the board's read
  // version at the same snapshot. The answer is bound to the read version; a paginated
  // continuation carries it back (expected_version) and a changed board is a stale read —
  // the caller must restart, never page across a change invisibly.
  rpc GetTop(GetTopRequest) returns (TopNReply);
  // FIX-RANK-05: one subject's position on a board — its score and its unique ordinal rank
  // in the board's declared order, at one read view. The rank and the score are never from
  // different versions (a live board's personal rank is one consistent view).
  rpc GetRank(GetRankRequest) returns (RankReply);
  // FIX-RANK-05: the entries within a bounded window of a subject's rank (the subject
  // included), in rank order, at one read view. Absent when the subject has not scored.
  rpc GetAroundMe(GetAroundMeRequest) returns (AroundReply);
  // FIX-RANK-08: the GM correction — a signed delta onto one subject's entry of a named
  // board/period/scope. The operation id is the idempotency key and the audit anchor; the
  // reason and the caller identity are the audit evidence; the expected version refuses a
  // correction over a board that changed since the operator last read it.
  rpc AdjustBoard(AdjustBoardRequest) returns (AdjustBoardReply);
  // FIX-RANK-08: the GM reset — zero one subject's entry (or the whole board's when no
  // subject is named). Same guards and evidence as the adjustment.
  rpc ResetBoard(ResetBoardRequest) returns (ResetBoardReply);
  // FIX-RANK-08: the projection rebuild — re-derives the board's entries from its effect
  // ledger (game effects and GM rows in apply order), never from the entries themselves.
  // Replaying the ledger cannot add a score twice: the ledger is the source, the entries
  // are the derived cache. Original scoring evidence stays untouched.
  rpc RebuildBoard(RebuildBoardRequest) returns (RebuildBoardReply);
}

// Authoritative frame commits and round inbox reads (architecture 8.2, 6.1.6). Only the
// room owner commits; reads belong to the owner and the control plane for diagnostics.
service FrameStore {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  rpc CommitFrame(CommitFrameRequest) returns (FrameReceiptReply);
  rpc ReadInbox(ReadInboxRequest) returns (ReadInboxReply);
  // FIX-SYNC-08: the pause-timeout terminal result (authoritative-sync.md:54). The module's
  // rule for a pause that exceeded its declared duration derives the result from the frozen
  // state; this commits the game.result + grant plan and flips the room Paused→Finishing —
  // the end-operation ladder (FIX-END-15) is entered by the caller immediately after, so the
  // timeout never bypasses platform-close confirmation.
  rpc CommitPausedResult(CommitPausedResultRequest) returns (FrameReceiptReply);
  // Recovery boundary: the owner persists store-verified snapshots; the owner and the
  // control plane read the recovery plan (architecture 8.2, 10.3).
  rpc PutSnapshot(PutSnapshotRequest) returns (SnapshotReceiptReply);
  // The Recovering-only snapshot entry (contracts 6.2.1): the takeover-named owner pins a
  // verified snapshot at the recovery head while the frame fence stays closed; activation
  // is a separate fenced confirm.
  rpc PutRecoverySnapshot(PutRecoverySnapshotRequest) returns (SnapshotReceiptReply);
  rpc LoadRecovery(LoadRecoveryRequest) returns (LoadRecoveryReply);
}

// Room preparation on the game host (architecture 7.2). The control plane names the
// admitted room and its module configuration; the host derives the deterministic initial
// state, deposits the tick-0 snapshot, activates the round and starts the room actor —
// or, when the prepare defers activation, holds the room until ActivateRoom releases it.
service GameHost {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  rpc PrepareRoom(PrepareRoomRequest) returns (PrepareRoomReply);
  // FIX-PERF-03: release a held room across the fleet's common start line.
  rpc ActivateRoom(ActivateRoomRequest) returns (ActivateRoomReply);
  // Snapshot recovery (architecture 10.3): replay from the newest usable snapshot, resume
  // ticking; a Finishing room recovers its tail without restarting battle ticks.
  rpc RecoverRoom(RecoverRoomRequest) returns (RecoverRoomReply);
  // FIX-SYNC-08: resume readiness and pause-timeout termination, driven by the control
  // plane's coordinator. ResumeRoom lifts the paused room back to Running at its frozen head
  // and starts the room's actor (exactly one — a repeated resume answers actor_running);
  // FinishPausedRoom derives the module's terminal result from the frozen state, commits it,
  // and enters the end-operation ladder — never a bypass of platform-close confirmation.
  rpc ResumeRoom(ResumeRoomRequest) returns (ResumeRoomReply);
  rpc FinishPausedRoom(FinishPausedRoomRequest) returns (FinishPausedRoomReply);
  // FIX-END-14: destroy a released round's runtime entities on this host. The ceiling is
  // the released ownership row's own (bumped) epoch — every actor of this room strictly
  // below it belongs to the settled round and goes; an actor at or above it is a newer
  // generation and is never touched. The call does not depend on the original actor being
  // alive: an unknown or already-destroyed room answers cleanly, and destroying never
  // throws. The frozen result stays queryable (FIX-ROOM-05); no persisted row moves.
  rpc DestroyRoom(DestroyRoomRequest) returns (DestroyRoomReply);
  // FIX-GM-07: the operator-delegated playtest command (architecture 12.1). The control
  // plane has already authenticated the operator and written the audit row; this host is
  // the delegation fence and the target-version authority: it answers StaleOwner unless it
  // owns the room at its own epoch, resolves the named participant's live binding itself
  // (never trusting a caller-named endpoint or binding), and forwards the command through
  // the same durable ordered-input path a client command rides. control-server callers only.
  rpc DeliverRoomCommand(DeliverRoomCommandRequest) returns (DeliverRoomCommandReply);
}

// FIX-INPUT-01: the direct-push room-event edge on the game host. The routing layer
// pushes an attributed platform event straight at the host it believes owns the room,
// naming the owner instance and epoch; the host refuses what it does not own, bounds
// its inbound queue, then durably accepts through the data plane before confirming.
// See DeliverRoomEventReply for the disposition contract.
service RoomEvents {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  rpc DeliverEvent(DeliverRoomEventRequest) returns (DeliverRoomEventReply);
}

// Retention on the data plane (architecture 9 data retention, AT21). The control plane
// releases a settled round's frame prefix below its recovery anchor; the guards are part of
// the contract, so a refusal is data, not noise.
service Retention {
  rpc Ready(chorus.m0.Empty) returns (chorus.m0.ReadyReply);
  rpc PruneRound(PruneRoundRequest) returns (PruneRoundReply);
}

// Client sync fan-out on the game host (architecture 8.3). Only committed frames are
// published: a fresh or lagging subscriber receives a full snapshot before any delta, a
// subscriber current at the head continues with deltas alone, and a subscriber whose queue
// overflowed is re-baselined with a snapshot instead of a discontinuous delta.
service RoundSync {
  rpc Subscribe(SubscribeRequest) returns (stream SyncMessage);
}
