syntax = "proto3";

package chorus.m2;
option csharp_namespace = "Chorus.Rpc";

import "Protos/m2.board.proto";

// Round lifecycle, admission, ownership and recovery contracts.

message RoundParticipantProto {
  string binding_id = 1;
  string participant_id = 2;
  string role = 3;
}

message StartRoundRequest {
  string room_id = 1;
  string owner_instance_id = 2;
  int64 epoch = 3;
  string game_id = 4;
  string module_version = 5;
  string config_hash = 6;
  string package_hash = 7;
  string operation_id = 8;
  repeated RoundParticipantProto participants = 9;
  // Empty = the caller's certificate tenant; a cluster-scoped coordinator names the tenant
  // it acts for (the same rule as the match services).
  string tenant_id = 10;
}

message AbortRoundRequest {
  string room_id = 1;
  string owner_instance_id = 2;
  int64 epoch = 3;
  string game_id = 4;
  string reason = 5;
  string operation_id = 6;
}

message RoundAdmissionReply {
  string room_id = 1;
  int64 round_generation = 2;
  string status = 3;
  int64 epoch = 4;
  bool duplicate = 5;
}

// A cluster-scoped caller names the tenant; empty means the caller's own.
message GetRoundRequest { string room_id = 1; string game_id = 2; string tenant_id = 3; }

message RoundParticipantStateProto {
  string participant_id = 1;
  string binding_id = 2;
  string role = 3;
  string state = 4;
}

message RoundStatusReply {
  bool found = 1;
  string room_id = 2;
  string status = 3;
  int64 epoch = 4;
  int64 last_tick = 5;
  int64 state_version = 6;
  repeated RoundParticipantStateProto participants = 7;
}

// Room takeover (architecture 10.3): the control plane moves a live room's authority to a
// new instance — the handover bumps both epochs and fences the old owner, then the new owner
// confirms and recovers the room.
message TransferRoomOwnershipRequest {
  string tenant_id = 1;
  string game_id = 2;
  string room_id = 3;
  string from_instance = 4;
  string to_instance = 5;
  int32 lease_seconds = 6;
  // The recovery operation this transfer belongs to (FIX-TAKE-04): the transfer
  // transaction records it, and a retry after a lost reply replays the recorded
  // outcome by this id instead of bumping the epoch a second time.
  string operation_id = 7;
}

message ConfirmRoomOwnershipRequest {
  string tenant_id = 1;
  string game_id = 2;
  string room_id = 3;
  string owner_instance = 4;
}

message RoomTakeoverReply {
  string owner_instance_id = 1;
  int64 epoch = 2;
  string status = 3;
}

// FIX-TAKE-05: the recovery sweep moves a timed-out open operation to a different
// instance — a newer epoch, a fresh deadline, the old operation closed Failed. The
// store refuses the move before the recorded deadline passes (database time decides).
message ReassignRoomRecoveryRequest {
  string tenant_id = 1;
  string game_id = 2;
  string room_id = 3;
  // The open, expired operation being replaced.
  string operation_id = 4;
  // The recovery operation the reassignment opens.
  string new_operation_id = 5;
  string from_instance = 6;
  string to_instance = 7;
  int32 lease_seconds = 8;
}

// LeaveRound as the data plane owns it (contracts 3.1): the participation withdraws
// while the room runs to its natural settlement — no abort, no early result.
message WithdrawParticipationRequest {
  string tenant_id = 1;
  string session_id = 2;
  string room_id = 3;
  string game_id = 4;
  string operation_id = 5;
}

message ParticipationReply {
  string room_id = 1;
  string state = 2;
  bool duplicate = 3;
}

message LoadRecoveryRequest {
  string room_id = 1;
  string game_id = 2;
  // How many newest snapshot candidates this read may load (FIX-READ-04). Zero asks for
  // the store's normal fallback pair; a recoverer whose whole window failed re-reads with
  // a deeper window on demand instead of declaring the history dead while anchors remain.
  int32 candidate_depth = 3;
  // Opaque pagination cursor (FIX-READ-05). Empty starts at the head of the plan; the
  // reply's next_page_token continues exactly past the last row this page carried. Each
  // page re-reads the plan and is refused if the room head or epoch moved, so pages are
  // never stitched from two views. A reader cancels by simply not asking for the next
  // page — no page holds server state.
  bytes page_token = 4;
}

message RecoverySnapshotProto {
  int64 tick = 1;
  int32 schema_version = 2;
  bytes payload = 3;
  bytes payload_hash = 4;
  bool verified = 5;
}

message RecoveryDeliveryProto {
  string event_id = 1;
  int64 sequence = 2;
  string binding_id = 3;
  string payload_json = 4;
  bool consumed = 5;
  // FIX-SYNC-09: the delivery's origin channel. A recovery replay must re-derive the same
  // command the live tick fed the module — including the origin-aware translation gate and
  // the NormalizedInput.FromClient trust bit — so a replayed room's state hash matches.
  // Absent on pre-upgrade wire (empty string), the replay treats it as a platform fact,
  // which is the pre-SYNC-09 behavior for those deliveries.
  string platform = 6;
}

message RecoveryFrameProto {
  int64 tick = 1;
  repeated string input_event_ids = 2;
  bytes state_hash = 3;
  string module_version = 4;
  string config_hash = 5;
}

message LoadRecoveryReply {
  bool found = 1;
  string room_id = 2;
  string status = 3;
  int64 epoch = 4;
  int64 last_tick = 5;
  int64 state_version = 6;
  repeated RecoverySnapshotProto snapshots = 7;
  repeated RecoveryDeliveryProto deliveries = 8;
  repeated RecoveryFrameProto frames = 9;
  repeated RoundParticipantStateProto participants = 10;
  // Present when more rows follow in the same view; absent on the last page. The head
  // fields above ride on every page so a reader can verify the view never moved.
  bytes next_page_token = 11;
  // The room's persisted identity (FIX-MODULE-01): the recovery reads the module facts the
  // room was admitted under back from the room row instead of accepting a caller-supplied
  // tick or module guess. These ride on every page with the head fields so a reader
  // validates the identity against the same consistent view it replays.
  int32 tick_ms = 12;
  string module_version = 13;
  string config_hash = 14;
  string package_hash = 15;
  string recovery_mode = 16;
  // The room's all-offline policy in its canonical persisted form (FIX-SYNC-04): rides on
  // every page with the rest of the identity so the recoverer refuses a round whose
  // declared offline behavior no longer matches the package it loads.
  string offline_policy = 17;
}

message GetBindingRequest {
  string binding_id = 1;
}

message GetBindingReply {
  bool found = 1;
  // Null when the binding is unmounted.
  string current_room_id = 2;
  int64 round_generation = 3;
}

message LookupInputRequest {
  string event_id = 1;
}

message LookupInputReply {
  bool found = 1;
  string platform = 2;
  // The input row's own disposition — "Routed" (live, room-attributed) or a terminal
  // out-of-round word ("OutOfRound", "Skipped", "Compensated", ...).
  string disposition = 3;
  string room_id = 4;
  // The attributed delivery's state: "Pending" (durably accepted, unconsumed) or
  // "Consumed" (a committed frame took it). Empty when the event has no delivery yet.
  string delivery_state = 5;
  // The tick whose committed frame's input refs name this event id; 0 while unconsumed.
  int64 applied_tick = 6;
}

message PrepareRoundRequest {
  string room_id = 1;
  string owner_instance_id = 2;
  int64 epoch = 3;
  string game_id = 4;
  // The serialized tick-0 state and its hash become the room's first snapshot; the
  // schema version is the module's own and gates Restore.
  bytes snapshot_payload = 5;
  bytes snapshot_hash = 6;
  int32 snapshot_schema_version = 7;
  string operation_id = 8;
  // The room's tick cadence, persisted with the room so a stall governor can recover it
  // on another host without guessing (FIX-TAKE-07).
  int32 tick_ms = 9;
  // The room's recovery/checkpoint mode, persisted with the room so a recovery rebuilds
  // the module under the policy the room was prepared with, never under a caller-supplied
  // guess (FIX-MODULE-01). Empty = the cluster's shipped mode.
  string recovery_mode = 10;
  // The room's all-offline policy, persisted with the room so a recovery validates the
  // round against the exact declaration it was admitted under instead of silently adopting
  // whatever the package ships later (FIX-SYNC-04). The canonical form is written by the
  // game host at prepare; empty = the room predates the declaration.
  string offline_policy = 11;
}

message ActivateRoundRequest {
  string room_id = 1;
  string owner_instance_id = 2;
  int64 epoch = 3;
  string game_id = 4;
  string operation_id = 5;
}

message SuspendRoundRequest {
  string room_id = 1;
  string owner_instance_id = 2;
  int64 epoch = 3;
  string game_id = 4;
  string reason = 5;
  string operation_id = 6;
}

// FIX-SYNC-06: the persistent pause request. The game host parks the room at the committed
// boundary named by tick/state_version — the frozen head a later recovery (or resume)
// restores — and the store flips status Running to Paused under the ownership fence.
message PauseRoundRequest {
  string room_id = 1;
  string owner_instance_id = 2;
  int64 epoch = 3;
  string game_id = 4;
  string reason = 5;
  string operation_id = 6;
  // The committed boundary the room froze at (the actor's just-committed tick and the
  // state version that tick produced). The store pins them as the pause head so a paused
  // room never silently resumes past the boundary the clients abandoned.
  int64 tick = 7;
  int64 state_version = 8;
}

// FIX-SYNC-08: a control participant's report that its current-generation session applied
// the paused room's frozen head as its resume baseline (authoritative-sync.md:53). One
// durable ready row per participant. The streamer reports from its session-grant path (the
// control participant's session re-established at the current generation — the mount itself
// is refused while the room is paused), so the store resolves the paused room from the
// streamer's open live session and fences the report on the session being the streamer's
// CURRENT session — an old session's readiness never counts (旧会话准备不计数). The frozen
// head (last_tick, state_version) the store reads is the baseline a ready must be declared
// against; a changed epoch or a room that left Paused refuses the report.
message ReportResumeReadyRequest {
  string tenant_id = 1;
  string game_id = 2;
  string streamer_id = 3;
  // The auth session that reports: it must be the streamer's current session.
  string session_id = 4;
  string operation_id = 5;
}

message ResumeReadyReply {
  string room_id = 1;
  int32 ready_count = 2;
  // The declared threshold (canonical offline_policy field 4) a resume waits for.
  int32 required_ready_count = 3;
  bool paused = 4;
  bool duplicate = 5;
}

// FIX-SYNC-08: the committed resume boundary (authoritative-sync.md:53). The owner lifts a
// paused room back to Running at the frozen head once the declared ready count is reached;
// below it the store refuses the resume. One receipt transaction — a retry replays the same
// transition, never a second flip.
message ResumeRoundRequest {
  string room_id = 1;
  string owner_instance_id = 2;
  int64 epoch = 3;
  string game_id = 4;
  string operation_id = 5;
  int64 tick = 6;
  int64 state_version = 7;
}

message GameParticipantProto {
  string binding_id = 1;
  string participant_id = 2;
  string faction = 3;
}

message PrepareRoomRequest {
  string room_id = 1;
  string game_id = 2;
  string owner_instance_id = 3;
  int64 epoch = 4;
  string operation_id = 5;
  // The example module start configuration: everything the initial state derives from.
  int64 duration_ticks = 6;
  int64 random_seed = 7;
  int32 fail_after_tick = 8;
  int32 tick_ms = 9;
  repeated GameParticipantProto participants = 10;
  // FIX-TAKE-07 test seam: when set, this prepare's actor freezes deterministically at
  // this tick for hang_ms while the process keeps reporting — the frozen-Running signal
  // the stall governor acts on. Recovery never carries the seam: the actor a takeover
  // builds resumes from the pinned head without hanging.
  int32 hang_after_tick = 11;
  int32 hang_ms = 12;
  // FIX-PERF-03 synchronized start: the room is prepared and held — round Preparing,
  // actor not ticking — until ActivateRoom releases it, so a fleet can cross one
  // common start line instead of staggering by prepare order.
  bool deferred_activation = 13;
  // FIX-MODULE-02: the package this room runs — the same hash StartRound pinned on the
  // room row. Empty = the cluster's default package. A hash the game host does not ship
  // is refused by name (FailedPrecondition); the host never falls back to the default
  // example module for a room that named another package.
  string package_hash = 14;
}

message ActivateRoomRequest {
  string room_id = 1;
  string game_id = 2;
  string owner_instance_id = 3;
  int64 epoch = 4;
  string operation_id = 5;
}

message ActivateRoomReply {
  string room_id = 1;
  bool duplicate = 2;
  string status = 3;
}

message PrepareRoomReply {
  string room_id = 1;
  bool duplicate = 2;
  string status = 3;
  int64 state_version = 4;
  int64 tick = 5;
}

// The recovery identity contract (FIX-MODULE-01): the room's identity is a persisted fact,
// never a caller opinion. A recovery is refused — recovered=false with a named note — when
// the request restates a tick different from the room's persisted cadence, or when the
// room's package, module version or checkpoint mode is one this host cannot load. A
// recovery never changes the original round's tick, config or module.
message RecoverRoomRequest {
  string room_id = 1;
  string game_id = 2;
  string owner_instance_id = 3;
  int64 epoch = 4;
  // The tick cadence the caller expects the room to run at; 0 means "use the room's
  // persisted cadence". A positive value that disagrees with the persisted cadence is
  // refused, so a takeover or admin retry cannot silently change the room's tick.
  int32 tick_ms = 5;
  // FIX-REC-01 deferred recovery (architecture 10.3 route barrier): the recovery pins the
  // verified head, builds the actor and holds it — Recovered=true, Status="Ready" — while
  // the ownership stays Recovering and nothing ticks. The control plane installs the
  // gateways' routes, confirms the barrier, and only then calls ActivateRoom, whose fenced
  // confirm flips the ownership Active and releases the loop. A retry after a lost reply
  // answers the same Ready from the held actor's own state.
  bool deferred_activation = 6;
}

message RecoverRoomReply {
  string room_id = 1;
  bool recovered = 2;
  // The outcome, named for the contract: a tick mismatch names the persisted cadence, a
  // missing package names the unknown package, an incompatible module names the version or
  // checkpoint mode the room was persisted under.
  string note = 3;
  string status = 4;
  int64 last_tick = 5;
  int64 snapshot_tick = 6;
  // Recovery follows the package's mode (FIX-MODULE-03): a DeterministicReplay room
  // replays frames from its newest consistent snapshot (replayed_frames > 0), while a
  // FullCheckpoint room restored the head checkpoint directly and never replays
  // (replayed_frames = 0) — its non-determinism makes replay impossible by construction.
  int32 replayed_frames = 7;
}

message ReadCommittedScoreEffectRequest {
  string tenant_id = 1;
  string game_id = 2;
  string effect_id = 3;
}

message CommittedScoreEffectReply {
  bool found = 1;
  string kind = 2;
  // The committed payload verbatim (the business module derives the subject and delta from
  // its declared score-effect shape); empty when not found.
  string payload_json = 3;
  // The effect's immutable source time (ISO-8601 UTC, captured once when the effect was
  // committed) — the period attribution anchor (FIX-RANK-07). A replayed or delayed
  // delivery answers the same source time every time, so a late effect is attributed to the
  // period of its source, never to the period of its projection or retry; empty when not found.
  string committed_at = 4;
}

message ApplyScoreEffectRequest {
  string tenant_id = 1;
  string game_id = 2;
  string effect_id = 3;
  BoardDefinitionProto board = 4;
  string subject_id = 5;
  int64 delta = 6;
}

message ApplyScoreEffectReply {
  int64 score = 1;
  bool duplicate = 2;
}
