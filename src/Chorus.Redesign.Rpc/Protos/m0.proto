syntax = "proto3";

package chorus.redesign.m0;
option csharp_namespace = "Chorus.Redesign.Rpc";

message Empty {}
message ReadyReply { bool ready = 1; string schema_version = 2; string reason = 3; }

message OperationKey {
  string tenant_id = 1;
  string game_id = 2;
  string operation_kind = 3;
  string target_id = 4;
  string operation_id = 5;
  int32 canonical_version = 6;
  string request_hash_hex = 7;
}
message ReceiptReply { bool found = 1; bool duplicate = 2; string result_json = 3; }
message ProfileRequest { string tenant_id = 1; string game_id = 2; string player_id = 3; }
message ProfileReply { bool found = 1; int64 version = 2; int32 schema_version = 3; string data_json = 4; bool duplicate = 5; }
message PatchProfileRequest {
  OperationKey key = 1;
  int64 expected_version = 2;
  int32 schema_version = 3;
  string data_json = 4;
}
message AssetRequest { string tenant_id = 1; string game_id = 2; string player_id = 3; string asset_id = 4; }
message AssetReply { int64 balance = 1; int64 version = 2; bool duplicate = 3; }
message ChangeAssetRequest { OperationKey key = 1; string asset_id = 2; int64 delta = 3; string reason = 4; }
message FencedProbeRequest {
  OperationKey key = 1;
  string owner_kind = 2;
  string entity_id = 3;
  string owner_instance_id = 4;
  int64 epoch = 5;
  string effect_id = 6;
}
message FencedProbeReply { bool duplicate = 1; string effect_id = 2; }

service DataService {
  rpc Ready(Empty) returns (ReadyReply);
  rpc GetOperation(OperationKey) returns (ReceiptReply);
  rpc GetProfile(ProfileRequest) returns (ProfileReply);
  rpc PatchProfile(PatchProfileRequest) returns (ProfileReply);
  rpc GetAsset(AssetRequest) returns (AssetReply);
  rpc ChangeAsset(ChangeAssetRequest) returns (AssetReply);
  rpc CommitFencedProbe(FencedProbeRequest) returns (FencedProbeReply);
}

message RegisterNodeRequest { string node_id = 1; string agent_instance_id = 2; string capabilities_json = 3; }
message NodeReply { bool accepted = 1; string agent_instance_id = 2; int64 report_sequence = 3; }
message ReportProcessRequest {
  string node_id = 1;
  string agent_instance_id = 2;
  string slot_id = 3;
  string process_instance_id = 4;
  int64 report_sequence = 5;
  string lifecycle = 6;
  string readiness = 7;
  string health = 8;
  string admission = 9;
  string entity_recovery = 10;
  int64 started_unix_ms = 11;
  string role = 12;
}
message ProcessReply { bool accepted = 1; string readiness = 2; string entity_recovery = 3; }
message OwnershipRequest {
  string kind = 1;
  string entity_id = 2;
  string owner_instance_id = 3;
  int32 lease_seconds = 4;
  string tenant_id = 5;
  string game_id = 6;
}
message OwnershipLookup { string kind = 1; string entity_id = 2; string tenant_id = 3; string game_id = 4; }
message OwnershipReply {
  bool found = 1;
  string owner_instance_id = 2;
  int64 epoch = 3;
  int64 lease_until_unix_ms = 4;
  string status = 5;
}

service ControlService {
  rpc Ready(Empty) returns (ReadyReply);
  rpc RegisterNode(RegisterNodeRequest) returns (NodeReply);
  rpc ReportProcess(ReportProcessRequest) returns (ProcessReply);
  rpc ClaimOwnership(OwnershipRequest) returns (OwnershipReply);
  rpc GetOwnership(OwnershipLookup) returns (OwnershipReply);
}
