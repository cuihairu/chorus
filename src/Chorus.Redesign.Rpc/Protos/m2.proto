syntax = "proto3";

package chorus.redesign.m2;
option csharp_namespace = "Chorus.Redesign.Rpc";

import "Protos/m0.proto";

// Round admission and routing boundaries (architecture 6.2, 6.3). The tenant and the caller
// role come from the client certificate; every mutating call is one store transaction, so a
// reply always reflects a committed state.

message RoundParticipantProto {
  string binding_id = 1;
  string participant_id = 2;
  string role = 3;
}

message StartRoundRequest {
  string room_id = 1;
  string owner_instance_id = 2;
  int64 epoch = 3;
  string game_id = 4;
  string module_version = 5;
  string config_hash = 6;
  string package_hash = 7;
  string operation_id = 8;
  repeated RoundParticipantProto participants = 9;
}

message AbortRoundRequest {
  string room_id = 1;
  string owner_instance_id = 2;
  int64 epoch = 3;
  string game_id = 4;
  string reason = 5;
  string operation_id = 6;
}

message RoundAdmissionReply {
  string room_id = 1;
  int64 round_generation = 2;
  string status = 3;
  int64 epoch = 4;
  bool duplicate = 5;
}

message GetRoundRequest { string room_id = 1; string game_id = 2; }

message RoundParticipantStateProto {
  string participant_id = 1;
  string binding_id = 2;
  string role = 3;
  string state = 4;
}

message RoundStatusReply {
  bool found = 1;
  string room_id = 2;
  string status = 3;
  int64 epoch = 4;
  int64 last_tick = 5;
  int64 state_version = 6;
  repeated RoundParticipantStateProto participants = 7;
}

message RouteEventsRequest {
  string platform = 1;
  string app_id = 2;
  string operation_id = 3;
  int32 max_events = 4;
}

message RoutedEventProto {
  string event_id = 1;
  string room_id = 2;
  int64 sequence = 3;
  string disposition = 4;
}

message RouteEventsReply {
  bool duplicate = 1;
  repeated RoutedEventProto events = 2;
}

message ClientInputRequest {
  string session_id = 1;
  string room_id = 2;
  int64 room_epoch = 3;
  string game_id = 4;
  string command_id = 5;
  string payload_json = 6;
}

message ClientInputReply {
  string command_id = 1;
  string room_id = 2;
  int64 sequence = 3;
  int64 route_version = 4;
  bool duplicate = 5;
}

// One authoritative tick commit (architecture 8.2). The owner states the tick and state
// version it derived the candidate from; the store validates the fence, the prev frame and
// every input ref before anything is consumed.
message FrameEffectProto {
  string kind = 1;
  string payload_json = 2;
}

message PlannedGrantProto {
  string player_id = 1;
  string grant_key = 2;
  string operation_id = 3;
}

message CommitFrameRequest {
  string room_id = 1;
  string game_id = 2;
  string owner_instance_id = 3;
  int64 epoch = 4;
  string commit_id = 5;
  int64 prev_tick = 6;
  int64 prev_state_version = 7;
  repeated string input_event_ids = 8;
  bytes state_hash = 9;
  repeated FrameEffectProto effects = 10;
  string module_version = 11;
  string config_hash = 12;
  // FullCheckpoint mode: the candidate state joins the frame transaction (8.2); absent
  // fields mean a regular deterministic tick.
  bytes snapshot_payload = 13;
  bytes snapshot_hash = 14;
  int32 snapshot_schema_version = 15;
  bool final = 16;
  string result_json = 17;
  bytes plan_hash = 18;
  repeated PlannedGrantProto grants = 19;
}

message FrameReceiptReply {
  string commit_id = 1;
  string room_id = 2;
  int64 tick = 3;
  int64 state_version = 4;
  int64 watermark = 5;
  bool duplicate = 6;
}

message ReadInboxRequest {
  string room_id = 1;
  string game_id = 2;
  int32 max_events = 3;
}

message InboxItemProto {
  string event_id = 1;
  int64 sequence = 2;
  int64 route_version = 3;
  string binding_id = 4;
  string payload_json = 5;
}

message ReadInboxReply {
  int64 watermark = 1;
  repeated InboxItemProto items = 2;
}

service RoundStore {
  rpc Ready(chorus.redesign.m0.Empty) returns (chorus.redesign.m0.ReadyReply);
  rpc StartRound(StartRoundRequest) returns (RoundAdmissionReply);
  rpc AbortRound(AbortRoundRequest) returns (RoundAdmissionReply);
  rpc GetRound(GetRoundRequest) returns (RoundStatusReply);
  // Room lifecycle after admission (architecture 7.2): the owner deposits the tick-0
  // snapshot while the room is Preparing, activation flips it to Running at state
  // version 1, and a suspension parks a damaged round visibly instead of killing it.
  rpc PrepareRound(PrepareRoundRequest) returns (RoundAdmissionReply);
  rpc ActivateRound(ActivateRoundRequest) returns (RoundAdmissionReply);
  rpc SuspendRound(SuspendRoundRequest) returns (RoundAdmissionReply);
}

service RoundInput {
  rpc Ready(chorus.redesign.m0.Empty) returns (chorus.redesign.m0.ReadyReply);
  rpc RouteEvents(RouteEventsRequest) returns (RouteEventsReply);
  rpc AcceptClientInput(ClientInputRequest) returns (ClientInputReply);
}

// Authoritative frame commits and round inbox reads (architecture 8.2, 6.1.6). Only the
// room owner commits; reads belong to the owner and the control plane for diagnostics.
service FrameStore {
  rpc Ready(chorus.redesign.m0.Empty) returns (chorus.redesign.m0.ReadyReply);
  rpc CommitFrame(CommitFrameRequest) returns (FrameReceiptReply);
  rpc ReadInbox(ReadInboxRequest) returns (ReadInboxReply);
}

// Room preparation on the game host (architecture 7.2). The control plane names the
// admitted room and its module configuration; the host derives the deterministic initial
// state, deposits the tick-0 snapshot, activates the round and starts the room actor.
service GameHost {
  rpc Ready(chorus.redesign.m0.Empty) returns (chorus.redesign.m0.ReadyReply);
  rpc PrepareRoom(PrepareRoomRequest) returns (PrepareRoomReply);
  // Snapshot recovery lands in M2-4; until then the call fails visibly instead of lying.
  rpc RecoverRoom(RecoverRoomRequest) returns (RecoverRoomReply);
}

message PrepareRoundRequest {
  string room_id = 1;
  string owner_instance_id = 2;
  int64 epoch = 3;
  string game_id = 4;
  // The serialized tick-0 state and its hash become the room's first snapshot; the
  // schema version is the module's own and gates Restore.
  bytes snapshot_payload = 5;
  bytes snapshot_hash = 6;
  int32 snapshot_schema_version = 7;
  string operation_id = 8;
}

message ActivateRoundRequest {
  string room_id = 1;
  string owner_instance_id = 2;
  int64 epoch = 3;
  string game_id = 4;
  string operation_id = 5;
}

message SuspendRoundRequest {
  string room_id = 1;
  string owner_instance_id = 2;
  int64 epoch = 3;
  string game_id = 4;
  string reason = 5;
  string operation_id = 6;
}

message GameParticipantProto {
  string binding_id = 1;
  string participant_id = 2;
  string faction = 3;
}

message PrepareRoomRequest {
  string room_id = 1;
  string game_id = 2;
  string owner_instance_id = 3;
  int64 epoch = 4;
  string operation_id = 5;
  // The example module start configuration: everything the initial state derives from.
  int64 duration_ticks = 6;
  int64 random_seed = 7;
  int32 fail_after_tick = 8;
  int32 tick_ms = 9;
  repeated GameParticipantProto participants = 10;
}

message PrepareRoomReply {
  string room_id = 1;
  bool duplicate = 2;
  string status = 3;
  int64 state_version = 4;
  int64 tick = 5;
}

message RecoverRoomRequest {
  string room_id = 1;
  string game_id = 2;
}

message RecoverRoomReply {
  string room_id = 1;
  bool recovered = 2;
  string note = 3;
}
