syntax = "proto3";

package chorus.redesign.m4;
option csharp_namespace = "Chorus.Redesign.Rpc";

import "Protos/m0.proto";

// The streamer gateway edge (contracts 3). The public WSS face speaks the client protocol;
// this internal face is what the rest of the cluster sees: readiness for supervisors and
// routing consumers, and the session-replaced notice a StreamerServer pushes when a login
// takes over a session still held by a connection on this gateway (contracts 3.3).

service StreamerGatewayFace {
  rpc Ready(chorus.redesign.m0.Empty) returns (chorus.redesign.m0.ReadyReply);
  rpc NotifySessionReplaced(SessionReplacedNotice) returns (SessionReplacedReply);
}

// The takeover notice carries the generation the displaced connection was attached at, so the
// old gateway closes exactly that connection and reports the close with the old generation —
// a newer connection on the same session elsewhere is never marked offline by it.
message SessionReplacedNotice {
  string session_id = 1;
  string connection_id = 2;
  int64 connection_generation = 3;
  string streamer_id = 4;
  string reason = 5;
}

message SessionReplacedReply { bool delivered = 1; }
