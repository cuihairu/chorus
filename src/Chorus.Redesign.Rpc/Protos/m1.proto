syntax = "proto3";

package chorus.redesign.m1;
option csharp_namespace = "Chorus.Redesign.Rpc";

import "Protos/m0.proto";

message LoginRequest {
  string platform = 1;
  string app_id = 2;
  string launch_credential = 3;
  string login_attempt_id = 4;
  bytes next_resume_secret = 5;
  string gateway_instance_id = 6;
  string connection_id = 7;
}

message ResumeRequest {
  string previous_session_id = 1;
  string resume_operation_id = 2;
  bytes previous_secret = 3;
  bytes next_secret = 4;
  string gateway_instance_id = 5;
  string connection_id = 6;
}

message LoginReadyReply {
  string streamer_id = 1;
  string session_id = 2;
  int64 session_version = 3;
  string access_credential = 4;
  int64 access_expires_at_unix_ms = 5;
  bool duplicate = 6;
}

message ResolveIdentityRequest {
  string tenant_id = 1;
  string platform = 2;
  string app_id = 3;
  string open_id = 4;
}

message ResolvedIdentityReply { string streamer_id = 1; }

message SessionLoginRequest {
  string tenant_id = 1;
  string streamer_id = 2;
  bytes next_resume_secret = 3;
  string gateway_instance_id = 4;
  string connection_id = 5;
}

message SessionResumeRequest {
  string tenant_id = 1;
  string previous_session_id = 2;
  bytes previous_secret = 3;
  bytes next_secret = 4;
  string gateway_instance_id = 5;
  string connection_id = 6;
  string resume_operation_id = 7;
}

message EnsureProfileRequest {
  string tenant_id = 1;
  string game_id = 2;
  string streamer_id = 3;
}

message EnsureProfileReply { bool found = 1; int64 version = 2; }

message SessionGrantReply {
  string streamer_id = 1;
  string session_id = 2;
  int64 session_version = 3;
  int64 expires_at_unix_ms = 4;
  bool duplicate = 5;
}

// StreamerServer session boundary; the caller presents a tenant-scoped streamer-server
// identity and the tenant is taken from the authenticated certificate, not the request.
service StreamerSession {
  rpc Ready(chorus.redesign.m0.Empty) returns (chorus.redesign.m0.ReadyReply);
  rpc Login(LoginRequest) returns (LoginReadyReply);
  rpc Resume(ResumeRequest) returns (LoginReadyReply);
}

// Identity and session persistence owned by DataServer; StreamerServer orchestrates
// launch verification and entity loading around these transactional methods. The
// tenant travels in the request and is verified against the auth.identity mapping.
service StreamerIdentity {
  rpc Ready(chorus.redesign.m0.Empty) returns (chorus.redesign.m0.ReadyReply);
  rpc ResolveIdentity(ResolveIdentityRequest) returns (ResolvedIdentityReply);
  rpc Login(SessionLoginRequest) returns (SessionGrantReply);
  rpc Resume(SessionResumeRequest) returns (SessionGrantReply);
  rpc EnsureEntityProfile(EnsureProfileRequest) returns (EnsureProfileReply);
}
