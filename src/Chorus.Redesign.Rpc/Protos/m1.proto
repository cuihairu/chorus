syntax = "proto3";

package chorus.redesign.m1;
option csharp_namespace = "Chorus.Redesign.Rpc";

import "Protos/m0.proto";

message LoginRequest {
  string platform = 1;
  string app_id = 2;
  string launch_credential = 3;
  string login_attempt_id = 4;
  bytes next_resume_secret = 5;
  string gateway_instance_id = 6;
  string connection_id = 7;
}

message ResumeRequest {
  string previous_session_id = 1;
  string resume_operation_id = 2;
  bytes previous_secret = 3;
  bytes next_secret = 4;
  string gateway_instance_id = 5;
  string connection_id = 6;
}

message LoginReadyReply {
  string streamer_id = 1;
  string session_id = 2;
  int64 session_version = 3;
  string access_credential = 4;
  int64 access_expires_at_unix_ms = 5;
  bool duplicate = 6;
}

message ResolveIdentityRequest {
  string tenant_id = 1;
  string platform = 2;
  string app_id = 3;
  string open_id = 4;
}

message ResolvedIdentityReply { string streamer_id = 1; }

message SessionLoginRequest {
  string tenant_id = 1;
  string streamer_id = 2;
  bytes next_resume_secret = 3;
  string gateway_instance_id = 4;
  string connection_id = 5;
}

message SessionResumeRequest {
  string tenant_id = 1;
  string previous_session_id = 2;
  bytes previous_secret = 3;
  bytes next_secret = 4;
  string gateway_instance_id = 5;
  string connection_id = 6;
  string resume_operation_id = 7;
}

message EnsureProfileRequest {
  string tenant_id = 1;
  string game_id = 2;
  string streamer_id = 3;
}

message EnsureProfileReply { bool found = 1; int64 version = 2; }

message SessionGrantReply {
  string streamer_id = 1;
  string session_id = 2;
  int64 session_version = 3;
  int64 expires_at_unix_ms = 4;
  bool duplicate = 5;
}

message AttachConnectionRequest {
  string session_id = 1;
  string operation_id = 2;
  bytes current_secret = 3;
  string gateway_instance_id = 4;
  string connection_id = 5;
}

message ConnectionClosedRequest {
  string session_id = 1;
  string gateway_instance_id = 2;
  string connection_id = 3;
  int64 connection_generation = 4;
}

message ConnectionReply {
  string session_id = 1;
  string streamer_id = 2;
  int64 session_version = 3;
  int64 connection_generation = 4;
  bool duplicate = 5;
}

message ConnectionClosedReply { bool applied = 1; }

message ValidateAccessRequest { string access_credential = 1; }

message AccessStateReply {
  string streamer_id = 1;
  string session_id = 2;
  int64 session_version = 3;
  int64 connection_generation = 4;
  string gateway_instance_id = 5;
  string connection_id = 6;
  bool online = 7;
}

message StartGameplayRequest {
  string access_credential = 1;
  string game_id = 2;
  string operation_id = 3;
}

message GameplayStatusRequest { string access_credential = 1; }

message GameplayStatusReply {
  string live_session_id = 1;
  string binding_id = 2;
  string game_id = 3;
  int64 generation = 4;
  string state = 5;
  bool duplicate = 6;
}

message SessionAttachRequest {
  string tenant_id = 1;
  string session_id = 2;
  string operation_id = 3;
  bytes current_secret = 4;
  string gateway_instance_id = 5;
  string connection_id = 6;
}

message SessionCloseRequest {
  string tenant_id = 1;
  string session_id = 2;
  string gateway_instance_id = 3;
  string connection_id = 4;
  int64 connection_generation = 5;
}

message SessionConnectionReply {
  string session_id = 1;
  string streamer_id = 2;
  int64 session_version = 3;
  int64 connection_generation = 4;
  bool duplicate = 5;
}

message SessionCloseReply { bool applied = 1; }

message SessionStateRequest {
  string tenant_id = 1;
  string session_id = 2;
}

message SessionStateReply {
  string streamer_id = 1;
  string tenant_id = 2;
  int64 session_version = 3;
  int64 expires_at_unix_ms = 4;
  string gateway_instance_id = 5;
  string connection_id = 6;
  int64 connection_generation = 7;
  bool revoked = 8;
  bool closed = 9;
  bool expired = 10;
  bool banned = 11;
  bool current = 12;
}

message OpenLiveRequest {
  string tenant_id = 1;
  string streamer_id = 2;
  string platform = 3;
  string app_id = 4;
  string platform_room_key = 5;
  string canonical_live_session_key = 6;
}

message OpenLiveReply { string live_session_id = 1; }

message BindingStartRequest {
  string tenant_id = 1;
  string live_session_id = 2;
  string session_id = 3;
  string game_id = 4;
  string operation_id = 5;
}

message BindingStartReply {
  string binding_id = 1;
  string live_session_id = 2;
  string game_id = 3;
  int64 generation = 4;
  string state = 5;
  bool duplicate = 6;
}

message BindingStatusRequest {
  string tenant_id = 1;
  string streamer_id = 2;
}

message BindingStatusReply {
  string live_session_id = 1;
  string binding_id = 2;
  string game_id = 3;
  int64 generation = 4;
  string state = 5;
}

message LiveSessionRequest {
  string tenant_id = 1;
  string streamer_id = 2;
}

message LiveSessionReply { string live_session_id = 1; }

message IngestEvent {
  string source_dedup_key = 1;
  string durability = 2; // Durable | BestEffort
  string canonical_room_key = 3;
  string payload_json = 4;
}

message IngestBatchRequest {
  string platform = 1;
  string app_id = 2;
  string operation_id = 3;
  repeated IngestEvent events = 4;
}

message EventReceipt {
  string source_dedup_key = 1;
  bool duplicate = 2;
  string disposition = 3;
  string binding_id = 4;
  int64 binding_generation = 5;
}

message IngestBatchReply {
  bool duplicate = 1;
  repeated EventReceipt receipts = 2;
}

message PendingInboxRequest { string platform = 1; }

message PendingInboxEvent {
  string source_dedup_key = 1;
  string canonical_room_key = 2;
  string payload_json = 3;
  int64 received_at_unix_ms = 4;
}

message PendingInboxReply { repeated PendingInboxEvent events = 1; }

message ReconcileInboxRequest {
  string platform = 1;
  string canonical_room_key = 2;
}

message ReconcileInboxReply { int32 attributed = 1; }

message TaskEnqueueRequest {
  string binding_id = 1;
  string operation_id = 2;
  string desired_json = 3;
}

message TaskLeaseRequest {
  string task_id = 1;
  string owner_instance_id = 2;
  int64 lease_seconds = 3;
}

message TaskAttemptRequest {
  string task_id = 1;
  string owner_instance_id = 2;
  int64 deadline_seconds = 3;
}

message TaskCompleteRequest {
  string task_id = 1;
  string owner_instance_id = 2;
  string observed_json = 3;
}

message TaskErrorRequest {
  string task_id = 1;
  string owner_instance_id = 2;
  string last_error = 3;
}

message TaskRetryRequest {
  string task_id = 1;
  string owner_instance_id = 2;
  string last_error = 3;
  int64 next_attempt_unix_ms = 4;
}

message TaskStopRequest {
  string task_id = 1;
  string last_error = 2;
}

message TaskResolveRequest {
  string task_id = 1;
  string owner_instance_id = 2;
  bool executed_by_platform = 3;
  string observed_json = 4;
}

message TaskGetRequest { string task_id = 1; }

// Executor discovery: due work (Pending/Retryable past its next attempt, OutcomeUnknown) plus
// tasks left Executing by a holder whose lease expired — the reassignment candidates.
message TaskListRequest { int32 max = 1; }

message TaskListReply { repeated TaskStateReply tasks = 1; }

message TaskStateReply {
  string task_id = 1;
  string binding_id = 2;
  int64 binding_generation = 3;
  int64 task_epoch = 4;
  string operation_id = 5;
  string status = 6;
  int32 attempt_count = 7;
  string desired_json = 8;
  string observed_json = 9;
  string last_error = 10;
  int64 next_attempt_unix_ms = 11;
  string lease_owner = 12;
  int64 lease_until_unix_ms = 13;
  string attempt_owner = 14;
  int64 attempt_deadline_unix_ms = 15;
  bool duplicate = 16;
}

// StreamerServer session boundary; the caller presents a tenant-scoped streamer-server
// identity and the tenant is taken from the authenticated certificate, not the request.
service StreamerSession {
  rpc Ready(chorus.redesign.m0.Empty) returns (chorus.redesign.m0.ReadyReply);
  rpc Login(LoginRequest) returns (LoginReadyReply);
  rpc Resume(ResumeRequest) returns (LoginReadyReply);
  rpc AttachConnection(AttachConnectionRequest) returns (ConnectionReply);
  rpc ConnectionClosed(ConnectionClosedRequest) returns (ConnectionClosedReply);
  rpc ValidateAccess(ValidateAccessRequest) returns (AccessStateReply);
  rpc StartGameplay(StartGameplayRequest) returns (GameplayStatusReply);
  rpc GameplayStatus(GameplayStatusRequest) returns (GameplayStatusReply);
}

// Identity and session persistence owned by DataServer; StreamerServer orchestrates
// launch verification and entity loading around these transactional methods. The
// tenant travels in the request and is verified against the auth.identity mapping.
service StreamerIdentity {
  rpc Ready(chorus.redesign.m0.Empty) returns (chorus.redesign.m0.ReadyReply);
  rpc ResolveIdentity(ResolveIdentityRequest) returns (ResolvedIdentityReply);
  rpc Login(SessionLoginRequest) returns (SessionGrantReply);
  rpc Resume(SessionResumeRequest) returns (SessionGrantReply);
  rpc EnsureEntityProfile(EnsureProfileRequest) returns (EnsureProfileReply);
  rpc AttachConnection(SessionAttachRequest) returns (SessionConnectionReply);
  rpc ConnectionClosed(SessionCloseRequest) returns (SessionCloseReply);
  rpc GetSessionState(SessionStateRequest) returns (SessionStateReply);
  rpc OpenLiveSession(OpenLiveRequest) returns (OpenLiveReply);
  rpc StartGameplayBinding(BindingStartRequest) returns (BindingStartReply);
  rpc GetBindingStatus(BindingStatusRequest) returns (BindingStatusReply);
  rpc GetLiveSession(LiveSessionRequest) returns (LiveSessionReply);
}

// Durable platform event intake owned by DataServer (architecture 6.1). The caller is the
// platform gateway after signature verification; a reply is only produced once the batch,
// its dedup keys and the batch operation receipt are committed in one transaction.
service PlatformIngest {
  rpc Ready(chorus.redesign.m0.Empty) returns (chorus.redesign.m0.ReadyReply);
  rpc IngestBatch(IngestBatchRequest) returns (IngestBatchReply);
  rpc GetPendingInbox(PendingInboxRequest) returns (PendingInboxReply);
  rpc ReconcileInbox(ReconcileInboxRequest) returns (ReconcileInboxReply);
}

// External platform task coordination owned by DataServer (architecture 6.3). The control
// plane records desired state and may reassign the lease; executors only run tasks whose
// lease they hold, write their call to the outbox before issuing it, and never blindly retry
// an outcome they could not observe.
service PlatformTask {
  rpc Ready(chorus.redesign.m0.Empty) returns (chorus.redesign.m0.ReadyReply);
  rpc EnqueueDesired(TaskEnqueueRequest) returns (TaskStateReply);
  rpc AcquireLease(TaskLeaseRequest) returns (TaskStateReply);
  rpc BeginAttempt(TaskAttemptRequest) returns (TaskStateReply);
  rpc CompleteAttempt(TaskCompleteRequest) returns (TaskStateReply);
  rpc MarkOutcomeUnknown(TaskErrorRequest) returns (TaskStateReply);
  rpc MarkRetryFailed(TaskRetryRequest) returns (TaskStateReply);
  rpc MarkNeedsAttention(TaskStopRequest) returns (TaskStateReply);
  rpc ResolveOutcome(TaskResolveRequest) returns (TaskStateReply);
  rpc GetTask(TaskGetRequest) returns (TaskStateReply);
  rpc ListReadyTasks(TaskListRequest) returns (TaskListReply);
}
