syntax = "proto3";

package chorus.redesign.m3;
option csharp_namespace = "Chorus.Redesign.Rpc";

import "Protos/m0.proto";

// Multi-node matching and business recovery (architecture 7.1-7.3, 10.1). A mount holds at
// most one active ticket; cancellation races the reservation transaction on the same locked
// ticket rows, so whoever locks first wins visibly. A match partition moves between
// coordinator holders through monotonically increasing terms — an expired term never commits.

message EnqueueTicketRequest {
  string tenant_id = 1;
  string game_id = 2;
  string binding_id = 3;
  string session_id = 4;
  // The composite match partition (tenant/game/rules version/region/platform policy/queue
  // type): candidates only ever meet inside one partition, so a wrong-platform candidate
  // never shares a window with the right one.
  string partition_key = 5;
  string operation_id = 6;
  // 0 = the queued ticket never expires on its own.
  int64 expires_unix_ms = 7;
}

message CancelTicketRequest {
  string tenant_id = 1;
  string game_id = 2;
  string binding_id = 3;
  string operation_id = 4;
}

message GetTicketRequest {
  string tenant_id = 1;
  string game_id = 2;
  string binding_id = 3;
}

message TicketProto {
  string ticket_id = 1;
  string binding_id = 2;
  string state = 3;
  int64 version = 4;
  string partition_key = 5;
  // 0 = the ticket has no expiry of its own.
  int64 expires_unix_ms = 6;
  string reservation_id = 7;
  // The streamer behind the mount: the coordinator's window is self-describing.
  string streamer_id = 8;
  // The scope the ticket lives in — a coordinator pairs candidates and drives rounds for it.
  string tenant_id = 9;
  string game_id = 10;
}

message TicketReply {
  bool found = 1;
  bool duplicate = 2;
  TicketProto ticket = 3;
}

message ListQueuedRequest {
  string partition_key = 1;
  int32 max = 2;
}

message ListQueuedReply { repeated TicketProto tickets = 1; }

message ExpireQueuedRequest { int32 max = 1; }

message ExpireQueuedReply { int64 expired = 1; }

// The partitions with live candidates — the coordinator's discovery scan.
message ListPartitionsReply { repeated string partition_keys = 1; }

service MatchQueue {
  rpc Ready(chorus.redesign.m0.Empty) returns (chorus.redesign.m0.ReadyReply);
  rpc EnqueueTicket(EnqueueTicketRequest) returns (TicketReply);
  rpc CancelTicket(CancelTicketRequest) returns (TicketReply);
  rpc GetTicket(GetTicketRequest) returns (TicketReply);
  // The coordinator's candidate window and the sweep that retires stale queued tickets.
  rpc ListQueued(ListQueuedRequest) returns (ListQueuedReply);
  rpc ExpireQueued(ExpireQueuedRequest) returns (ExpireQueuedReply);
  // The partitions a coordinator can hold terms for.
  rpc ListPartitions(chorus.redesign.m0.Empty) returns (ListPartitionsReply);
}

// Match coordinator terms (architecture 7.1, 10.1). One holder per partition; a takeover or
// an expired re-claim starts a new term, and writes carrying an old term are refused.
message TermRequest {
  string partition_key = 1;
  string holder_instance_id = 2;
  int32 lease_seconds = 3;
}

message GetTermRequest { string partition_key = 1; }

message TermReply {
  bool found = 1;
  string holder_instance_id = 2;
  int64 term = 3;
  int64 lease_until_unix_ms = 4;
}

service Coordinator {
  rpc Ready(chorus.redesign.m0.Empty) returns (chorus.redesign.m0.ReadyReply);
  // Acquire-or-takeover: bumps the term unless the same holder re-claims a live lease.
  rpc ClaimTerm(TermRequest) returns (TermReply);
  // Extends the lease of the current holder only; a lost lease is a visible failure.
  rpc RenewTerm(TermRequest) returns (TermReply);
  // Parks the lease in the past so the next claim starts a new term.
  rpc ReleaseTerm(TermRequest) returns (TermReply);
  rpc GetTerm(GetTermRequest) returns (TermReply);
}

// Match reservations (architecture 7.2, 10.1). The coordinator reserves the whole candidate
// set under its term in one receipt transaction; the reservation holds admission capacity
// until it commits or an expiry sweep retires it — tickets return to the queue, a started
// room is aborted and the ownership released, so capacity never leaks (AT11).
message ReservedParticipantProto {
  string binding_id = 1;
  string participant_id = 2;
  string role = 3;
}

message ReserveMatchRequest {
  string tenant_id = 1;
  string game_id = 2;
  string partition_key = 3;
  int64 coordinator_term = 4;
  string holder_instance_id = 5;
  string room_id = 6;
  repeated ReservedParticipantProto participants = 7;
  int32 reservation_seconds = 8;
  string operation_id = 9;
}

message RenewReservationRequest {
  string tenant_id = 1;
  string game_id = 2;
  string reservation_id = 3;
  int64 coordinator_term = 4;
  string holder_instance_id = 5;
  int32 reservation_seconds = 6;
  string operation_id = 7;
}

message MarkPreparedRequest {
  string tenant_id = 1;
  string game_id = 2;
  string reservation_id = 3;
  int64 coordinator_term = 4;
  string holder_instance_id = 5;
  // The host's prepare receipt (tick-0 state evidence) stored for a successor coordinator.
  string prepared_receipt_json = 6;
  string operation_id = 7;
}

message GetReservationRequest {
  string tenant_id = 1;
  string game_id = 2;
  string reservation_id = 3;
}

message CommitMatchRequest {
  string tenant_id = 1;
  string game_id = 2;
  string reservation_id = 3;
  int64 coordinator_term = 4;
  string holder_instance_id = 5;
  // The room owner the coordinator prepared on: commit is fenced by this instance and epoch —
  // a write from a displaced room owner never commits (AT25 mechanics).
  string room_instance_id = 6;
  int64 room_epoch = 7;
  string operation_id = 8;
}

message AbortReservationRequest {
  string tenant_id = 1;
  string game_id = 2;
  string reservation_id = 3;
  int64 coordinator_term = 4;
  string holder_instance_id = 5;
  string operation_id = 6;
}

message ReservationProto {
  string reservation_id = 1;
  string room_id = 2;
  string tenant_id = 3;
  string game_id = 4;
  string partition_key = 5;
  int64 coordinator_term = 6;
  int64 expires_unix_ms = 7;
  string status = 8;
  repeated ReservedParticipantProto participants = 9;
  string prepared_receipt_json = 10;
}

message ReservationReply {
  bool found = 1;
  bool duplicate = 2;
  ReservationProto reservation = 3;
}

message ExpireReservationsRequest { int32 max = 1; }

message ExpireReservationsReply { int64 expired = 1; }

message ListActiveReservationsRequest {
  string partition_key = 1;
  int32 max = 2;
}

message ListActiveReservationsReply { repeated ReservationProto reservations = 1; }

service Match {
  rpc Ready(chorus.redesign.m0.Empty) returns (chorus.redesign.m0.ReadyReply);
  // Reserves the candidate set under the coordinator's term. Every participant must hold
  // exactly one queued ticket of the same partition.
  rpc ReserveMatch(ReserveMatchRequest) returns (ReservationReply);
  // Extends a live reservation; an expired one is owned by the sweep and cannot revive.
  rpc RenewReservation(RenewReservationRequest) returns (ReservationReply);
  // Records the prepare receipt once the host derived tick-0 and the room ownership is held.
  rpc MarkPrepared(MarkPreparedRequest) returns (ReservationReply);
  // Commits the match in one transaction: the tickets commit together or not at all, fenced
  // by the coordinator term and the room ownership epoch.
  rpc CommitMatch(CommitMatchRequest) returns (ReservationReply);
  // Cancels the reservation: tickets return to the queue and a started room is released.
  rpc AbortReservation(AbortReservationRequest) returns (ReservationReply);
  rpc GetReservation(GetReservationRequest) returns (ReservationReply);
  // The sweep that retires expired reservations and releases everything they held.
  rpc ExpireReservations(ExpireReservationsRequest) returns (ExpireReservationsReply);
  // The successor coordinator's recovery scan: unretired reservations of one partition.
  rpc ListActiveReservations(ListActiveReservationsRequest) returns (ListActiveReservationsReply);
  // The partitions holding unretired reservations: recovery discovery without queued tickets.
  rpc ListReservationPartitions(chorus.redesign.m0.Empty) returns (ListPartitionsReply);
}

// Routing (architecture 4.4). The control plane publishes a versioned full snapshot — rooms
// with their owner epochs and endpoints, live streamer bindings, registered instances — plus
// an incremental watch. Consumers re-pull the full snapshot when the stream breaks or a
// version arrives out of nowhere; routing never carries secrets, and an expired route is not
// blindly written to. The version is a content hash, not a sequence: any mutation changes it,
// so a missed watch notice shows up as a version mismatch on the next pull.
message RoomRouteProto {
  string room_id = 1;
  string tenant_id = 2;
  string game_id = 3;
  string owner_instance_id = 4;
  int64 epoch = 5;
  // Empty when the owner instance has not reported an endpoint.
  string endpoint = 6;
  string status = 7;
}

message StreamerRouteProto {
  string streamer_id = 1;
  string binding_id = 2;
  // Empty while the mount is not in a room.
  string room_id = 3;
  string state = 4;
  // The streamer-server instance holding the entity (kind 'streamer' ownership); empty while
  // no holder is on record — e.g. a host outside the control plane.
  string owner_instance_id = 5;
  int64 epoch = 6;
}

message InstanceRouteProto {
  string process_instance_id = 1;
  string role = 2;
  string node_id = 3;
  string slot_id = 4;
  // Empty when the process has not reported an endpoint.
  string endpoint = 5;
  string readiness = 6;
  string admission = 7;
}

message RoutingSnapshotReply {
  int64 version = 1;
  repeated RoomRouteProto rooms = 2;
  repeated StreamerRouteProto streamers = 3;
  repeated InstanceRouteProto instances = 4;
}

message WatchRoutingRequest {
  // The version the consumer already holds; the stream opens with a notice when it differs.
  int64 known_version = 1;
}

message RoutingNotice { int64 version = 1; }

service Routing {
  rpc Ready(chorus.redesign.m0.Empty) returns (chorus.redesign.m0.ReadyReply);
  // The versioned full snapshot; re-pull whenever a watch notice, break or gap says so.
  rpc GetRoutingSnapshot(chorus.redesign.m0.Empty) returns (RoutingSnapshotReply);
  // A notice stream: emits the new version whenever the routed content changes. The notice
  // carries no payload — the consumer answers it with a full snapshot pull.
  rpc WatchRouting(WatchRoutingRequest) returns (stream RoutingNotice);
}

// Deployment plans (architecture 10.2). The control plane owns DeploymentSpec; a plan names
// the slot, the desired state and the command identity. The agent applies plans idempotently
// — a re-delivered CommandId must never pull a second process — and the plan generation is
// monotonic, so a stale plan never rewinds history.
message DeploymentPlanProto {
  string slot_id = 1;
  string node_id = 2;
  string role = 3;
  // Running keeps the process supervised and restarted; Draining stops it gracefully;
  // Stopped stops it and keeps it down.
  string desired_state = 4;
  string desired_version = 5;
  string package_hash = 6;
  int64 plan_generation = 7;
  // Empty for plan rows that were never commanded (bootstrap seeds).
  string command_id = 8;
  // 0 = the command has no expiry of its own.
  int64 command_expires_unix_ms = 9;
}

message ApplyPlanRequest {
  string node_id = 1;
  string slot_id = 2;
  string role = 3;
  string desired_state = 4;
  string desired_version = 5;
  string package_hash = 6;
  int64 plan_generation = 7;
  string command_id = 8;
  int64 command_expires_unix_ms = 9;
}

message WatchPlansRequest { string node_id = 1; }

service Deployment {
  rpc Ready(chorus.redesign.m0.Empty) returns (chorus.redesign.m0.ReadyReply);
  // Issues a plan (the M3-9 admin face wraps this with audit; here the control plane speaks).
  rpc ApplyPlan(ApplyPlanRequest) returns (DeploymentPlanProto);
  // The agent's plan stream: emits the node's full plan set whenever it changes, and once
  // on connect — a reconnected agent re-receives its plans and must not re-pull processes.
  rpc WatchPlans(WatchPlansRequest) returns (stream DeploymentPlanProto);
}

// Entity takeover (architecture 10.3): the control plane moves a live entity's authority to a
// new instance after the current holder went silent — the handover fences the old epoch.
service Takeover {
  rpc Ready(chorus.redesign.m0.Empty) returns (chorus.redesign.m0.ReadyReply);
  // The authority handover itself: bumps both epochs, parks the entity Recovering. The reply
  // carries the bumped epoch the new holder must recover with.
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipReply);
  // The recovery completion for a room: confirms the transferred ownership and replays the
  // round on the new instance. Room-only today; other kinds refuse visibly.
  rpc TakeoverRoom(TakeoverRoomRequest) returns (TakeoverRoomReply);
}

message TransferOwnershipRequest {
  string tenant_id = 1;
  string game_id = 2;
  string kind = 3;
  string entity_id = 4;
  string to_instance_id = 5;
  int32 lease_seconds = 6;
}

message TransferOwnershipReply {
  string owner_instance_id = 1;
  int64 epoch = 2;
  string status = 3;
}

message TakeoverRoomRequest {
  string tenant_id = 1;
  string game_id = 2;
  string room_id = 3;
  string to_instance_id = 4;
  int32 lease_seconds = 5;
  int32 tick_ms = 6;
}

message TakeoverRoomReply {
  string owner_instance_id = 1;
  int64 epoch = 2;
  bool recovered = 3;
  string status = 4;
  int64 last_tick = 5;
}

// The PlatformGateway executor host (M3-8, architecture 6.3). The gateway is an executor, not a
// data owner: its face carries readiness for supervisors and routing consumers, while the task
// lease protocol it drives lives on the DataServer's PlatformTask service.
service PlatformGatewayFace {
  rpc Ready(chorus.redesign.m0.Empty) returns (chorus.redesign.m0.ReadyReply);
}
