<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1310" viewBox="0 0 1100 1310" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">直播平台对接生命周期</title>
<desc id="desc">平台回调、局结束及解绑按对应适配器能力契约执行。 目标生命周期；实现与验收另行跟踪。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b4d}.title{font-size:28px;font-weight:700}.name{font-size:21px;font-weight:700}.body{font-size:16px;fill:#435570}.small{font-size:15px;fill:#52647b}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1100" height="1310" rx="20" fill="#f8fafc"/>
<text x="35" y="45" class="title">直播平台对接生命周期</text>
<text x="35" y="76" class="body">平台回调、局结束及解绑按对应适配器能力契约执行。</text>
<rect x="35" y="110" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="143" class="name">01  签发玩法启动凭据</text>
<text x="55" y="172" class="body">PlatformGateway 验证平台身份。</text>
<path d="M335 194 V226" class="edge"/>
<rect x="35" y="226" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="259" class="name">02  建立直播玩法挂载</text>
<text x="55" y="288" class="body">登记已验证的直播上下文，不伪造场次标识。</text>
<path d="M335 310 V342" class="edge"/>
<rect x="35" y="342" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="375" class="name">03  等待目标房间路由生效</text>
<text x="55" y="404" class="body">ControlServer 发布；Gateway 安装并确认。</text>
<path d="M335 426 V458" class="edge"/>
<rect x="35" y="458" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="491" class="name">04  推送直播互动回调</text>
<text x="55" y="520" class="body">Gateway 验签、归一化并直接推送到房间。</text>
<path d="M335 542 V574" class="edge"/>
<rect x="35" y="574" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="607" class="name">05  接收持久接受回执</text>
<text x="55" y="636" class="body">持久接受成功后，才返回平台成功回执。</text>
<path d="M335 658 V690" class="edge"/>
<rect x="35" y="690" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="723" class="name">06  内部对局结果已提交</text>
<text x="55" y="752" class="body">停止战斗 Tick，完成收尾输入窗口。</text>
<path d="M335 774 V806" class="edge"/>
<rect x="35" y="806" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="839" class="name">07  Gateway 确认旧局投递已停止</text>
<text x="55" y="868" class="body">处理在途事件；ControlServer 核验关闭屏障。</text>
<path d="M335 890 V922" class="edge"/>
<rect x="35" y="922" width="600" height="84" rx="10" fill="#eef8f5" stroke="#a5bdcc"/>
<text x="55" y="955" class="name">08  获准后调用平台结束接口</text>
<text x="55" y="984" class="body">内部关闭屏障完成前，不调用平台结束接口。</text>
<path d="M335 1006 V1038" class="edge"/>
<rect x="35" y="1038" width="600" height="84" rx="10" fill="#eef8f5" stroke="#a5bdcc"/>
<text x="55" y="1071" class="name">09  记录平台收尾结果</text>
<text x="55" y="1100" class="body">明确成功或有依据的无需调用，才允许最终释放。</text>
<path d="M335 1122 V1154" class="edge"/>
<rect x="35" y="1154" width="600" height="84" rx="10" fill="#eef8f5" stroke="#a5bdcc"/>
<text x="55" y="1187" class="name">10  最终释放并销毁旧房间</text>
<text x="55" y="1216" class="body">随后才开放下一局或完成玩法解绑。</text>
<path d="M635 616 H685" class="edge"/>
<rect x="685" y="574" width="385" height="110" rx="10" fill="#fff6e8" stroke="#ddbc88"/>
<text x="702" y="603" class="name">平台重试回调</text>
<text x="702" y="632" class="body">保持原事件标识。</text>
<text x="702" y="659" class="body">接受回执不等于玩法效果已应用。</text>
<path d="M635 1080 H685" class="edge"/>
<rect x="685" y="1038" width="385" height="110" rx="10" fill="#fff6e8" stroke="#ddbc88"/>
<text x="702" y="1067" class="name">超时／平台主动结束</text>
<text x="702" y="1096" class="body">结果未知：查询；无法核对则人工处置。</text>
<text x="702" y="1123" class="body">平台主动结束也须经过内部关闭屏障。</text>
<text x="35" y="1291" class="small">目标设计 · 持久接受不等于效果生效 · 内部关闭确认先于平台结束调用</text>
</svg>
