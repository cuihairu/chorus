<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1310" viewBox="0 0 1100 1310" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Live-platform integration lifecycle</title>
<desc id="desc">Platform-specific callbacks and close operations obey the adapter capability contract. Target lifecycle; implementation and acceptance are tracked separately.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b4d}.title{font-size:28px;font-weight:700}.name{font-size:21px;font-weight:700}.body{font-size:16px;fill:#435570}.small{font-size:15px;fill:#52647b}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1100" height="1310" rx="20" fill="#f8fafc"/>
<text x="35" y="45" class="title">Live-platform integration lifecycle</text>
<text x="35" y="76" class="body">Platform-specific callbacks and close operations obey the adapter capability contract.</text>
<rect x="35" y="110" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="143" class="name">01  Issue launch credentials</text>
<text x="55" y="172" class="body">PlatformGateway validates the platform identity.</text>
<path d="M335 194 V226" class="edge"/>
<rect x="35" y="226" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="259" class="name">02  Establish the live gameplay binding</text>
<text x="55" y="288" class="body">Register verified live context; do not invent IDs.</text>
<path d="M335 310 V342" class="edge"/>
<rect x="35" y="342" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="375" class="name">03  Wait for room routing to become active</text>
<text x="55" y="404" class="body">ControlServer publishes; Gateway installs and ACKs.</text>
<path d="M335 426 V458" class="edge"/>
<rect x="35" y="458" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="491" class="name">04  Deliver live interaction callbacks</text>
<text x="55" y="520" class="body">Gateway verifies, normalizes and pushes to the room.</text>
<path d="M335 542 V574" class="edge"/>
<rect x="35" y="574" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="607" class="name">05  Receive durable acceptance ACK</text>
<text x="55" y="636" class="body">Callback success follows durable acceptance.</text>
<path d="M335 658 V690" class="edge"/>
<rect x="35" y="690" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="723" class="name">06  Internal round result is committed</text>
<text x="55" y="752" class="body">Stop battle ticks; finish the closing-input window.</text>
<path d="M335 774 V806" class="edge"/>
<rect x="35" y="806" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="839" class="name">07  Gateway confirms delivery stopped</text>
<text x="55" y="868" class="body">Drain in-flight work; ControlServer verifies all ACKs.</text>
<path d="M335 890 V922" class="edge"/>
<rect x="35" y="922" width="600" height="84" rx="10" fill="#eef8f5" stroke="#a5bdcc"/>
<text x="55" y="955" class="name">08  Authorize and call the platform</text>
<text x="55" y="984" class="body">No platform-end call before the internal barrier.</text>
<path d="M335 1006 V1038" class="edge"/>
<rect x="35" y="1038" width="600" height="84" rx="10" fill="#eef8f5" stroke="#a5bdcc"/>
<text x="55" y="1071" class="name">09  Record official close outcome</text>
<text x="55" y="1100" class="body">Success or evidenced NotRequired permits finalization.</text>
<path d="M335 1122 V1154" class="edge"/>
<rect x="35" y="1154" width="600" height="84" rx="10" fill="#eef8f5" stroke="#a5bdcc"/>
<text x="55" y="1187" class="name">10  Finalize; destroy the old room</text>
<text x="55" y="1216" class="body">Only then allow the next round or binding closure.</text>
<path d="M635 616 H685" class="edge"/>
<rect x="685" y="574" width="385" height="110" rx="10" fill="#fff6e8" stroke="#ddbc88"/>
<text x="702" y="603" class="name">Callback retry</text>
<text x="702" y="632" class="body">Retry the same event identity.</text>
<text x="702" y="659" class="body">Acceptance ACK is not a gameplay result.</text>
<path d="M635 1080 H685" class="edge"/>
<rect x="685" y="1038" width="385" height="110" rx="10" fill="#fff6e8" stroke="#ddbc88"/>
<text x="702" y="1067" class="name">Timeout / platform-initiated end</text>
<text x="702" y="1096" class="body">Unknown: query; otherwise NeedsAttention.</text>
<text x="702" y="1123" class="body">Platform end callbacks use the same barrier.</text>
<text x="35" y="1291" class="small">Target design · Durable acceptance ≠ applied effect · Close ACK precedes platform-end call</text>
</svg>
