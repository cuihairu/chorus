<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1726" viewBox="0 0 1100 1726" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">一笔礼物消息的生命周期</title>
<desc id="desc">目标流程；平台依据与实现状态见生命周期文档。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b4d}.title{font-size:28px;font-weight:700}.name{font-size:22px;font-weight:700}.body{font-size:17px}.small{font-size:16px;fill:#52647b}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1100" height="1726" rx="20" fill="#f8fafc"/>
<text x="35" y="43" class="title">一笔礼物消息的生命周期</text>
<text x="35" y="77" class="small">独立目标流程 · 每步标明负责进程和确认点</text>
<rect x="35" y="105" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="134" class="name">01  玩家在直播间送出礼物</text>
<text x="55" y="160" class="body">Viewer → Live platform</text>
<text x="55" y="184" class="small">礼物交易由平台处理，Chorus 接收对应互动事件。</text>
<path d="M550 202 V227" class="edge"/>
<rect x="35" y="227" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="256" class="name">02  平台发送礼物事件</text>
<text x="55" y="282" class="body">Live platform → PlatformGateway</text>
<text x="55" y="306" class="small">接收官方事件／订单标识、来源直播间及应用上下文。</text>
<path d="M550 324 V349" class="edge"/>
<rect x="35" y="349" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="378" class="name">03  验签并归一化礼物事件</text>
<text x="55" y="404" class="body">PlatformGateway</text>
<text x="55" y="428" class="small">验证来源，保留礼物 ID、数量、明确单位和稳定 EventId。</text>
<path d="M550 446 V471" class="edge"/>
<rect x="35" y="471" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="500" class="name">04  定位直播玩法挂载</text>
<text x="55" y="526" class="body">PlatformGateway: installed route map</text>
<text x="55" y="550" class="small">用已验证的直播上下文定位挂载，不按送礼玩家 ID 猜房间。</text>
<path d="M550 568 V593" class="edge"/>
<rect x="35" y="593" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="622" class="name">05  定位游戏房间与实例</text>
<text x="55" y="648" class="body">ControlServer route snapshot → PlatformGateway</text>
<text x="55" y="672" class="small">挂载代 → RoomId／对局代 → GameServer 地址／owner epoch。</text>
<path d="M550 690 V715" class="edge"/>
<rect x="35" y="715" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="744" class="name">06  直接推送至目标 GameServer</text>
<text x="55" y="770" class="body">PlatformGateway → GameServer</text>
<text x="55" y="794" class="small">携带 EventId、来源证据、挂载／对局代及 owner epoch。</text>
<path d="M550 812 V837" class="edge"/>
<rect x="35" y="837" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="866" class="name">07  投递对应房间实体</text>
<text x="55" y="892" class="body">GameServer RoomRuntime → RoomActor</text>
<text x="55" y="916" class="small">校验来源、房间、epoch 和输入窗口，过期路由明确拒绝。</text>
<path d="M550 934 V959" class="edge"/>
<rect x="35" y="959" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="988" class="name">08  持久接受并去重</text>
<text x="55" y="1014" class="body">GameServer → DataServer</text>
<text x="55" y="1038" class="small">按业务端已确定的目标保存，校验事件唯一键及请求哈希。</text>
<path d="M550 1056 V1081" class="edge"/>
<rect x="35" y="1081" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="1110" class="name">09  确认事件已持久接受</text>
<text x="55" y="1136" class="body">GameServer → PlatformGateway → Platform</text>
<text x="55" y="1160" class="small">持久成功后才按平台要求回执；接受不等于效果已经生效。</text>
<path d="M550 1178 V1203" class="edge"/>
<rect x="35" y="1203" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="1232" class="name">10  将已接受礼物排入 Tick</text>
<text x="55" y="1258" class="body">RoomActor</text>
<text x="55" y="1282" class="small">按已接受顺序进入 Tick；重试不再增加一条玩法输入。</text>
<path d="M550 1300 V1325" class="edge"/>
<rect x="35" y="1325" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="1354" class="name">11  根据玩法规则触发行为</text>
<text x="55" y="1380" class="body">RoomActor → Game module</text>
<text x="55" y="1404" class="small">由玩法配置将礼物 ID／数量映射为技能、单位或积分等行为。</text>
<path d="M550 1422 V1447" class="edge"/>
<rect x="35" y="1447" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="1476" class="name">12  提交候选状态与效果</text>
<text x="55" y="1502" class="body">GameServer → DataServer</text>
<text x="55" y="1526" class="small">原子保存帧、输入消费和效果引用；失败不能发布候选结果。</text>
<path d="M550 1544 V1569" class="edge"/>
<rect x="35" y="1569" width="1030" height="97" rx="10" fill="#eef8f5" stroke="#a5bdcc"/>
<text x="55" y="1598" class="name">13  刷新游戏画面</text>
<text x="55" y="1624" class="body">GameServer → StreamerGateway → Game client</text>
<text x="55" y="1648" class="small">广播已提交快照／增量；观众通过直播画面看到实际效果。</text>
<text x="35" y="1709" class="small">目标设计，不代表实现或生产联调已经通过。</text>
</svg>
