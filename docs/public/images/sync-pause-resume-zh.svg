<text x="34" y="2420" class="time" text-anchor="middle">t18</text>
<path d="M900 2420 H1250" class="wire" style="stroke:#475569"/>
<text x="1075.0" y="2377" class="msg" text-anchor="middle" style="fill:#475569">CommitFrame: t201 / v202</text>
<text x="1075.0" y="2400" class="msg" text-anchor="middle" style="fill:#475569">状态 + 消费 + 效果</text>
<circle cx="34" cy="2523" r="18" fill="#fff" stroke="#cbd5e1"/>
<text x="34" y="2528" class="time" text-anchor="middle">t19</text>
<path d="M1250 2528 H900" class="wire" style="stroke:#087f5b"/>
<text x="1075.0" y="2485" class="msg" text-anchor="middle" style="fill:#087f5b">已提交 t201 / v202</text>
<circle cx="34" cy="2631" r="18" fill="#fff" stroke="#cbd5e1"/>
<text x="34" y="2636" class="time" text-anchor="middle">t20</text>
<path d="M900 2636 H550" class="wire" style="stroke:#2563eb"/>
<text x="725.0" y="2593" class="msg" text-anchor="middle" style="fill:#2563eb">Delta: e7 / t201</text>
<text x="725.0" y="2616" class="msg" text-anchor="middle" style="fill:#2563eb">base v201 → v202</text>
<circle cx="34" cy="2739" r="18" fill="#fff" stroke="#cbd5e1"/>
<text x="34" y="2744" class="time" text-anchor="middle">t21</text>
<path d="M550 2744 H200" class="wire" style="stroke:#2563eb"/>
<text x="375.0" y="2701" class="msg" text-anchor="middle" style="fill:#2563eb">双方应用同一已提交增量</text>
<text x="375.0" y="2724" class="msg" text-anchor="middle" style="fill:#2563eb">base v201 → v202</text>
<rect x="74" y="2792" width="1736" height="74" rx="10" fill="#fff7ed" stroke="#fdba74"/>
<text x="96" y="2819" class="body" text-anchor="start">暂停超时是另一分支，不是恢复后的步骤：MaxPauseDuration → 玩法终结/补偿 → 正常关闭屏障。</text>
<text x="96" y="2844" class="body" text-anchor="start">进程重启必须恢复 Paused 和策略状态；旧会话/旧 epoch 的就绪通知不能计数。</text>
<text x="34" y="2955" class="small">时间向下。t01… 表示先后顺序，不是毫秒刻度。目标契约；待实现与未验收部分见 TODO。</text>
</svg>
