<path d="M1700 179 V2898" class="life"/>
<rect x="74" y="220" width="1736" height="44" rx="8" fill="#e8eef8"/>
<text x="94" y="249" class="phase" text-anchor="start">A. 先持久确认暂停，再冻结逻辑推进</text>
