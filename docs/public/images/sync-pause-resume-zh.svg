<text x="1300.0" y="1037" class="msg" text-anchor="middle" style="fill:#087f5b">已接受 ≠ 已应用</text>
<rect x="74" y="1128" width="1736" height="44" rx="8" fill="#e8eef8"/>
<text x="94" y="1157" class="phase" text-anchor="start">C. 身份恢复走图 02；双方安装同一暂停基线</text>
