<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1320" viewBox="0 0 1640 1320" role="img" aria-labelledby="title desc">
<title id="title">03 · All-offline policy selection</title><desc id="desc">Read downward. Three mutually exclusive policy branches are pinned in room configuration.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d}.title{font-size:28px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:17px}.msg{font-size:16px;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}.small{font-size:15px;fill:#52647b}.phase{font-size:18px;font-weight:700}.time{font-size:13px;fill:#52647b}.life{stroke:#b8c4d5;stroke-dasharray:6 6;stroke-width:1.5}.wire{fill:none;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1640" height="1320" fill="#fff"/>
<text x="35" y="48" class="title" text-anchor="start">03 · All offline: detect → grace → select exactly one policy</text>
<text x="35" y="82" class="small" text-anchor="start">This is a branch flow. ContinueToEnd, PauseAtBoundary and FinishByRule are alternatives, not consecutive stages.</text>
<rect x="540" y="140" width="560" height="120" rx="12" fill="#eef8f5" stroke="#b8c4d5"/>
<text x="560" y="174" class="head" text-anchor="start">01 · Current controlling A and B are both offline</text>
<text x="560" y="209" class="body" text-anchor="start">Use server session generations and heartbeat facts</text>
<text x="560" y="238" class="body" text-anchor="start">One spectator leaving does not satisfy this condition</text>
<path d="M820 260 V330" class="wire" style="stroke:#64748b"/>
<rect x="540" y="330" width="560" height="105" rx="12" fill="#eef8f5" stroke="#b8c4d5"/>
<text x="560" y="364" class="head" text-anchor="start">02 · Grace expires: still all offline?</text>
<text x="560" y="399" class="body" text-anchor="start">Do not pause merely because a socket just closed</text>
<path d="M540 382 H420" class="wire" style="stroke:#64748b"/>
<text x="450" y="370" class="small" text-anchor="start">No</text>
<rect x="80" y="330" width="340" height="125" rx="12" fill="#edf5ff" stroke="#b8c4d5"/>
<text x="100" y="364" class="head" text-anchor="start">Return to normal flow</text>
<text x="100" y="399" class="body" text-anchor="start">Do not trigger all-offline policy</text>
<text x="100" y="428" class="body" text-anchor="start">Reconnect using flow 02</text>
<path d="M820 435 V505" class="wire" style="stroke:#64748b"/>
<text x="838" y="476" class="small" text-anchor="start">Yes</text>
<rect x="540" y="505" width="560" height="105" rx="12" fill="#eef2ff" stroke="#b8c4d5"/>
<text x="560" y="539" class="head" text-anchor="start">03 · Read pinned AllOfflinePolicy / ConfigHash</text>
<text x="560" y="574" class="body" text-anchor="start">Do not silently replace it with current global config</text>
<path d="M820 610 V680 H295 V750" class="wire" style="stroke:#64748b"/>
<path d="M820 680 V750" class="wire" style="stroke:#64748b"/>
<path d="M820 680 H1345 V750" class="wire" style="stroke:#64748b"/>
<text x="820" y="715" class="phase" text-anchor="middle">Exactly ONE branch</text>
<rect x="80" y="750" width="430" height="300" rx="12" fill="#eef8f5" stroke="#b8c4d5"/>
<text x="100" y="784" class="head" text-anchor="start">A · ContinueToEnd</text>
<text x="100" y="819" class="body" text-anchor="start">1. Continue tick n+1, n+2 …</text>
<text x="100" y="848" class="body" text-anchor="start">2. Apply valid inputs and persist frames</text>
<text x="100" y="877" class="body" text-anchor="start">3. Commit final result by game rules</text>
<text x="100" y="906" class="body" text-anchor="start">4. Retain result for reconnect</text>
<text x="100" y="935" class="body" text-anchor="start">No automatic next-round matchmaking</text>
<rect x="605" y="750" width="430" height="300" rx="12" fill="#edf5ff" stroke="#b8c4d5"/>
<text x="625" y="784" class="head" text-anchor="start">B · PauseAtBoundary</text>
<text x="625" y="819" class="body" text-anchor="start">1. Commit the Paused boundary</text>
<text x="625" y="848" class="body" text-anchor="start">2. Freeze logical ticks and timers</text>
<text x="625" y="877" class="body" text-anchor="start">3. Dispose inputs by declared policy</text>
<text x="625" y="906" class="body" text-anchor="start">4. Ready count → persist resume (flow 04)</text>
<text x="625" y="935" class="body" text-anchor="start">Timeout → game end / compensation</text>
<rect x="1130" y="750" width="430" height="300" rx="12" fill="#fff7ed" stroke="#b8c4d5"/>
<text x="1150" y="784" class="head" text-anchor="start">C · FinishByRule</text>
<text x="1150" y="819" class="body" text-anchor="start">1. Compute end / abort / compensation</text>
<text x="1150" y="848" class="body" text-anchor="start">2. Commit the immutable outcome</text>
<text x="1150" y="877" class="body" text-anchor="start">3. Start normal closing operation</text>
<text x="1150" y="906" class="body" text-anchor="start">Do not delete the room immediately</text>
<text x="1150" y="935" class="body" text-anchor="start">Do not invent a normal victory</text>
<path d="M295 1050 V1150 H820 V1180" class="wire" style="stroke:#64748b"/>
<path d="M1345 1050 V1150 H820" class="wire" style="stroke:#64748b"/>
<path d="M820 1050 V1180" class="wire" style="stroke:#64748b"/>
<text x="840" y="1100" class="small" text-anchor="start">B joins only if timeout produces an ending</text>
<rect x="400" y="1180" width="840" height="100" rx="12" fill="#fff7ed" stroke="#b8c4d5"/>
<text x="420" y="1214" class="head" text-anchor="start">04 · Whenever an outcome ends the room: keep the close barrier</text>
<text x="420" y="1249" class="body" text-anchor="start">Stop delivery ACK → platform outcome confirmed → settle / release → destroy room</text>
</svg>
