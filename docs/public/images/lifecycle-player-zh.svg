<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1078" viewBox="0 0 1100 1078" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">玩家／观众生命周期</title>
<desc id="desc">基线：观众通过直播平台互动，无需连接或登录 Chorus。 目标生命周期；实现与验收另行跟踪。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b4d}.title{font-size:28px;font-weight:700}.name{font-size:21px;font-weight:700}.body{font-size:16px;fill:#435570}.small{font-size:15px;fill:#52647b}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1100" height="1078" rx="20" fill="#f8fafc"/>
<text x="35" y="45" class="title">玩家／观众生命周期</text>
<text x="35" y="76" class="body">基线：观众通过直播平台互动，无需连接或登录 Chorus。</text>
<rect x="35" y="110" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="143" class="name">01  进入主播直播间</text>
<text x="55" y="172" class="body">观看主播及当前直播玩法。</text>
<path d="M335 194 V226" class="edge"/>
<rect x="35" y="226" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="259" class="name">02  确认当前是否处于可参与对局</text>
<text x="55" y="288" class="body">直播玩法挂载确定参与的是哪一局。</text>
<path d="M335 310 V342" class="edge"/>
<rect x="35" y="342" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="375" class="name">03  发送弹幕、点赞或礼物</text>
<text x="55" y="404" class="body">平台提供事件标识及所属直播上下文。</text>
<path d="M335 426 V458" class="edge"/>
<rect x="35" y="458" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="491" class="name">04  事件验签并定向投递</text>
<text x="55" y="520" class="body">PlatformGateway 按路由推送至目标 RoomActor。</text>
<path d="M335 542 V574" class="edge"/>
<rect x="35" y="574" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="607" class="name">05  事件被持久接受</text>
<text x="55" y="636" class="body">GameServer 经 DataServer 持久接受后确认。</text>
<path d="M335 658 V690" class="edge"/>
<rect x="35" y="690" width="600" height="84" rx="10" fill="#eef8f5" stroke="#a5bdcc"/>
<text x="55" y="723" class="name">06  事件在已提交 Tick 中生效</text>
<text x="55" y="752" class="body">去重、排序、执行，提交成功后发布效果。</text>
<path d="M335 774 V806" class="edge"/>
<rect x="35" y="806" width="600" height="84" rx="10" fill="#eef8f5" stroke="#a5bdcc"/>
<text x="55" y="839" class="name">07  查看结果与奖励状态</text>
<text x="55" y="868" class="body">胜负冻结和奖励到账是两个不同状态。</text>
<path d="M335 890 V922" class="edge"/>
<rect x="35" y="922" width="600" height="84" rx="10" fill="#eef8f5" stroke="#a5bdcc"/>
<text x="55" y="955" class="name">08  继续观看或离开直播间</text>
<text x="55" y="984" class="body">新一局建立新的参与上下文。</text>
<path d="M635 268 H685" class="edge"/>
<rect x="685" y="226" width="385" height="110" rx="10" fill="#fff6e8" stroke="#ddbc88"/>
<text x="702" y="255" class="name">尚未开局／输入已关闭</text>
<text x="702" y="284" class="body">按明确的局外规则处置。</text>
<text x="702" y="311" class="body">不猜目标房间，不声称已在局内生效。</text>
<path d="M635 616 H685" class="edge"/>
<rect x="685" y="574" width="385" height="110" rx="10" fill="#fff6e8" stroke="#ddbc88"/>
<text x="702" y="603" class="name">重复／迟到事件</text>
<text x="702" y="632" class="body">沿用首次接受时固定的局归属。</text>
<text x="702" y="659" class="body">去重；关闭后按终态策略处置。</text>
<text x="35" y="1059" class="small">目标设计 · 持久接受不等于效果生效 · 内部关闭确认先于平台结束调用</text>
</svg>
