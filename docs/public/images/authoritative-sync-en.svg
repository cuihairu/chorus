<circle cx="34" cy="351" r="18" fill="#fff" stroke="#cbd5e1"/>
<text x="34" y="356" class="time" text-anchor="middle">t01</text>
<path d="M200 356 H550" class="wire" style="stroke:#475569"/>
<text x="375.0" y="313" class="msg" text-anchor="middle" style="fill:#475569">Intent C1 · epoch 7</text>
<text x="375.0" y="336" class="msg" text-anchor="middle" style="fill:#475569">No client-reported score</text>
<circle cx="34" cy="459" r="18" fill="#fff" stroke="#cbd5e1"/>
<text x="34" y="464" class="time" text-anchor="middle">t02</text>
<path d="M550 464 H900" class="wire" style="stroke:#475569"/>
<text x="725.0" y="421" class="msg" text-anchor="middle" style="fill:#475569">Authenticated identity + C1</text>
<text x="725.0" y="444" class="msg" text-anchor="middle" style="fill:#475569">Room R / current owner route</text>
<circle cx="34" cy="549.0" r="18" fill="#fff" stroke="#cbd5e1"/>
<text x="34" y="554.0" class="time" text-anchor="middle">t03</text>
<rect x="769" y="512" width="262" height="76" rx="9" fill="#eef8f5" stroke="#86c9b3"/>
<text x="900" y="539" class="small" text-anchor="middle">Validate session / participation</text>
<text x="900" y="563" class="small" text-anchor="middle">epoch / sequence / action rules</text>
<circle cx="34" cy="657.0" r="18" fill="#fff" stroke="#cbd5e1"/>
