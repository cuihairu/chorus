<rect x="769" y="115" width="262" height="64" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="900" y="143" class="head" text-anchor="middle">GameServer</text>
<text x="900" y="166" class="head" text-anchor="middle">RoomActor</text>
