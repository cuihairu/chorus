<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1590" viewBox="0 0 1240 1590" role="img" aria-labelledby="title desc">
<title id="title">Authoritative frame synchronization and reconnect</title>
<desc id="desc">One room authority commits before broadcasting. Reconnect with a head snapshot. Offline policy is game-specific. Commands are validated server-side. Target contract.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b4d}.title{font-size:28px;font-weight:700}.name{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#52647b}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1240" height="1590" rx="20" fill="#f8fafc"/>
<text x="35" y="45" class="title" text-anchor="start">Multi-streamer synchronization · One authoritative room</text>
<text x="35" y="78" class="body" text-anchor="start">Target contract · Clients submit intent; only committed server state is authoritative</text>
<rect x="15" y="110" width="310" height="65" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="170" y="149" class="name" text-anchor="middle">Streamer A client</text>
<path d="M170 175 V960" fill="none" stroke="#b5c2d3" stroke-dasharray="6 5"/>
<rect x="465" y="110" width="310" height="65" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="620" y="149" class="name" text-anchor="middle">RoomActor + persistence</text>
<path d="M620 175 V960" fill="none" stroke="#b5c2d3" stroke-dasharray="6 5"/>
<rect x="915" y="110" width="310" height="65" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="1070" y="149" class="name" text-anchor="middle">Streamer B client</text>
<path d="M1070 175 V960" fill="none" stroke="#b5c2d3" stroke-dasharray="6 5"/>
<path d="M170 230 L620 230" class="edge"/>
<text x="395.0" y="218" class="small" text-anchor="middle">CommandId + session + room / epoch</text>
<rect x="395" y="265" width="450" height="80" rx="10" fill="#eef8f5" stroke="#86c9b3"/>
<text x="620" y="295" class="name" text-anchor="middle">Authorize → Order → ApplyTick</text>
<text x="620" y="325" class="body" text-anchor="middle">Commit state + consumed inputs + effects</text>
<path d="M620 395 L170 395" class="edge"/>
<text x="395.0" y="383" class="small" text-anchor="middle">Delta: epoch=7, tick=100, base=100, version=101</text>
<path d="M620 435 L1070 435" class="edge"/>
<text x="845.0" y="423" class="small" text-anchor="middle">Delta: epoch=7, tick=100, base=100, version=101</text>
<text x="170" y="483" class="body" text-anchor="middle">A disconnects at tick 100</text>
<path d="M620 540 L1070 540" class="edge"/>
<text x="845.0" y="528" class="small" text-anchor="middle">B continues: committed ticks 101 … 130</text>
<path d="M170 625 L620 625" class="edge"/>
<text x="395.0" y="613" class="small" text-anchor="middle">Resume; last applied tick=100 / version=101</text>
<text x="620" y="677" class="body" text-anchor="middle">Verify session + participation; capture head at tick 130</text>
<path d="M620 740 L170 740" class="edge"/>
<text x="395.0" y="728" class="small" text-anchor="middle">Snapshot: epoch=7, tick=130, version=131</text>
<text x="170" y="782" class="small" text-anchor="middle">Replace baseline; no replayed rewards</text>
<path d="M620 850 L170 850" class="edge"/>
<text x="395.0" y="838" class="small" text-anchor="middle">Delta: tick=131, base=131, version=132</text>
<path d="M620 895 L1070 895" class="edge"/>
<text x="845.0" y="883" class="small" text-anchor="middle">Delta: tick=131, base=131, version=132</text>
<text x="620" y="950" class="body" text-anchor="middle">Both converge to the same committed version; render timing may differ.</text>
<rect x="35" y="990" width="1170" height="255" rx="12" fill="#edf5ff" stroke="#93b9e3"/>
<text x="55" y="1025" class="name" text-anchor="start">When every controlling streamer is offline: persist the game policy</text>
<text x="55" y="1065" class="body" text-anchor="start">ContinueToEnd: keep ticking; retain result; never auto-queue offline streamers.</text>
<text x="55" y="1102" class="body" text-anchor="start">PauseAtBoundary: after grace, commit a pause boundary; freeze logical timers.</text>
<text x="55" y="1139" class="body" text-anchor="start">FinishByRule: invoke the game-defined end / abort / compensation rule.</text>
<text x="55" y="1176" class="body" text-anchor="start">Paused inputs: explicit bounded buffer / out-of-round / rejection policy.</text>
<text x="55" y="1213" class="body" text-anchor="start">Resume: required players ready on one snapshot baseline → commit resume → tick.</text>
<rect x="35" y="1270" width="1170" height="245" rx="12" fill="#fff6e8" stroke="#ddbc88"/>
<text x="55" y="1305" class="name" text-anchor="start">Consistency and anti-cheat gates</text>
<text x="55" y="1345" class="body" text-anchor="start">Accept deltas only with matching epoch and baseVersion; otherwise request a snapshot.</text>
<text x="55" y="1382" class="body" text-anchor="start">Server validates control session, participation, action rules, sequence and rate limits.</text>
<text x="55" y="1419" class="body" text-anchor="start">Gift / like facts come from verified platform events, never client-reported scores.</text>
<text x="55" y="1456" class="body" text-anchor="start">ACK is a synchronization hint, not reward evidence; hashes are not proof of an honest client.</text>
<text x="55" y="1493" class="body" text-anchor="start">A slow client cannot block the other; queue overflow resets to a committed snapshot.</text>
<text x="35" y="1555" class="small" text-anchor="start">StreamerGateway relay hops are omitted in the sequence. Target policy details and implementation gaps are documented separately.</text>
</svg>
