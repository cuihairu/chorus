<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1726" viewBox="0 0 1100 1726" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Room lifecycle: match to destruction</title>
<desc id="desc">Target contract: route installation must be confirmed before battle starts; delivery stop must be confirmed before notifying the platform.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b4d}.title{font-size:28px;font-weight:700}.name{font-size:22px;font-weight:700}.body{font-size:17px}.small{font-size:16px;fill:#52647b}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1100" height="1726" rx="20" fill="#f8fafc"/>
<text x="35" y="43" class="title">Room lifecycle · Match → Route → Battle → Close → Destroy</text>
<text x="35" y="77" class="small">Target contract; prepared rooms do not tick. Unknown platform outcomes block finalization.</text>
<rect x="35" y="105" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="134" class="name">01  Match streamers</text>
<text x="55" y="160" class="body">ControlServer</text>
<text x="55" y="184" class="small">Select eligible gameplay bindings; reserve participants.</text>
<path d="M550 202 V227" class="edge"/>
<rect x="35" y="227" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="256" class="name">02  Allocate and create the room</text>
<text x="55" y="282" class="body">ControlServer → GameServer</text>
<text x="55" y="306" class="small">Assign RoomId, owner and epoch; create a prepared RoomActor.</text>
<path d="M550 324 V349" class="edge"/>
<rect x="35" y="349" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="378" class="name">03  Commit participation</text>
<text x="55" y="404" class="body">ControlServer</text>
<text x="55" y="428" class="small">Commit BindingId → RoomId; preparation failure aborts reservation.</text>
<path d="M550 446 V471" class="edge"/>
<rect x="35" y="471" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="500" class="name">04  Register and publish routing</text>
<text x="55" y="526" class="body">ControlServer → PlatformGateway</text>
<text x="55" y="550" class="small">Combine live binding → room → endpoint / epoch; publish a version.</text>
<path d="M550 568 V593" class="edge"/>
<rect x="35" y="593" width="1030" height="97" rx="10" fill="#eef8f5" stroke="#a5bdcc"/>
<text x="55" y="622" class="name">05  Confirm route installation</text>
<text x="55" y="648" class="body">PlatformGateway → ControlServer</text>
<text x="55" y="672" class="small">ACK the version; missing ACK blocks battle activation.</text>
<path d="M550 690 V715" class="edge"/>
<rect x="35" y="715" width="1030" height="97" rx="10" fill="#eef8f5" stroke="#a5bdcc"/>
<text x="55" y="744" class="name">06  Authorize and start the battle</text>
<text x="55" y="770" class="body">ControlServer → GameServer</text>
<text x="55" y="794" class="small">Activate the prepared RoomActor only after route confirmation.</text>
<path d="M550 812 V837" class="edge"/>
<rect x="35" y="837" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="866" class="name">07  Run ticks and refresh state</text>
<text x="55" y="892" class="body">PlatformGateway → RoomActor → StreamerGateway</text>
<text x="55" y="916" class="small">Push events to the room; compute and persist ticks; broadcast committed state.</text>
<path d="M550 934 V959" class="edge"/>
<rect x="35" y="959" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="988" class="name">08  End battle and freeze the result</text>
<text x="55" y="1014" class="body">RoomActor → ControlServer</text>
<text x="55" y="1038" class="small">Commit final frame; stop battle ticks; resolve closing-window inputs.</text>
<path d="M550 1056 V1081" class="edge"/>
<rect x="35" y="1081" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="1110" class="name">09  Close room routing</text>
<text x="55" y="1136" class="body">ControlServer → PlatformGateway / GameServer</text>
<text x="55" y="1160" class="small">Revoke the old route version; fence new input to this round.</text>
<path d="M550 1178 V1203" class="edge"/>
<rect x="35" y="1203" width="1030" height="97" rx="10" fill="#eef8f5" stroke="#a5bdcc"/>
<text x="55" y="1232" class="name">10  Confirm delivery has stopped</text>
<text x="55" y="1258" class="body">PlatformGateway → ControlServer</text>
<text x="55" y="1282" class="small">Drain in-flight work; confirm all valid route holders.</text>
<path d="M550 1300 V1325" class="edge"/>
<rect x="35" y="1325" width="1030" height="97" rx="10" fill="#eef8f5" stroke="#a5bdcc"/>
<text x="55" y="1354" class="name">11  Notify platform after confirmation</text>
<text x="55" y="1380" class="body">ControlServer → PlatformGateway → Live platform</text>
<text x="55" y="1404" class="small">Authorize the close task; record official success or evidenced NotRequired.</text>
<path d="M550 1422 V1447" class="edge"/>
<rect x="35" y="1447" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="1476" class="name">12  Finalize settlement and release</text>
<text x="55" y="1502" class="body">ControlServer → DataServer / StreamerServer</text>
<text x="55" y="1526" class="small">Require input disposition, rewards and platform close; atomically release.</text>
<path d="M550 1544 V1569" class="edge"/>
<rect x="35" y="1569" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="1598" class="name">13  Destroy the old room</text>
<text x="55" y="1624" class="body">ControlServer → GameServer</text>
<text x="55" y="1648" class="small">Remove the matching RoomActor; keep results, ledger and dedup history.</text>
<text x="35" y="1709" class="small">Failure branches: retry the same operation; suspend on route/owner conflicts; never skip confirmation barriers.</text>
</svg>
