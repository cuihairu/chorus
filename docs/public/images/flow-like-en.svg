<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1604" viewBox="0 0 1100 1604" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Lifecycle of a like event</title>
<desc id="desc">Target lifecycle; platform facts and implementation status are documented on the lifecycle page.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b4d}.title{font-size:28px;font-weight:700}.name{font-size:22px;font-weight:700}.body{font-size:17px}.small{font-size:16px;fill:#52647b}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1100" height="1604" rx="20" fill="#f8fafc"/>
<text x="35" y="43" class="title">Lifecycle of a like event</text>
<text x="35" y="77" class="small">Independent target flow · Actors and confirmation points shown at every step</text>
<rect x="35" y="105" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="134" class="name">01  Viewer taps Like</text>
<text x="55" y="160" class="body">Viewer → Live platform</text>
<text x="55" y="184" class="small">A tap is a platform action, not necessarily one callback.</text>
<path d="M550 202 V227" class="edge"/>
<rect x="35" y="227" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="256" class="name">02  Platform emits a like event / count batch</text>
<text x="55" y="282" class="body">Live platform → PlatformGateway</text>
<text x="55" y="306" class="small">Preserve official count, batch identity and source live context.</text>
<path d="M550 324 V349" class="edge"/>
<rect x="35" y="349" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="378" class="name">03  Verify and normalize the count</text>
<text x="55" y="404" class="body">PlatformGateway</text>
<text x="55" y="428" class="small">Normalize delta counts; convert cumulative counts only if specified.</text>
<path d="M550 446 V471" class="edge"/>
<rect x="35" y="471" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="500" class="name">04  Resolve binding, room and instance</text>
<text x="55" y="526" class="body">PlatformGateway: ControlServer route cache</text>
<text x="55" y="550" class="small">Use live context → binding / round → endpoint and epoch.</text>
<path d="M550 568 V593" class="edge"/>
<rect x="35" y="593" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="622" class="name">05  Push the like input directly</text>
<text x="55" y="648" class="body">PlatformGateway → GameServer</text>
<text x="55" y="672" class="small">Carry the count, batch / event identity and immutable round context.</text>
<path d="M550 690 V715" class="edge"/>
<rect x="35" y="715" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="744" class="name">06  Validate and deliver to the room</text>
<text x="55" y="770" class="body">RoomRuntime → RoomActor</text>
<text x="55" y="794" class="small">Check epoch, binding generation and open input window.</text>
<path d="M550 812 V837" class="edge"/>
<rect x="35" y="837" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="866" class="name">07  Accept according to the declared reliability class</text>
<text x="55" y="892" class="body">GameServer → DataServer</text>
<text x="55" y="916" class="small">Current durable baseline: persist the accepted count before ACK.</text>
<path d="M550 934 V959" class="edge"/>
<rect x="35" y="959" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="988" class="name">08  Acknowledge platform delivery</text>
<text x="55" y="1014" class="body">GameServer → PlatformGateway → Platform</text>
<text x="55" y="1038" class="small">ACK the accepted batch; do not claim every physical tap was delivered.</text>
<path d="M550 1056 V1081" class="edge"/>
<rect x="35" y="1081" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="1110" class="name">09  Merge within a defined tick window</text>
<text x="55" y="1136" class="body">RoomActor input reducer</text>
<text x="55" y="1160" class="small">For additive rules preserve accepted total and attribution.</text>
<path d="M550 1178 V1203" class="edge"/>
<rect x="35" y="1203" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="1232" class="name">10  Apply the configured like action</text>
<text x="55" y="1258" class="body">RoomActor → Game module</text>
<text x="55" y="1282" class="small">For example: add energy or trigger a configured count threshold.</text>
<path d="M550 1300 V1325" class="edge"/>
<rect x="35" y="1325" width="1030" height="97" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="1354" class="name">11  Commit consumption and new state</text>
<text x="55" y="1380" class="body">GameServer → DataServer</text>
<text x="55" y="1404" class="small">Record consumed batches, merged count and resulting state / effects.</text>
<path d="M550 1422 V1447" class="edge"/>
<rect x="35" y="1447" width="1030" height="97" rx="10" fill="#eef8f5" stroke="#a5bdcc"/>
<text x="55" y="1476" class="name">12  Publish the committed effect</text>
<text x="55" y="1502" class="body">GameServer → StreamerGateway → Game client</text>
<text x="55" y="1526" class="small">Repeated batches cannot advance the meter twice when dedup is supported.</text>
<text x="35" y="1587" class="small">Target design; no implementation or production acceptance is implied.</text>
</svg>
