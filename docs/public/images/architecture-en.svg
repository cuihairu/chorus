<text x="925" y="1016" class="label" text-anchor="end">↓ Room placement / recovery / close</text>
<text transform="translate(1246 1010) rotate(-90)" class="small" style="fill:#087f5b">Verified platform events → target room</text>
<text x="315" y="1408" class="label" text-anchor="start" style="fill:#7c3aed">Profiles / assets</text>
<text x="995" y="1408" class="label" text-anchor="start" style="fill:#7c3aed">Frames / recovery</text>
<text x="655" y="1458" class="label" text-anchor="start">Control transactions</text>
<text x="655" y="1695" class="label" text-anchor="start" style="fill:#7c3aed">Business schema reads / writes</text>
<text x="40" y="1700" class="label" text-anchor="start">Node / ownership / lease records</text>
<text x="40" y="1840" class="small" text-anchor="start">Dashed: control · Solid: business data · Crossings without dots are not junctions</text>
<text x="40" y="1865" class="small" text-anchor="start">Compute → Commit → Publish · NodeAgent supervises local roles · Key connections shown</text>
<text x="40" y="1890" class="small">DDL: deploy-time SchemaTool only. ControlServer / DataServer verify schema; they do not create tables.</text>
</svg>
