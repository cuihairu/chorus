<text x="740" y="1326" class="small" text-anchor="start">Per room: state · epoch · subscribers</text>
<g id="data-server" data-node="data-server"><rect x="200" y="1480" width="880" height="160" rx="14" fill="#edf5ff" stroke="#93b9e3" stroke-width="1.5"/>
<text x="220" y="1514" class="name" text-anchor="start">DataServer</text>
<text x="220" y="1545" class="body" text-anchor="start">Storage only: explicit reads / writes · Transactions · Deduplication · Version / epoch checks</text>
<text x="220" y="1572" class="body" text-anchor="start">Inputs · Frames · Snapshots · Profiles · Asset ledger · Receipts</text>
<text x="220" y="1599" class="body" text-anchor="start">No event target selection, matching or settlement orchestration</text>
</g>
<g id="postgresql" data-node="postgresql"><rect x="200" y="1730" width="880" height="80" rx="14" fill="#edf5ff" stroke="#93b9e3" stroke-width="1.5"/>
