<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1915" viewBox="0 0 1280 1915" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Chorus · Vertical process architecture</title>
<desc id="desc">Seven process roles. ControlServer is the central coordinator. StreamerServer and GameServer sit beside each other above DataServer. GM enters ControlServer Admin. StreamerGateway connects directly to GameServer for battle input and committed frames. PlatformGateway pushes verified events directly to the target room using ControlServer routes. Dashed lines are control; solid lines are business data. Target design, not a claim of complete implementation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d}.title{font-size:30px;font-weight:700}.name{font-size:23px;font-weight:700}.body{font-size:17px;fill:#435570}.small{font-size:15px;fill:#52647b}.label{font-size:15px;fill:#435570;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}.edge{fill:none;stroke-linejoin:round}.control{stroke-dasharray:7 5}</style>
