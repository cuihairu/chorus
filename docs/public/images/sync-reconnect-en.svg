<text x="1700" y="2603" class="small" text-anchor="middle">Same committed version</text>
<text x="1700" y="2627" class="small" text-anchor="middle">tick 131 / v132</text>
<rect x="74" y="2684" width="1736" height="74" rx="10" fill="#fff7ed" stroke="#fdba74"/>
<text x="96" y="2711" class="body" text-anchor="start">Baseline overflow / missing base ⇒ request a newer full snapshot. Epoch change ⇒ refresh route and rebaseline.</text>
<text x="96" y="2736" class="body" text-anchor="start">Already finished ⇒ return frozen result and settlement progress; never restart the battle.</text>
<text x="34" y="2847" class="small">Time flows downward. t01… are ordering markers, not milliseconds. Target contract; implemented gaps remain in TODO.</text>
