<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1310" viewBox="0 0 1100 1310" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Streamer lifecycle</title>
<desc id="desc">A streamer survives connections and individual rounds. Target lifecycle; implementation and acceptance are tracked separately.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b4d}.title{font-size:28px;font-weight:700}.name{font-size:21px;font-weight:700}.body{font-size:16px;fill:#435570}.small{font-size:15px;fill:#52647b}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1100" height="1310" rx="20" fill="#f8fafc"/>
<text x="35" y="45" class="title">Streamer lifecycle</text>
<text x="35" y="76" class="body">A streamer survives connections and individual rounds.</text>
<rect x="35" y="110" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="143" class="name">01  Launch the gameplay</text>
<text x="55" y="172" class="body">PlatformGateway verifies launch identity.</text>
<path d="M335 194 V226" class="edge"/>
<rect x="35" y="226" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="259" class="name">02  Login and load the streamer</text>
<text x="55" y="288" class="body">StreamerServer restores profile and session.</text>
<path d="M335 310 V342" class="edge"/>
<rect x="35" y="342" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="375" class="name">03  Activate a gameplay binding</text>
<text x="55" y="404" class="body">Register live session + BindingId + generation.</text>
<path d="M335 426 V458" class="edge"/>
<rect x="35" y="458" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="491" class="name">04  Queue and prepare a room</text>
<text x="55" y="520" class="body">ControlServer assigns; GameServer prepares RoomActor.</text>
<path d="M335 542 V574" class="edge"/>
<rect x="35" y="574" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="607" class="name">05  Confirm routing; enter the round</text>
<text x="55" y="636" class="body">Commit participation; Gateway installs and ACKs route.</text>
<path d="M335 658 V690" class="edge"/>
<rect x="35" y="690" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="723" class="name">06  Play and observe authoritative state</text>
<text x="55" y="752" class="body">Platform events are pushed to the target RoomActor.</text>
<path d="M335 774 V806" class="edge"/>
<rect x="35" y="806" width="600" height="84" rx="10" fill="#fff" stroke="#a5bdcc"/>
<text x="55" y="839" class="name">07  Freeze the result; settle late input</text>
<text x="55" y="868" class="body">Battle ticks stop; accepted inputs still get a disposition.</text>
<path d="M335 890 V922" class="edge"/>
<rect x="35" y="922" width="600" height="84" rx="10" fill="#eef8f5" stroke="#a5bdcc"/>
<text x="55" y="955" class="name">08  Wait for delivery-stop confirmation</text>
<text x="55" y="984" class="body">ControlServer collects the versioned close barrier.</text>
<path d="M335 1006 V1038" class="edge"/>
<rect x="35" y="1038" width="600" height="84" rx="10" fill="#eef8f5" stroke="#a5bdcc"/>
<text x="55" y="1071" class="name">09  Wait for platform close and settlement</text>
<text x="55" y="1100" class="body">Only after the barrier may Gateway notify the platform.</text>
<path d="M335 1122 V1154" class="edge"/>
<rect x="35" y="1154" width="600" height="84" rx="10" fill="#eef8f5" stroke="#a5bdcc"/>
<text x="55" y="1187" class="name">10  Release the round; retire its actor</text>
<text x="55" y="1216" class="body">Finalize first; destroy old actor; restore eligibility.</text>
<path d="M635 732 H685" class="edge"/>
<rect x="685" y="690" width="385" height="110" rx="10" fill="#fff6e8" stroke="#ddbc88"/>
<text x="702" y="719" class="name">Unexpected disconnect</text>
<text x="702" y="748" class="body">Round continues; resume the same round.</text>
<text x="702" y="775" class="body">Offline streamers are not auto-queued.</text>
<path d="M635 1196 H685" class="edge"/>
<rect x="685" y="1154" width="385" height="110" rx="10" fill="#fff6e8" stroke="#ddbc88"/>
<text x="702" y="1183" class="name">Continue or exit</text>
<text x="702" y="1212" class="body">Online + eligible: queue for another round.</text>
<text x="702" y="1239" class="body">Exit: close binding; keep profile and results.</text>
<text x="35" y="1291" class="small">Target design · Durable acceptance ≠ applied effect · Close ACK precedes platform-end call</text>
</svg>
