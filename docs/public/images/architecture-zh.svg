<path d="M300 470 V900 H1140 V1030" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="battle-sync" data-from="streamer-gateway" data-to="game-server" d="M300 470 V900 H1140 V1030" class="edge" style="stroke:#2563eb;stroke-width:3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M1200 420 H1260 V1155 H1240" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="platform-events" data-from="platform-gateway" data-to="game-server" d="M1200 420 H1260 V1155 H1240" class="edge" style="stroke:#087f5b;stroke-width:3" marker-end="url(#arrow)"/>
