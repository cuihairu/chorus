<path d="M980 1350 V1480" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="game-data" data-from="game-server" data-to="data-server" d="M980 1350 V1480" class="edge" style="stroke:#7c3aed;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M640 1640 V1730" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="business-db" data-from="data-server" data-to="postgresql" d="M640 1640 V1730" class="edge" style="stroke:#7c3aed;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<g id="streamer-client" data-node="streamer-client"><rect x="40" y="130" width="300" height="100" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="60" y="164" class="name" text-anchor="start">主播客户端</text>
<text x="60" y="195" class="body" text-anchor="start">登录 · 操作指令 · 状态</text>
</g>
<g id="gm-client" data-node="gm-client"><rect x="450" y="130" width="300" height="100" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="470" y="164" class="name" text-anchor="start">GM 管理工具 / CLI</text>
<text x="470" y="195" class="body" text-anchor="start">管理客户端，非新增服务进程</text>
</g>
<g id="live-platform" data-node="live-platform"><rect x="900" y="130" width="300" height="100" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="920" y="164" class="name" text-anchor="start">直播平台</text>
<text x="920" y="195" class="body" text-anchor="start">拉起 · 弹幕 · 礼物</text>
</g>
<g id="streamer-gateway" data-node="streamer-gateway"><rect x="40" y="340" width="300" height="130" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="60" y="374" class="name" text-anchor="start">StreamerGateway</text>
<text x="60" y="405" class="body" text-anchor="start">WSS · 限流 · 会话绑定</text>
<text x="60" y="432" class="body" text-anchor="start">战斗输入与帧直接转发</text>
</g>
<g id="platform-gateway" data-node="platform-gateway"><rect x="900" y="340" width="300" height="130" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="920" y="374" class="name" text-anchor="start">PlatformGateway</text>
<text x="920" y="405" class="body" text-anchor="start">验签 · 归一化 · 定向推送</text>
<text x="920" y="432" class="body" text-anchor="start">停止投递确认 → 获准通知平台</text>
</g>
<g id="control-server" data-node="control-server"><rect x="460" y="600" width="360" height="220" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="480" y="634" class="name" text-anchor="start">ControlServer</text>
<text x="480" y="665" class="body" text-anchor="start">进程注册目录 · 调度</text>
<text x="480" y="692" class="body" text-anchor="start">匹配 · 所有权 / epoch</text>
<text x="480" y="719" class="body" text-anchor="start">路由 · 确认与关闭屏障</text>
<text x="480" y="746" class="body" text-anchor="start">恢复 · 结算协调 · Admin</text>
</g>
<g id="node-agent-scope" data-node="node-agent-scope"><rect x="900" y="510" width="320" height="190" rx="12" fill="#fff7ed" stroke="#fdba74"/>
<text x="918" y="539" class="body">本机监管范围 · 目标契约</text>
<text x="918" y="570" class="small">ControlServer · DataServer</text>
<text x="918" y="595" class="small">StreamerServer · GameServer</text>
<text x="918" y="620" class="small">StreamerGateway · PlatformGateway</text>
<text x="918" y="650" class="small">仅监管本机已部署角色，不要求同机齐全</text>
<text x="918" y="676" class="small">进程重启 ≠ 房间业务恢复</text></g>
<path id="agent-supervision" data-from="node-agent" data-to="node-agent-scope" d="M1080 730 V700" class="edge control" style="stroke:#c2410c;stroke-width:2" marker-end="url(#arrow)"/>
<g id="node-agent" data-node="node-agent"><rect x="940" y="730" width="260" height="130" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="960" y="764" class="name" text-anchor="start">NodeAgent</text>
<text x="960" y="795" class="body" text-anchor="start">每机一个 · 计划幂等</text>
<text x="960" y="822" class="body" text-anchor="start">启停 / 重启 / 进程树回收</text>
</g>
<g id="streamer-server" data-node="streamer-server"><rect x="40" y="1030" width="520" height="320" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="60" y="1064" class="name" text-anchor="start">StreamerServer</text>
<text x="60" y="1095" class="body" text-anchor="start">StreamerActor × N</text>
<text x="60" y="1122" class="body" text-anchor="start">登录 / 恢复 · 个人业务</text>
<text x="60" y="1149" class="body" text-anchor="start">直播挂载注册 · 匹配意图</text>
<text x="60" y="1176" class="body" text-anchor="start">参与关系与生命周期投影</text>
<text x="60" y="1203" class="body" text-anchor="start">资料 · 经业务校验的资产操作</text>
<text x="60" y="1230" class="body" text-anchor="start">终局释放后更新下一局资格</text>
</g>
<g id="game-server" data-node="game-server"><rect x="720" y="1030" width="520" height="320" rx="14" fill="#eef8f5" stroke="#86c9b3" stroke-width="1.5"/>
<text x="740" y="1064" class="name" text-anchor="start">GameServer</text>
<text x="740" y="1095" class="body" text-anchor="start">一个进程 · 共享线程池</text>
</g>
<path d="M1240 1155 H1220" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="game-runtime-entry" data-from="game-server" data-to="room-runtime" d="M1240 1155 H1220" class="edge" style="stroke:#087f5b;stroke-width:3" marker-end="url(#arrow)"/>
<g id="room-runtime" data-node="room-runtime"><rect x="740" y="1120" width="480" height="70" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="760" y="1154" class="name" text-anchor="start">RoomRuntime</text>
</g>
<text x="1200" y="1168" class="small" text-anchor="end">RoomId → RoomActor</text>
<rect id="room-actor-A" data-node="room-actor-A" x="740" y="1230" width="150" height="65" rx="10" fill="#fff" stroke="#86c9b3"/>
<text x="815" y="1257" class="body" text-anchor="middle">RoomActor A</text>
<text x="815" y="1282" class="small" text-anchor="middle">独立串行 Tick</text>
