<path id="platform-route" data-from="control-server" data-to="platform-gateway" d="M820 650 H860 V405 H900" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M820 760 H940" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="agent-plan" data-from="control-server" data-to="node-agent" d="M820 760 H940" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M520 820 V965 H300 V1030" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="streamer-coordination" data-from="control-server" data-to="streamer-server" d="M520 820 V965 H300 V1030" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M760 820 V965 H940 V1030" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="game-coordination" data-from="control-server" data-to="game-server" d="M760 820 V965 H940 V1030" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M640 820 V1480" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="control-store" data-from="control-server" data-to="data-server" d="M640 820 V1480" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M460 790 H20 V1770 H200" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="control-db" data-from="control-server" data-to="postgresql" d="M460 790 H20 V1770 H200" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
