<path id="runtime-actor-A" data-from="room-runtime" data-to="room-actor-A" d="M815 1190 V1230" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
<rect id="room-actor-B" data-node="room-actor-B" x="905" y="1230" width="150" height="65" rx="10" fill="#fff" stroke="#86c9b3"/>
<text x="980" y="1257" class="body" text-anchor="middle">RoomActor B</text>
<text x="980" y="1282" class="small" text-anchor="middle">独立串行 Tick</text>
<path d="M980 1190 V1230" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="runtime-actor-B" data-from="room-runtime" data-to="room-actor-B" d="M980 1190 V1230" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
<rect id="room-actor-N" data-node="room-actor-N" x="1070" y="1230" width="150" height="65" rx="10" fill="#fff" stroke="#86c9b3"/>
<text x="1145" y="1257" class="body" text-anchor="middle">RoomActor N</text>
<text x="1145" y="1282" class="small" text-anchor="middle">独立串行 Tick</text>
<path d="M1145 1190 V1230" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="runtime-actor-N" data-from="room-runtime" data-to="room-actor-N" d="M1145 1190 V1230" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
<text x="740" y="1326" class="small" text-anchor="start">每房间独立持有：状态 · epoch · 订阅者</text>
<g id="data-server" data-node="data-server"><rect x="200" y="1480" width="880" height="160" rx="14" fill="#edf5ff" stroke="#93b9e3" stroke-width="1.5"/>
<text x="220" y="1514" class="name" text-anchor="start">DataServer</text>
<text x="220" y="1545" class="body" text-anchor="start">仅数据读写 · 事务 · 去重 · 版本 / epoch 约束</text>
<text x="220" y="1572" class="body" text-anchor="start">输入 · 帧 · 快照 · 资料 · 资产账本 · 回执</text>
<text x="220" y="1599" class="body" text-anchor="start">不选择事件房间、不匹配选人、不编排结算或平台通知</text>
</g>
<g id="postgresql" data-node="postgresql"><rect x="200" y="1730" width="880" height="80" rx="14" fill="#edf5ff" stroke="#93b9e3" stroke-width="1.5"/>
<text x="220" y="1764" class="name" text-anchor="start">PostgreSQL</text>
<text x="220" y="1795" class="body" text-anchor="start">共同权威存储 · 控制与业务 schema 隔离</text>
</g>
<text x="205" y="285" class="label" text-anchor="start">WSS</text>
<text x="1065" y="285" class="label" text-anchor="start">HTTPS</text>
<text x="660" y="315" class="label" text-anchor="start" style="fill:#c2410c">Admin 统一入口 · 授权 / 审计</text>
<text x="391" y="542" class="label" text-anchor="start">路由</text>
<text x="391" y="565" class="label" text-anchor="start">epoch</text>
<text x="835" y="515" class="label" text-anchor="start">路由 ↓</text>
<text x="835" y="538" class="label" text-anchor="start">确认 ↑</text>
<text x="880" y="742" class="label" text-anchor="middle">计划 →</text>
<text x="880" y="789" class="label" text-anchor="middle">← 状态</text>
<text x="165" y="700" class="label" text-anchor="start">登录 / 个人业务</text>
<text x="380" y="882" class="label" text-anchor="start" style="fill:#2563eb">战斗输入上行 / 已提交帧下行</text>
<text x="315" y="995" class="label" text-anchor="start">↑ 挂载注册 / 匹配意图</text>
<text x="315" y="1016" class="label" text-anchor="start">↓ 参与结果 / 生命周期</text>
<text x="925" y="995" class="label" text-anchor="end">↑ 进程注册 / 状态上报</text>
<text x="925" y="1016" class="label" text-anchor="end">↓ 分配 / 接管 / 结束 / 销毁</text>
<text transform="translate(1246 1010) rotate(-90)" class="small" style="fill:#087f5b">已验证平台事件 → 目标房间</text>
<text x="315" y="1408" class="label" text-anchor="start" style="fill:#7c3aed">资料读写 / 资产事务</text>
<text x="995" y="1408" class="label" text-anchor="start" style="fill:#7c3aed">帧提交 / 恢复</text>
<text x="655" y="1458" class="label" text-anchor="start">控制事务协调</text>
<text x="655" y="1695" class="label" text-anchor="start" style="fill:#7c3aed">业务 schema 读写</text>
<text x="40" y="1700" class="label" text-anchor="start">节点 / 所有权 / 租约记录读写</text>
<text x="40" y="1840" class="small" text-anchor="start">虚线：控制关系 · 实线：业务数据 · 无圆点的交叉不表示连通</text>
<text x="40" y="1865" class="small" text-anchor="start">计算 → 提交成功 → 发布 · NodeAgent 监管本机各角色 · 图示主要进程关系</text>
<text x="40" y="1890" class="small">建表 / 改表：部署时由 SchemaTool 执行；ControlServer / DataServer 启动只校验，不自动建表。</text>
</svg>
