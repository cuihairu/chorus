<path d="M600 230 V280 H640 V600" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="gm-admin" data-from="gm-client" data-to="control-server" d="M600 230 V280 H640 V600" class="edge" style="stroke:#c2410c;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M460 650 H380 V405 H340" fill="none" stroke="#f8fafc" stroke-width="9"/>
