<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1170" viewBox="0 0 1200 1170" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">Chorus 进程架构与房间运行时</title>
<desc id="desc">七类进程。ControlServer 分配所有权，NodeAgent 监管本机进程。网关连接主播和直播平台，StreamerServer 管理主播。GameServer 内由 RoomRuntime 管理多个 RoomActor。DataServer 将输入、帧及结算持久化到 PostgreSQL。虚线为控制关系，实线为业务数据。重设计架构，集成持续进行中。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d}.title{font-size:29px;font-weight:700}.name{font-size:22px;font-weight:700}.body{font-size:17px;fill:#435570}.small{font-size:15px;fill:#52647b}.label{font-size:15px;fill:#435570;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.control{stroke-dasharray:7 5}.box{stroke-width:1.5}</style>
<rect width="1200" height="1170" rx="20" fill="#f8fafc"/>

<text x="40" y="48" class="title" text-anchor="start">Chorus · 进程架构</text>
<text x="40" y="78" class="body" text-anchor="start">七类进程 · 每个 GameServer 承载多个房间 · 重设计架构，持续集成中</text>
<rect x="40" y="115" width="300" height="115" rx="12" fill="#eef2ff" stroke="#a5b4fc" class="box"/>
<text x="60" y="149" class="name" text-anchor="start">NodeAgent</text>
<text x="60" y="177" class="body" text-anchor="start">每台机器一个</text>
<text x="60" y="202" class="body" text-anchor="start">进程启停 · 进程树监管</text>
<rect x="410" y="115" width="750" height="115" rx="12" fill="#eef2ff" stroke="#a5b4fc" class="box"/>
<text x="430" y="149" class="name" text-anchor="start">ControlServer</text>
<text x="430" y="177" class="body" text-anchor="start">节点目录 · 部署调度 · 匹配协调 · 所有权 / epoch / 租约</text>
<text x="430" y="202" class="body" text-anchor="start">决定房间归属，不执行游戏 Tick</text>
<path d="M410 173 H340" class="edge control"/>
<text x="375" y="150" class="label" text-anchor="middle">计划</text>
<text x="40" y="262" class="small" text-anchor="start">NodeAgent 监管所在机器上的各类服务进程。</text>
<path d="M1160 173 H1180 V460 H1160" class="edge control"/>
<rect x="40" y="305" width="220" height="105" rx="12" fill="#ffffff" stroke="#cbd5e1" class="box"/>
<text x="60" y="339" class="name" text-anchor="start">主播客户端</text>
<text x="60" y="367" class="body" text-anchor="start">登录 · 操作指令</text>
<text x="60" y="392" class="body" text-anchor="start">快照 · 对局结果</text>
<rect x="310" y="305" width="270" height="105" rx="12" fill="#ffffff" stroke="#cbd5e1" class="box"/>
<text x="330" y="339" class="name" text-anchor="start">StreamerGateway</text>
<text x="330" y="367" class="body" text-anchor="start">WSS · 限流 · 路由</text>
<text x="330" y="392" class="body" text-anchor="start">连接管理 · 状态下发</text>
<rect x="650" y="305" width="510" height="105" rx="12" fill="#ffffff" stroke="#cbd5e1" class="box"/>
<text x="670" y="339" class="name" text-anchor="start">StreamerServer</text>
<text x="670" y="367" class="body" text-anchor="start">StreamerActor × N · 登录 / 恢复</text>
<text x="670" y="392" class="body" text-anchor="start">玩法挂载 · 主播个人业务</text>
<path d="M260 357 H310" marker-start="url(#arrow)" class="edge"/>
<path d="M580 357 H650" marker-start="url(#arrow)" class="edge"/>
<text x="285" y="339" class="label" text-anchor="middle">WSS</text>
<text x="615" y="339" class="label" text-anchor="middle">RPC</text>
<rect x="40" y="475" width="220" height="105" rx="12" fill="#ffffff" stroke="#cbd5e1" class="box"/>
<text x="60" y="509" class="name" text-anchor="start">直播平台</text>
<text x="60" y="537" class="body" text-anchor="start">启动凭据</text>
<text x="60" y="562" class="body" text-anchor="start">弹幕 · 礼物</text>
<rect x="310" y="475" width="270" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1" class="box"/>
<text x="330" y="509" class="name" text-anchor="start">PlatformGateway</text>
<text x="330" y="537" class="body" text-anchor="start">凭据验证 · 回调适配</text>
<text x="330" y="562" class="body" text-anchor="start">事件持久接收</text>
<text x="330" y="587" class="body" text-anchor="start">外部平台任务执行</text>
<path d="M260 527 H310" class="edge"/>
<rect x="650" y="460" width="510" height="280" rx="12" fill="#eef8f5" stroke="#86c9b3" class="box"/>
<text x="670" y="494" class="name" text-anchor="start">GameServer</text>
<text x="670" y="519" class="body" text-anchor="start">一个进程 · 共享线程池</text>
<rect x="670" y="538" width="470" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" class="box"/>
<text x="690" y="572" class="name" text-anchor="start">RoomRuntime</text>
<text x="1120" y="581" class="small" text-anchor="end">RoomId → RoomActor</text>
<path d="M905 410 V460" marker-start="url(#arrow)" class="edge"/>
<text x="920" y="438" class="label" text-anchor="start">订阅 / 同步</text>
<path d="M740 608 V632" class="edge"/>
<rect x="670" y="632" width="150" height="70" rx="9" fill="#fff" stroke="#86c9b3"/>
<text x="745" y="659" class="body" text-anchor="middle">RoomActor A</text>
<text x="745" y="684" class="small" text-anchor="middle">独立串行 Tick</text>
<path d="M900 608 V632" class="edge"/>
<rect x="830" y="632" width="150" height="70" rx="9" fill="#fff" stroke="#86c9b3"/>
<text x="905" y="659" class="body" text-anchor="middle">RoomActor B</text>
<text x="905" y="684" class="small" text-anchor="middle">独立串行 Tick</text>
<path d="M1060 608 V632" class="edge"/>
<rect x="990" y="632" width="150" height="70" rx="9" fill="#fff" stroke="#86c9b3"/>
<text x="1065" y="659" class="body" text-anchor="middle">RoomActor N</text>
<text x="1065" y="684" class="small" text-anchor="middle">独立串行 Tick</text>
<text x="670" y="724" class="small" text-anchor="start">每房间独立持有：状态 · epoch · 订阅者</text>
<path d="M445 605 V810" class="edge"/>
<text x="460" y="686" class="label" text-anchor="start">持久接收事件</text>
<path d="M760 810 V740" class="edge"/>
<text x="745" y="766" class="label" text-anchor="end">ReadInbox(RoomId)</text>
<text x="745" y="790" class="small" text-anchor="end">RoomActor 按房间读取输入</text>
<path d="M1010 740 V810" class="edge"/>
<text x="1025" y="766" class="label">CommitFrame</text>
<text x="1025" y="790" class="small">消费确认 + 提交帧</text>
<rect x="310" y="810" width="850" height="165" rx="12" fill="#edf5ff" stroke="#93b9e3" class="box"/>
<text x="330" y="844" class="name" text-anchor="start">DataServer</text>
<text x="330" y="872" class="body">事件去重 → 根据挂载与局边界固定归属 → 按 RoomId 保存持久 Inbox</text>
<text x="330" y="897" class="body" text-anchor="start">持久收件箱 · 帧日志 · 快照 · 资料 · 资产账本 · 结算 · Outbox</text>
<text x="330" y="947" class="body" text-anchor="start">事务 + 幂等回执 + 写入端 owner / epoch 校验</text>
<text x="330" y="922" class="small">输入链路：先持久接收，再由 RoomActor 读取、计算并提交，成功后发布。</text>
<path d="M735 975 V1018" class="edge"/>
<rect x="310" y="1018" width="850" height="70" rx="12" fill="#edf5ff" stroke="#93b9e3" class="box"/>
<text x="330" y="1052" class="name" text-anchor="start">PostgreSQL</text>
<text x="1140" y="1061" class="small" text-anchor="end">共同权威存储 · 控制与业务 schema</text>
<text x="40" y="848" class="name" text-anchor="start">每 Tick 的执行契约</text>
<text x="40" y="879" class="small" text-anchor="start">读取输入 → 计算</text>
<text x="40" y="904" class="small" text-anchor="start">提交成功 → 发布</text>
<text x="40" y="929" class="small" text-anchor="start">GameServer 不直接写库</text>
<text x="40" y="1123" class="small" text-anchor="start">实线：业务数据　虚线：控制关系　仅展示主链路，省略部分 RPC。</text>
<text x="40" y="1148" class="small" text-anchor="start">ControlServer 同时访问 PostgreSQL；StreamerServer 同时使用 DataServer。</text>
</svg>
